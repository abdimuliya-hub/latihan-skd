 E. dr. K.R.T. Radjiman Wedyodiningrat\nBPUPKI diketuai dr. K.R.T. Radjiman Wedyodiningrat. Soekarno dan Hatta kemudian memimpin PPKI.","tables":[],"figs":[],"id":601},{"cat":"twk-pancasila","q":"Pidato \"Lahirnya Pancasila\" yang disampaikan pada sidang BPUPKI tanggal 1 Juni 1945 diucapkan oleh ....","opts":["Drs. Mohammad Hatta","Mohammad Yamin","Prof. Dr. Soepomo","Ir. Soekarno","Ki Bagus Hadikusumo"],"a":3,"why":"Kunci: D. Ir. Soekarno\nSoekarno menyampaikan lima dasar negara pada 1 Juni 1945. Yamin berpidato 29 Mei dan Soepomo 31 Mei 1945.","tables":[],"figs":[],"id":602},{"cat":"twk-pancasila","q":"Hari Lahir Pancasila diperingati setiap tanggal ....","opts":["1 Oktober","22 Juni","17 Agustus","1 Juni","18 Agustus"],"a":3,"why":"Kunci: D. 1 Juni\nTanggal 1 Juni berkaitan dengan pidato Soekarno (ditetapkan melalui Keppres No. 24 Tahun 2016). 1 Oktober adalah Hari Kesaktian Pancasila.","tables":[],"figs":[],"id":603},{"cat":"twk-pancasila","q":"Rancangan Pembukaan UUD yang disebut Piagam Jakarta dihasilkan oleh Panitia Sembilan pada tanggal ....","opts":["1 Juni 1945","22 Juni 1945","7 Agustus 1945","29 Mei 1945","18 Agustus 1945"],"a":1,"why":"Kunci: B. 22 Juni 1945\nPanitia Sembilan menyusun Piagam Jakarta pada 22 Juni 1945. PPKI mengesahkan UUD dan dasar negara pada 18 Agustus 1945.","tables":[],"figs":[],"id":604},{"cat":"twk-pancasila","q":"Rumusan sila pertama dalam Piagam Jakarta berbunyi ....","opts":["Ketuhanan yang berkebudayaan","Ketuhanan Yang Maha Esa","Kepercayaan kepada Tuhan Yang Maha Esa","Kemanusiaan yang adil dan beradab","Ketuhanan dengan kewajiban menjalankan syariat Islam bagi pemeluk-pemeluknya"],"a":4,"why":"Kunci: E. Ketuhanan dengan kewajiban menjalankan syariat Islam bagi pemeluk-pemeluknya\nPada 18 Agustus 1945 rumusan itu diubah menjadi \"Ketuhanan Yang Maha Esa\" agar mencakup seluruh bangsa.","tables":[],"figs":[],"id":605},{"cat":"twk-pancasila","q":"Pancasila secara resmi disahkan sebagai dasar negara oleh ....","opts":["Konstitu   Object.keys(b.best || {}).forEach(k => { best[k] = Math.max(best[k] || 0, b.best[k]); });

  if (S.kind === "topic") S.best["c:" + S.catId] = Math.max(S.best["c:" + S.catId] || 0, correct);

    [totStart, "kali masuk mengerjakan"], [runs.length, "sesi selesai sampai akhir"],
    [ans, "soal terjawab"], [pctTxt(cor, ans), "benar (" + cor + " benar, " + (ans - cor) + " salah)"],
    [sims.length, "simulasi selesai"], [simAvg == null ? "-" : simAvg, "rata-rata skor simulasi" + (simBest != null ? " · terbaik " + simBest : "")]
  ].map(([v, l]) => `<div class="tile"><div class="v num">${v}</div><div class="l">${esc(l)}</div></div>`).join("");
  const rows = perCat.map(r => {
    const acc = r.seen ? Math.round(r.ok / r.seen * 100) : null;
    const w = r.seen ? (r.ok / r.seen * 100) : 0;
    return `<li class="srow"><div class="h"><b>${esc(r.c.name)}</b><span class="pc num ${acc == null ? "" : acc < 60 ? "lo" : acc >= 80 ? "hi" : ""}">${acc == null ? "belum ada" : acc + "% benar"}</span></div>
      <div class="meterbar" role="img" aria-label="${r.ok} benar dari ${r.seen}"><i class="g" style="width:${w}%"></i><i class="r" style="width:${r.seen ? 100 - w : 0}%"></i></div>
      <div class="sub"><span>Tuntas ${r.full}× penuh (${r.n} soal)</span><span>Masuk ${r.start}×</span><span>Soal dikerjakan minimal 1×: ${r.cover}/${r.n}</span><span>${r.ok} benar · ${r.seen - r.ok} salah</span>${r.last ? `<span>Terakhir ${r.last.ok}/${r.last.n}</span>` : ""}</div></li>`;
  }).join("");
  const dfmt = t => new Date(t).toLocaleDateString("id-ID", { day: "numeric", month: "short" });
  const hist = sims.slice(-8).reverse().map(r => `<li><span>${dfmt(r.t)} · ${r.ok}/${r.n} benar</span><b class="num">${r.ok * 5}</b></li>`).join("");
  const conf = S.confirm === "reset" ? `<div class="confirm"><p>Hapus semua statistik dan skor terbaik di perangkat ini? Tidak bisa dibatalkan.</p><div class="row"><button class="btn solid" data-act="reset-yes">Ya, hapus</button><button class="btn ghost" data-act="confirm-no">Batal</button></div></div>` : "";
  return `
  <div class="qbar"><button class="exit" data-act="home">Kembali</button><div class="ttl">Statistik belajar</div></div>
  ${STORE_WARN}${liveBadge()}
  <div class="tiles">${tiles}</div>
  <h2 class="sec">Per topik</h2>
  <ul class="topics" style="gap:8px">${rows}</ul>
  <h2 class="sec" style="margin-top:24px">Simulasi terakhir</h2>
  ${hist ? `<ul class="slist">${hist}</ul>` : `<p class="note">Belum ada simulasi yang selesai.</p>`}
  <div class="note"><p>Data tersimpan di browser perangkat ini saja. Membuka dari HP dan laptop menghasilkan statistik terpisah, dan menghapus data situs akan menghapusnya. Sesi yang ditutup di tengah jalan hanya dihitung pada "kali masuk".</p></div>
  ${conf}
  <div style="margin-top:16px"><button class="btn danger" data-act="reset">Hapus semua statistik</button></div>`;
}

function resultHTML() {
  const r = S.res, pct = Math.round(r.correct / r.total * 100);
  const mm = String(Math.floor(r.secs / 60)).padStart(2, "0") + ":" + String(r.secs % 60).padStart(2, "0");
  let head;
  if (S.kind === "sim") {
    const pass = r.score >= SIM_REF;
    head = `<div class="eyebrow">Hasil simulasi · waktu ${mm}</div><div class="big num">${r.score}<span> / ${r.total * 5}</span></div><span class="chip ${pass ? "ok" : "bad"}">${pass ? "Di atas" : "Di bawah"} acuan ${SIM_REF}</span><div>${r.correct} dari ${r.total} soal benar</div>`;
  } else {
    head = `<div class="eyebrow">${esc(S.kind === "mix" ? "Acak semua topik TIU" : S.kind === "tkp" ? "Acak semua topik TKP" : S.kind === "twk" ? "Acak semua topik TWK" : catName(S.catId))} · waktu ${mm}</div><div class="big num">${r.correct}<span> / ${r.total}</span></div><div>${pct}% benar</div>`;
  }
  let brk = "";
  if (S.kind !== "topic") {
    brk = `<h2 class="sec">Per topik</h2><ul class="brk">` + CATS.filter(c => r.per[c.id]).map(c => {
      const p = r.per[c.id];
      return `<li><div><b>${esc(c.name)}</b><div class="eyebrow">${p.c} dari ${p.n} benar</div></div><div class="meter">${p.marks.map(m => `<span class="dot ${m ? "on" : ""}"></span>`).join("")}</div></li>`;
    }).join("") + `</ul>`;
  }
  const rev = S.list.map((q, i) => {
    const a = S.ans[i], ok = a === q.a;
    const st = a == null ? ["skip", "Kosong"] : ok ? ["ok", "Benar"] : ["bad", "Salah"];
    const mine = a == null ? "Tidak dijawab" : LET[a] + (isSvg(q.opts[a]) ? ` <span class="mini">${q.opts[a].svg}</span>` : ". " + rich(q.opts[a]));
    const right = LET[q.a] + (isSvg(q.opts[q.a]) ? ` <span class="mini">${q.opts[q.a].svg}</span>` : ". " + rich(q.opts[q.a]));
    return `<details class="r"><summary><span class="st ${st[0]}">${st[1]}</span><span class="sn">${i + 1}. ${rich(q.q.split("\n")[0])}</span></summary><div class="bd"><p class="full">${rich(q.q)}</p>${tablesHTML(q)}${figsHTML(q)}<p class="ansline"><b>Jawabanmu:</b> ${mine}<br><b>Jawaban benar:</b> ${right}</p><p class="full"><b>Pembahasan.</b> ${rich(q.why)}</p></div></details>`;
  }).join("");
  return `
  <section class="score">${head}</section>
  ${REPORT_URL ? `<div class="live live-on" role="status"><b>${getNama() ? "Hasil dikirim atas nama " + esc(getNama()) : "Nama belum diisi, hasil tidak dikirim"}</b></div>` : ""}<div class="live live-on" role="status"><b>Sesi ke-${S.h.runs.length} selesai</b><span>${Object.values(S.h.starts).reduce((x, y) => x + y, 0)}× masuk · ${S.h.runs.length} sesi tuntas${LIVE.st === "on" ? " · tersimpan live ke akunmu" : LIVE.st === "ro" || LIVE.st === "local" ? " · tersimpan di perangkat ini" : " · menyinkronkan…"}</span></div>
  <div class="cta">
    <button class="btn primary" data-act="retry"><span>Ulangi${S.kind === "sim" ? " dengan soal acak baru" : ""}</span><span aria-hidden="true">→</span></button>
    <button class="btn ghost" data-act="home"><span>Kembali ke beranda</span></button>
  </div>
  ${brk}
  <h2 class="sec">Pembahasan semua soal</h2>
  <div class="rev">${rev}</div>`;
}

function render() {
  app.innerHTML = S.view === "home" ? homeHTML() : S.view === "quiz" ? quizHTML() : S.view === "stats" ? statsHTML() : resultHTML();
  if (S.view === "quiz") {
    const cur = document.querySelector("#dots .cur");
    const box = document.getElementById("dots");
    if (cur && box) box.scrollLeft = cur.offsetLeft - box.clientWidth / 2 + cur.clientWidth / 2;
    const fb = document.querySelector(".fb, .confirm");
    if (fb) fb.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
  }
}

app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === "sim" || act === "mix" || act === "tkp" || act === "twk") start(act);
  else if (act === "simmin") { S.simMin = +b.dataset.m; render(); }
  else if (act === "topic") start("topic", b.dataset.id);
  else if (act === "retry") start(S.kind, S.catId);
  else if (act === "home") { clearInterval(S.tid); S.confirm = null; S.view = "home"; render(); window.scrollTo(0, 0); }
  else if (act === "pick") {
    const i = +b.dataset.i;
    if (S.kind === "sim") S.ans[S.i] = S.ans[S.i] === i ? null : i;
    else { S.ans[S.i] = i; S.done[S.i] = true; }
    render();
  }
  else if (act === "jump") { S.i = +b.dataset.i; S.confirm = null; render(); window.scrollTo(0, 0); }
  else if (act === "next") { S.i = Math.min(S.list.length - 1, S.i + 1); render(); window.scrollTo(0, 0); }
  else if (act === "prev") { S.i = Math.max(0, S.i - 1); render(); window.scrollTo(0, 0); }
  else if (act === "finish") { if (S.kind === "sim") { S.confirm = "finish"; render(); } else finish(); }
  else if (act === "finish-yes") finish();
  else if (act === "exit") { S.confirm = "exit"; render(); }
  else if (act === "exit-yes") { clearInterval(S.tid); S.view = "home"; S.confirm = null; render(); window.scrollTo(0, 0); }
  else if (act === "stats") { S.view = "stats"; S.confirm = null; render(); window.scrollTo(0, 0); }
  else if (act === "reset") { S.confirm = "reset"; render(); }
  else if (act === "reset-yes") { S.h = blankH(); S.h.r = Date.now(); S.best = {}; saveH(); saveBest(); S.confirm = null; render(); }
  else if (act === "confirm-no") { S.confirm = null; render(); }
});
render();
liveInit();
</script>
