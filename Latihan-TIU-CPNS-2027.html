, lalu menyampaikan hasilnya kepada grup bila memang hoaks, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menyebarkannya ke grup lain agar semua orang waspada, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu.","Tidak menyebarkannya dan menghapus pesan itu, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Tetap menyebarkan informasi tidak terverifikasi.\nB. Skor 3. Menyebarkan tanpa verifikasi.\nC. Skor 5. Kritis, anti-hoaks, dan memberi klarifikasi.\nD. Skor 1. Memperluas penyebaran hoaks.\nE. Skor 4. Aman, tetapi tidak mengedukasi.","tables":[],"figs":[],"id":550},{"cat":"tkp-sosbud","q":"Dalam seleksi pegawai teladan, Anda diminta memilih peserta untuk program pelatihan. Seorang kandidat dari kelompok minoritas memiliki kompetensi paling baik, tetapi sebagian rekan meragukannya karena latar belakangnya. Keputusan Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Memilih kandidat lain yang diterima semua rekan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian.","Memilihnya berdasarkan kompetensi dan menjelaskan kriteria penilaian secara terbuka kepada semua pihak, sambil mengikuti perkembangan keadaan.","Mencoret kandidat itu karena latar belakangnya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian.","Memilihnya, tetapi menambah satu peserta lain untuk meredam keberatan, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai.","Menunda keputusan sampai suasana lebih tenang, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Mengutamakan penerimaan daripada keadilan.\nB. Skor 5. Adil, objektif, dan transparan.\nC. Skor 1. Diskriminatif.\nD. Skor 4. Adil, tetapi mengikuti tekanan.\nE. Skor 3. Menunda keputusan yang seharusnya objektif.","tables":[],"figs":[],"id":551},{"cat":"tkp-sosbud","q":"Warga di sebuah desa binaan Anda memiliki kebiasaan mengatur waktu kegiatan sesuai adat yang menurut Anda kurang efisien dan sulit berubah. Anda ditugaskan membantu peningkatan kesejahteraan mereka. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Memberi penyuluhan mengenai cara yang lebih efisien kepada warga, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan.","Memaksa warga mengubah kebiasaan agar sesuai dengan program, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan.","Membiarkan kebiasaan itu karena sulit diubah, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian.","Berdialog dengan tokoh masyarakat, memahami alasan kebiasaan tersebut, lalu mengajak mereka mencoba cara baru secara bertahap tanpa meninggalkan nilai-nilai setempat, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menilai warga ketinggalan zaman di depan masyarakat, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Baik, tetapi satu arah.\nB. Skor 2. Tidak menghargai budaya lokal.\nC. Skor 3. Menyerah.\nD. Skor 5. Menghargai budaya dan menawarkan perubahan secara partisipatif.\nE. Skor 1. Merendahkan masyarakat.","tables":[],"figs":[],"id":552},{"cat":"tkp-sosbud","q":"Anda bertugas di daerah dengan adat yang berbeda dari daerah asal Anda. Dalam kegiatan sosial desa, masyarakat setempat meminta Anda mengikuti tata cara adat mereka yang menurut Anda tidak biasa. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Hadir tetapi hanya menjadi penonton tanpa terlibat, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mengikuti tata cara adat dengan hormat, bertanya bila belum paham, dan menjadikannya kesempatan mengenal budaya setempat, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menolak dengan alasan bertentangan dengan kebiasaan Anda, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan.","Menyindir adat itu di depan rekan karena dianggap kuno, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Mengikuti tata cara adat sebisanya agar tidak menyinggung, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Menjaga jarak dari budaya setempat.\nB. Skor 5. Menghormati norma lokal dan beradaptasi.\nC. Skor 2. Tidak menghargai perbedaan.\nD. Skor 1. Meremehkan budaya orang lain.\nE. Skor 4. Cukup baik, tetapi pasif.","tables":[],"figs":[],"id":553},{"cat":"tkp-sosbud","q":"Dalam waktu istirahat, seorang rekan membuat lelucon yang menyinggung suku salah satu anggota tim. Anggota itu tampak tidak nyaman. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Membuat lelucon balasan terhadap suku rekan itu, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian, dengan cara yang menurutnya paling sesuai.","Mengalihkan pembicaraan agar suasana tidak canggung, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan.","Menegur dengan sopan bahwa lelucon itu tidak pantas, menenangkan rekan yang tersinggung, lalu mengajak tim saling menghargai perbedaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Ikut tertawa agar tidak dianggap kaku, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Diam saja karena merasa bukan urusan Anda, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Memperburuk konflik SARA.\nB. Skor 4. Mengurangi dampak, tetapi tidak menegur.\nC. Skor 5. Menolak diskriminasi dan menjaga harmoni.\nD. Skor 2. Ikut mendukung perilaku diskriminatif.\nE. Skor 3. Tidak peduli.","tables":[],"figs":[],"id":554},{"cat":"tkp-sosbud","q":"Terjadi perselisihan antarwarga di pasar tradisional karena perbedaan keyakinan. Anda sebagai ASN setempat diminta membantu meredakannya. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menunggu aparat keamanan menyelesaikannya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mendukung kelompok yang sepaham dengan Anda, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian.","Menyebarkan berita perselisihan itu agar mendapat perhatian publik, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian.","Menemui perwakilan kedua pihak, mendengarkan keluhan secara adil, lalu memfasilitasi dialog bersama tokoh masyarakat untuk mencapai kesepakatan damai, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menyarankan kedua pihak berdamai dan menyerahkan prosesnya kepada tokoh masyarakat, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Pasif.\nB. Skor 2. Tidak netral.\nC. Skor 1. Memperkeruh keadaan.\nD. Skor 5. Netral dan mengutamakan persatuan.\nE. Skor 4. Baik, tetapi kurang terlibat.","tables":[],"figs":[],"id":555},{"cat":"tkp-sosbud","q":"Anda bertugas di daerah dengan adat yang berbeda dari daerah asal Anda. Dalam upacara penyambutan pegawai baru, masyarakat setempat meminta Anda mengikuti tata cara adat mereka yang menurut Anda tidak biasa. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengikuti tata cara adat sebisanya agar tidak menyinggung, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menolak dengan alasan bertentangan dengan kebiasaan Anda, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Hadir tetapi hanya menjadi penonton tanpa terlibat, sesuai dengan keadaan yang sedang dihadapi saat itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian.","Mengikuti tata cara adat dengan hormat, bertanya bila belum paham, dan menjadikannya kesempatan mengenal budaya setempat, dengan cara yang menurutnya paling sesuai.","Menyindir adat itu di depan rekan karena dianggap kuno, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Cukup baik, tetapi pasif.\nB. Skor 2. Tidak menghargai perbedaan.\nC. Skor 3. Menjaga jarak dari budaya setempat.\nD. Skor 5. Menghormati norma lokal dan beradaptasi.\nE. Skor 1. Meremehkan budaya orang lain.","tables":[],"figs":[],"id":556},{"cat":"tkp-sosbud","q":"Anda bertugas di daerah dengan adat yang berbeda dari daerah asal Anda. Dalam acara adat peresmian kantor, masyarakat setempat meminta Anda mengikuti tata cara adat mereka yang menurut Anda tidak biasa. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengikuti tata cara adat dengan hormat, bertanya bila belum paham, dan menjadikannya kesempatan mengenal budaya setempat, menurut penilaian yang dibuat langsung di tempat kejadian.","Menyindir adat itu di depan rekan karena dianggap kuno, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengikuti tata cara adat sebisanya agar tidak menyinggung, sesuai dengan keadaan yang sedang dihadapi saat itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Hadir tetapi hanya menjadi penonton tanpa terlibat, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menolak dengan alasan bertentangan dengan kebiasaan Anda, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Menghormati norma lokal dan beradaptasi.\nB. Skor 1. Meremehkan budaya orang lain.\nC. Skor 4. Cukup baik, tetapi pasif.\nD. Skor 3. Menjaga jarak dari budaya setempat.\nE. Skor 2. Tidak menghargai perbedaan.","tables":[],"figs":[],"id":557},{"cat":"tkp-sosbud","q":"Dalam penugasan di daerah terpencil di lingkungan baru Anda, warga setempat memiliki cara berkomunikasi yang lebih lembut dan tidak langsung dibandingkan kebiasaan Anda yang lugas, sehingga beberapa warga merasa tersinggung. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Membalas dengan nada tinggi saat warga menegur, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan.","Menyatakan bahwa cara berbicara lugas lebih efisien dan warga harus terbiasa, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai.","Tetap berbicara lugas tetapi menambahkan salam dan basa-basi yang sopan, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan.","Menghindari berbicara dengan warga agar tidak menimbulkan kesalahpahaman, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mengamati dan menyesuaikan cara berbicara, meminta maaf bila ada yang tersinggung, serta belajar dari tokoh setempat agar komunikasi efektif, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Memicu konflik.\nB. Skor 2. Memaksakan gaya sendiri.\nC. Skor 4. Menyesuaikan sedikit.\nD. Skor 3. Menarik diri.\nE. Skor 5. Adaptif dan menghormati norma lokal.","tables":[],"figs":[],"id":558},{"cat":"tkp-sosbud","q":"Dalam rapat tim, seorang rekan membuat lelucon yang menyinggung suku salah satu anggota tim. Anggota itu tampak tidak nyaman. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengalihkan pembicaraan agar suasana tidak canggung, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Membuat lelucon balasan terhadap suku rekan itu, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai.","Ikut tertawa agar tidak dianggap kaku, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menegur dengan sopan bahwa lelucon itu tidak pantas, menenangkan rekan yang tersinggung, lalu mengajak tim saling menghargai perbedaan, menurut penilaian yang dibuat langsung di tempat kejadian.","Diam saja karena merasa bukan urusan Anda, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Mengurangi dampak, tetapi tidak menegur.\nB. Skor 1. Memperburuk konflik SARA.\nC. Skor 2. Ikut mendukung perilaku diskriminatif.\nD. Skor 5. Menolak diskriminasi dan menjaga harmoni.\nE. Skor 3. Tidak peduli.","tables":[],"figs":[],"id":559},{"cat":"tkp-sosbud","q":"Dalam penentuan peserta pelatihan, Anda diminta memilih peserta untuk program pelatihan. Seorang kandidat dari kelompok minoritas memiliki kompetensi paling baik, tetapi sebagian rekan meragukannya karena latar belakangnya. Keputusan Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Memilihnya, tetapi menambah satu peserta lain untuk meredam keberatan, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu.","Memilih kandidat lain yang diterima semua rekan, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan.","Memilihnya berdasarkan kompetensi dan menjelaskan kriteria penilaian secara terbuka kepada semua pihak, sambil mengikuti perkembangan keadaan.","Menunda keputusan sampai suasana lebih tenang, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan.","Mencoret kandidat itu karena latar belakangnya, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Adil, tetapi mengikuti tekanan.\nB. Skor 2. Mengutamakan penerimaan daripada keadilan.\nC. Skor 5. Adil, objektif, dan transparan.\nD. Skor 3. Menunda keputusan yang seharusnya objektif.\nE. Skor 1. Diskriminatif.","tables":[],"figs":[],"id":560},{"cat":"tkp-sosbud","q":"Dalam pertemuan dengan tokoh masyarakat di lingkungan baru Anda, warga setempat memiliki cara berkomunikasi yang lebih lembut dan tidak langsung dibandingkan kebiasaan Anda yang lugas, sehingga beberapa warga merasa tersinggung. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyatakan bahwa cara berbicara lugas lebih efisien dan warga harus terbiasa, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan.","Tetap berbicara lugas tetapi menambahkan salam dan basa-basi yang sopan, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian.","Mengamati dan menyesuaikan cara berbicara, meminta maaf bila ada yang tersinggung, serta belajar dari tokoh setempat agar komunikasi efektif, sambil mengikuti perkembangan keadaan.","Membalas dengan nada tinggi saat warga menegur, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menghindari berbicara dengan warga agar tidak menimbulkan kesalahpahaman, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Memaksakan gaya sendiri.\nB. Skor 4. Menyesuaikan sedikit.\nC. Skor 5. Adaptif dan menghormati norma lokal.\nD. Skor 1. Memicu konflik.\nE. Skor 3. Menarik diri.","tables":[],"figs":[],"id":561},{"cat":"tkp-sosbud","q":"Terjadi perselisihan antarwarga di lingkungan perumahan karena perbedaan keyakinan. Anda sebagai ASN setempat diminta membantu meredakannya. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menemui perwakilan kedua pihak, mendengarkan keluhan secara adil, lalu memfasilitasi dialog bersama tokoh masyarakat untuk mencapai kesepakatan damai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menunggu aparat keamanan menyelesaikannya, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Mendukung kelompok yang sepaham dengan Anda, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan.","Menyebarkan berita perselisihan itu agar mendapat perhatian publik, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan.","Menyarankan kedua pihak berdamai dan menyerahkan prosesnya kepada tokoh masyarakat, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Netral dan mengutamakan persatuan.\nB. Skor 3. Pasif.\nC. Skor 2. Tidak netral.\nD. Skor 1. Memperkeruh keadaan.\nE. Skor 4. Baik, tetapi kurang terlibat.","tables":[],"figs":[],"id":562},{"cat":"tkp-sosbud","q":"Anda diminta merancang acara peringatan hari kemerdekaan bagi masyarakat yang beragam latar belakang. Beberapa usulan hanya menampilkan budaya mayoritas. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyerahkan keputusan sepenuhnya kepada panitia lain, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengusulkan agar acara menampilkan beragam budaya dan melibatkan perwakilan seluruh kelompok sejak tahap perencanaan, dengan cara yang menurutnya paling sesuai.","Menolak pertunjukan budaya kelompok lain karena dianggap tidak cocok, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Mengikuti usulan mayoritas karena paling banyak peminatnya, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menambahkan satu pertunjukan budaya kelompok minoritas di akhir acara, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Menghindar dari tanggung jawab.\nB. Skor 5. Inklusif dan partisipatif.\nC. Skor 1. Diskriminatif.\nD. Skor 3. Mengabaikan keberagaman.\nE. Skor 4. Ada upaya, tetapi masih simbolis.","tables":[],"figs":[],"id":563},{"cat":"tkp-sosbud","q":"Dalam kegiatan pelayanan keliling di lingkungan baru Anda, warga setempat memiliki cara berkomunikasi yang lebih lembut dan tidak langsung dibandingkan kebiasaan Anda yang lugas, sehingga beberapa warga merasa tersinggung. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Membalas dengan nada tinggi saat warga menegur, sesuai dengan keadaan yang sedang dihadapi saat itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian.","Menghindari berbicara dengan warga agar tidak menimbulkan kesalahpahaman, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengamati dan menyesuaikan cara berbicara, meminta maaf bila ada yang tersinggung, serta belajar dari tokoh setempat agar komunikasi efektif, menurut penilaian yang dibuat langsung di tempat kejadian.","Tetap berbicara lugas tetapi menambahkan salam dan basa-basi yang sopan, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menyatakan bahwa cara berbicara lugas lebih efisien dan warga harus terbiasa, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Memicu konflik.\nB. Skor 3. Menarik diri.\nC. Skor 5. Adaptif dan menghormati norma lokal.\nD. Skor 4. Menyesuaikan sedikit.\nE. Skor 2. Memaksakan gaya sendiri.","tables":[],"figs":[],"id":564},{"cat":"tkp-sosbud","q":"Warga di sebuah desa binaan Anda memiliki kebiasaan bercocok tanam secara turun-temurun yang menurut Anda kurang efisien dan sulit berubah. Anda ditugaskan membantu peningkatan kesejahteraan mereka. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Memberi penyuluhan mengenai cara yang lebih efisien kepada warga, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut.","Membiarkan kebiasaan itu karena sulit diubah, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menilai warga ketinggalan zaman di depan masyarakat, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai.","Memaksa warga mengubah kebiasaan agar sesuai dengan program, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai.","Berdialog dengan tokoh masyarakat, memahami alasan kebiasaan tersebut, lalu mengajak mereka mencoba cara baru secara bertahap tanpa meninggalkan nilai-nilai setempat, sambil mengikuti perkembangan keadaan."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Baik, tetapi satu arah.\nB. Skor 3. Menyerah.\nC. Skor 1. Merendahkan masyarakat.\nD. Skor 2. Tidak menghargai budaya lokal.\nE. Skor 5. Menghargai budaya dan menawarkan perubahan secara partisipatif.","tables":[],"figs":[],"id":565},{"cat":"tkp-sosbud","q":"Warga di sebuah desa binaan Anda memiliki kebiasaan menyimpan hasil panen dengan cara tradisional yang menurut Anda kurang efisien dan sulit berubah. Anda ditugaskan membantu peningkatan kesejahteraan mereka. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Memberi penyuluhan mengenai cara yang lebih efisien kepada warga, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai.","Membiarkan kebiasaan itu karena sulit diubah, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan.","Memaksa warga mengubah kebiasaan agar sesuai dengan program, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan.","Menilai warga ketinggalan zaman di depan masyarakat, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Berdialog dengan tokoh masyarakat, memahami alasan kebiasaan tersebut, lalu mengajak mereka mencoba cara baru secara bertahap tanpa meninggalkan nilai-nilai setempat, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Baik, tetapi satu arah.\nB. Skor 3. Menyerah.\nC. Skor 2. Tidak menghargai budaya lokal.\nD. Skor 1. Merendahkan masyarakat.\nE. Skor 5. Menghargai budaya dan menawarkan perubahan secara partisipatif.","tables":[],"figs":[],"id":566},{"cat":"tkp-sosbud","q":"Seorang rekan baru yang berkebutuhan khusus (penyandang disabilitas) ditempatkan di bagian administrasi. Beberapa rekan merasa terganggu karena harus menyesuaikan cara kerja. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Bersikap biasa saja dan tidak mencampuri urusannya, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Membantunya bila ia meminta saja, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian.","Menyambutnya dengan ramah, membantu menyesuaikan lingkungan kerja, dan mengajak rekan lain bekerja sama mendukungnya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Membicarakan keterbatasannya di belakang bersama rekan lain, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menyarankan atasan menempatkannya di unit lain, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Netral, tetapi tidak mendukung.\nB. Skor 4. Baik, tetapi menunggu diminta.\nC. Skor 5. Inklusif dan empatik.\nD. Skor 1. Diskriminatif dan merendahkan.\nE. Skor 2. Menghindari tanggung jawab sosial.","tables":[],"figs":[],"id":567},{"cat":"tkp-sosbud","q":"Seorang rekan baru yang berkebutuhan khusus (penyandang disabilitas) ditempatkan di unit pelayanan. Beberapa rekan merasa terganggu karena harus menyesuaikan cara kerja. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyarankan atasan menempatkannya di unit lain, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Bersikap biasa saja dan tidak mencampuri urusannya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai.","Membantunya bila ia meminta saja, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Membicarakan keterbatasannya di belakang bersama rekan lain, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai.","Menyambutnya dengan ramah, membantu menyesuaikan lingkungan kerja, dan mengajak rekan lain bekerja sama mendukungnya, dengan cara yang menurutnya paling sesuai."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Menghindari tanggung jawab sosial.\nB. Skor 3. Netral, tetapi tidak mendukung.\nC. Skor 4. Baik, tetapi menunggu diminta.\nD. Skor 1. Diskriminatif dan merendahkan.\nE. Skor 5. Inklusif dan empatik.","tables":[],"figs":[],"id":568},{"cat":"tkp-sosbud","q":"Instansi Anda mengadakan lokakarya tahunan yang bertepatan dengan hari besar agama sebagian rekan. Beberapa rekan meminta kegiatan dijadwal ulang. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mendukung penjadwalan ulang agar semua rekan dapat ikut berpartisipasi dan membantu mengatur jadwal yang disepakati bersama, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menolak penjadwalan ulang karena merepotkan panitia, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian.","Mengusulkan agar rekan yang berhalangan mengikuti kegiatan lain pada hari berbeda, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menyebut permintaan rekan sebagai alasan untuk menghindari pekerjaan, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian.","Mengikuti keputusan panitia tanpa memberi pendapat, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Inklusif dan menghargai perbedaan.\nB. Skor 2. Kurang peka terhadap perbedaan.\nC. Skor 4. Memberi solusi, tetapi tidak mencakup semua.\nD. Skor 1. Meremehkan kebutuhan beragama orang lain.\nE. Skor 3. Pasif.","tables":[],"figs":[],"id":569},{"cat":"tkp-sosbud","q":"Seorang rekan baru yang berkebutuhan khusus (penyandang disabilitas) ditempatkan di tim perencanaan. Beberapa rekan merasa terganggu karena harus menyesuaikan cara kerja. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Membicarakan keterbatasannya di belakang bersama rekan lain, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian.","Membantunya bila ia meminta saja, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian.","Bersikap biasa saja dan tidak mencampuri urusannya, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menyambutnya dengan ramah, membantu menyesuaikan lingkungan kerja, dan mengajak rekan lain bekerja sama mendukungnya, menurut penilaian yang dibuat langsung di tempat kejadian.","Menyarankan atasan menempatkannya di unit lain, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Diskriminatif dan merendahkan.\nB. Skor 4. Baik, tetapi menunggu diminta.\nC. Skor 3. Netral, tetapi tidak mendukung.\nD. Skor 5. Inklusif dan empatik.\nE. Skor 2. Menghindari tanggung jawab sosial.","tables":[],"figs":[],"id":570},{"cat":"tkp-sosbud","q":"Anda diminta merancang acara pameran budaya bagi masyarakat yang beragam latar belakang. Beberapa usulan hanya menampilkan budaya mayoritas. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengikuti usulan mayoritas karena paling banyak peminatnya, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menyerahkan keputusan sepenuhnya kepada panitia lain, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menolak pertunjukan budaya kelompok lain karena dianggap tidak cocok, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menambahkan satu pertunjukan budaya kelompok minoritas di akhir acara, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengusulkan agar acara menampilkan beragam budaya dan melibatkan perwakilan seluruh kelompok sejak tahap perencanaan, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Mengabaikan keberagaman.\nB. Skor 2. Menghindar dari tanggung jawab.\nC. Skor 1. Diskriminatif.\nD. Skor 4. Ada upaya, tetapi masih simbolis.\nE. Skor 5. Inklusif dan partisipatif.","tables":[],"figs":[],"id":571},{"cat":"tkp-sosbud","q":"Instansi Anda mengadakan pertemuan koordinasi yang bertepatan dengan hari besar agama sebagian rekan. Beberapa rekan meminta kegiatan dijadwal ulang. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengusulkan agar rekan yang berhalangan mengikuti kegiatan lain pada hari berbeda, menurut penilaian yang dibuat langsung di tempat kejadian, dengan cara yang menurutnya paling sesuai.","Mendukung penjadwalan ulang agar semua rekan dapat ikut berpartisipasi dan membantu mengatur jadwal yang disepakati bersama, menurut penilaian yang dibuat langsung di tempat kejadian.","Mengikuti keputusan panitia tanpa memberi pendapat, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai.","Menyebut permintaan rekan sebagai alasan untuk menghindari pekerjaan, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai.","Menolak penjadwalan ulang karena merepotkan panitia, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Memberi solusi, tetapi tidak mencakup semua.\nB. Skor 5. Inklusif dan menghargai perbedaan.\nC. Skor 3. Pasif.\nD. Skor 1. Meremehkan kebutuhan beragama orang lain.\nE. Skor 2. Kurang peka terhadap perbedaan.","tables":[],"figs":[],"id":572},{"cat":"tkp-sosbud","q":"Terjadi perselisihan antarwarga di desa tempat Anda bertugas karena perbedaan keyakinan. Anda sebagai ASN setempat diminta membantu meredakannya. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menemui perwakilan kedua pihak, mendengarkan keluhan secara adil, lalu memfasilitasi dialog bersama tokoh masyarakat untuk mencapai kesepakatan damai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menyebarkan berita perselisihan itu agar mendapat perhatian publik, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Mendukung kelompok yang sepaham dengan Anda, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menyarankan kedua pihak berdamai dan menyerahkan prosesnya kepada tokoh masyarakat, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menunggu aparat keamanan menyelesaikannya, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Netral dan mengutamakan persatuan.\nB. Skor 1. Memperkeruh keadaan.\nC. Skor 2. Tidak netral.\nD. Skor 4. Baik, tetapi kurang terlibat.\nE. Skor 3. Pasif.","tables":[],"figs":[],"id":573},{"cat":"tkp-sosbud","q":"Dalam kegiatan kantor, seorang rekan membuat lelucon yang menyinggung suku salah satu anggota tim. Anggota itu tampak tidak nyaman. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menegur dengan sopan bahwa lelucon itu tidak pantas, menenangkan rekan yang tersinggung, lalu mengajak tim saling menghargai perbedaan, menurut penilaian yang dibuat langsung di tempat kejadian.","Ikut tertawa agar tidak dianggap kaku, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan.","Mengalihkan pembicaraan agar suasana tidak canggung, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut.","Membuat lelucon balasan terhadap suku rekan itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Diam saja karena merasa bukan urusan Anda, menurut penilaian yang dibuat langsung di tempat kejadian, dengan cara yang menurutnya paling sesuai."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Menolak diskriminasi dan menjaga harmoni.\nB. Skor 2. Ikut mendukung perilaku diskriminatif.\nC. Skor 4. Mengurangi dampak, tetapi tidak menegur.\nD. Skor 1. Memperburuk konflik SARA.\nE. Skor 3. Tidak peduli.","tables":[],"figs":[],"id":574},{"cat":"tkp-sosbud","q":"Dalam pemilihan ketua panitia, Anda diminta memilih peserta untuk program pelatihan. Seorang kandidat dari kelompok minoritas memiliki kompetensi paling baik, tetapi sebagian rekan meragukannya karena latar belakangnya. Keputusan Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mencoret kandidat itu karena latar belakangnya, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan.","Memilihnya berdasarkan kompetensi dan menjelaskan kriteria penilaian secara terbuka kepada semua pihak, menurut penilaian yang dibuat langsung di tempat kejadian.","Memilih kandidat lain yang diterima semua rekan, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai.","Menunda keputusan sampai suasana lebih tenang, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Memilihnya, tetapi menambah satu peserta lain untuk meredam keberatan, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Diskriminatif.\nB. Skor 5. Adil, objektif, dan transparan.\nC. Skor 2. Mengutamakan penerimaan daripada keadilan.\nD. Skor 3. Menunda keputusan yang seharusnya objektif.\nE. Skor 4. Adil, tetapi mengikuti tekanan.","tables":[],"figs":[],"id":575},{"cat":"tkp-antiradikal","q":"Dalam grup pesan komunitas alumni, seorang rekan membagikan ajakan untuk menolak dasar negara dan menyebut Pancasila bertentangan dengan keyakinan tertentu. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menegur rekan itu secara pribadi agar tidak mengulanginya, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian.","Membiarkan karena itu pendapat pribadinya, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Tidak menyebarkannya, menanggapi dengan santun bahwa Pancasila adalah kesepakatan bersama, lalu melaporkannya kepada atasan bila berulang, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Meninggalkan grup agar tidak terlibat, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Ikut menyebarkan ajakan itu agar dibahas lebih luas, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Baik, tetapi tidak melapor.\nB. Skor 2. Abai terhadap paham yang berbahaya.\nC. Skor 5. Setia pada Pancasila dan bertindak melalui jalur resmi.\nD. Skor 3. Menghindar tanpa menyelesaikan masalah.\nE. Skor 1. Mendukung paham yang bertentangan dengan negara.","tables":[],"figs":[],"id":576},{"cat":"tkp-antiradikal","q":"Dalam acara santai di luar kantor, beberapa peserta mulai mengejek simbol negara dan menyebutnya tidak penting. Anda adalah ASN yang hadir. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Ikut tertawa agar suasana tetap akrab, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan.","Mengingatkan dengan santun bahwa simbol negara perlu dihormati karena melambangkan persatuan, serta mengalihkan diskusi ke hal yang konstruktif, sambil mengikuti perkembangan keadaan.","Meninggalkan acara dengan raut kesal tanpa menyampaikan apa pun, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai.","Diam saja karena tidak ingin berdebat, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan.","Menegur peserta itu seusai acara secara pribadi, sesuai dengan keadaan yang sedang dihadapi saat itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Mendukung sikap yang merendahkan simbol negara.\nB. Skor 5. Menguatkan nasionalisme dengan cara damai.\nC. Skor 2. Tidak membantu meluruskan.\nD. Skor 3. Pasif.\nE. Skor 4. Baik, tetapi tidak langsung.","tables":[],"figs":[],"id":577},{"cat":"tkp-antiradikal","q":"Anda menemukan unggahan di media sosial yang berisi ujaran kebencian terhadap kelompok suku tertentu. Unggahan itu sudah dibagikan banyak orang. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Tidak ikut membagikan, melaporkan unggahan kepada platform dan pihak berwenang, serta menyebarkan informasi yang menyejukkan dan benar, sambil mengikuti perkembangan keadaan.","Membalas unggahan itu dengan kata-kata kasar, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu.","Melaporkan unggahan itu tanpa melakukan hal lain, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian.","Membagikan unggahan itu disertai komentar kemarahan, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian.","Tidak ikut membagikan, tetapi juga tidak melakukan apa pun, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Menolak ujaran kebencian dan aktif mendamaikan.\nB. Skor 2. Memperkeruh suasana.\nC. Skor 4. Baik, tetapi terbatas.\nD. Skor 1. Menyebarkan ujaran kebencian.\nE. Skor 3. Pasif.","tables":[],"figs":[],"id":578},{"cat":"tkp-antiradikal","q":"Anda melihat selebaran yang mengajak masyarakat menolak pemerintah yang sah dan menyebarkan paham yang bertentangan dengan Pancasila di sekitar kantor. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Tidak menyebarkannya, mengamankan selebaran sebagai bukti, dan segera melaporkannya kepada atasan atau aparat berwenang, sambil mengikuti perkembangan keadaan.","Membuang selebaran itu dan tidak membicarakannya lagi, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan.","Membiarkannya karena itu bukan tugas Anda, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut.","Membagikannya kepada rekan agar mereka tahu isinya, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai.","Menyimpannya untuk dibaca lebih dulu sebelum menentukan sikap, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Bertindak sesuai prosedur.\nB. Skor 4. Mencegah penyebaran, tetapi tidak melapor.\nC. Skor 2. Tidak peduli.\nD. Skor 1. Ikut menyebarkan paham terlarang.\nE. Skor 3. Berisiko terpengaruh.","tables":[],"figs":[],"id":579},{"cat":"tkp-antiradikal","q":"Panitia seminar kebangsaan mengusulkan mengundang pembicara yang dikenal sering menyebarkan kebencian terhadap kelompok berbeda dengan alasan \"menarik banyak peserta\". Pendapat Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyerahkan keputusan sepenuhnya kepada ketua panitia, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menolak usulan itu, menjelaskan bahwa acara harus menjunjung persatuan, dan mengusulkan pembicara lain yang kompeten dan menyejukkan, menurut penilaian yang dibuat langsung di tempat kejadian.","Setuju asalkan acara ramai peserta, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan.","Mendukung usulan itu karena pandangan pembicara sejalan dengan Anda, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian.","Menyarankan membatasi isi materi pembicara agar tidak memuat ujaran kebencian, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Pasif.\nB. Skor 5. Menjaga persatuan dan menawarkan alternatif.\nC. Skor 2. Mengutamakan popularitas daripada nilai kebangsaan.\nD. Skor 1. Mendukung paham yang memecah belah.\nE. Skor 4. Cukup baik, tetapi berisiko tidak terkendali.","tables":[],"figs":[],"id":580},{"cat":"tkp-antiradikal","q":"Rekan Anda di unit kerja mengaku sering membaca konten yang menyebut bahwa hanya kelompoknya yang benar dan pihak lain layak dimusuhi. Ia mulai menjauhi rekan yang berbeda keyakinan. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menasihatinya sekali dan berharap ia berubah, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menjaga jarak agar tidak ikut terpengaruh, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengejek keyakinannya di depan rekan lain, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan.","Membiarkan karena itu pilihan pribadinya, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian.","Mendekatinya dengan empati, mengajaknya berdiskusi dengan fakta, mengenalkannya pada sumber yang beragam, dan melibatkan atasan atau tokoh yang dipercaya bila perlu, sambil mengikuti perkembangan keadaan."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Baik, tetapi tidak berkelanjutan.\nB. Skor 3. Menghindar tanpa membantu.\nC. Skor 1. Memperburuk keadaan dan memicu konflik.\nD. Skor 2. Abai terhadap potensi bahaya.\nE. Skor 5. Merangkul, meluruskan, dan melibatkan pihak yang tepat.","tables":[],"figs":[],"id":581},{"cat":"tkp-antiradikal","q":"Anda menemukan unggahan di media sosial yang berisi ujaran kebencian terhadap pendatang dari daerah lain. Unggahan itu sudah dibagikan banyak orang. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Membalas unggahan itu dengan kata-kata kasar, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai.","Tidak ikut membagikan, melaporkan unggahan kepada platform dan pihak berwenang, serta menyebarkan informasi yang menyejukkan dan benar, dengan memperhatikan situasi yang ada pada waktu tersebut.","Membagikan unggahan itu disertai komentar kemarahan, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Melaporkan unggahan itu tanpa melakukan hal lain, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian.","Tidak ikut membagikan, tetapi juga tidak melakukan apa pun, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Memperkeruh suasana.\nB. Skor 5. Menolak ujaran kebencian dan aktif mendamaikan.\nC. Skor 1. Menyebarkan ujaran kebencian.\nD. Skor 4. Baik, tetapi terbatas.\nE. Skor 3. Pasif.","tables":[],"figs":[],"id":582},{"cat":"tkp-antiradikal","q":"Dalam forum diskusi publik, seorang warga menyampaikan kritik keras kepada pemerintah dengan cara santun dan berdasar data. Beberapa orang menuduhnya anti-pemerintah. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mendengarkan kritik itu tetapi tidak menanggapi tuduhan orang lain, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian.","Melaporkan warga itu sebagai ancaman tanpa dasar, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan.","Membedakan kritik konstruktif dari paham radikal, mendengarkan masukan itu, dan menyampaikannya kepada pihak terkait untuk ditindaklanjuti, dengan memperhatikan situasi yang ada pada waktu tersebut.","Membenarkan tuduhan karena kritik itu terasa mengganggu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan.","Menghindari topik itu agar tidak terbawa perdebatan, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Baik, tetapi tidak meluruskan.\nB. Skor 1. Menyalahgunakan wewenang.\nC. Skor 5. Menghargai kritik yang damai.\nD. Skor 2. Menyamakan kritik dengan radikalisme.\nE. Skor 3. Menghindar.","tables":[],"figs":[],"id":583},{"cat":"tkp-antiradikal","q":"Rekan Anda di kantor mengaku sering membaca konten yang menyebut bahwa hanya kelompoknya yang benar dan pihak lain layak dimusuhi. Ia mulai menjauhi rekan yang berbeda keyakinan. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mendekatinya dengan empati, mengajaknya berdiskusi dengan fakta, mengenalkannya pada sumber yang beragam, dan melibatkan atasan atau tokoh yang dipercaya bila perlu, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mengejek keyakinannya di depan rekan lain, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menjaga jarak agar tidak ikut terpengaruh, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menasihatinya sekali dan berharap ia berubah, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan.","Membiarkan karena itu pilihan pribadinya, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Merangkul, meluruskan, dan melibatkan pihak yang tepat.\nB. Skor 1. Memperburuk keadaan dan memicu konflik.\nC. Skor 3. Menghindar tanpa membantu.\nD. Skor 4. Baik, tetapi tidak berkelanjutan.\nE. Skor 2. Abai terhadap potensi bahaya.","tables":[],"figs":[],"id":584},{"cat":"tkp-antiradikal","q":"Anda diminta mengajak generasi muda di komunitas pemuda memperkuat rasa cinta tanah air dan menolak intoleransi. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengadakan ceramah singkat tentang pentingnya persatuan, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan.","Menunggu instruksi pimpinan sebelum melakukan apa pun, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian.","Membagikan poster kebangsaan tanpa kegiatan lanjutan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Merancang kegiatan yang menarik dan melibatkan kalangan muda, seperti diskusi kebangsaan dan kegiatan kerja sama lintas kelompok, lalu mengevaluasi dampaknya, dengan cara yang menurutnya paling sesuai.","Menyarankan agar kelompok yang berbeda tidak digabung agar tidak terjadi konflik, sesuai dengan keadaan yang sedang dihadapi saat itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Baik, tetapi kurang menarik.\nB. Skor 2. Pasif.\nC. Skor 3. Formalitas.\nD. Skor 5. Mengedukasi secara kreatif dan terukur.\nE. Skor 1. Memisahkan alih-alih mempersatukan.","tables":[],"figs":[],"id":585},{"cat":"tkp-antiradikal","q":"Seorang teman lama mengajak Anda mengikuti diskusi daring tertutup yang ternyata mengajarkan bahwa kekerasan boleh dilakukan terhadap pihak yang berbeda paham. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Bergabung karena merasa pandangannya masuk akal, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menolak ikut dan menjauh dari kelompok itu, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menolak ikut, mengingatkan temannya tentang bahayanya, dan melaporkan kegiatan itu kepada pihak berwenang atau atasan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Hadir sekali untuk mengetahui isinya lalu memutuskan, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Hadir dan mengikuti agar tidak mengecewakan teman, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Mendukung paham kekerasan.\nB. Skor 4. Aman, tetapi tidak melapor.\nC. Skor 5. Tegas menolak kekerasan dan melapor.\nD. Skor 3. Berisiko terpengaruh.\nE. Skor 2. Terbawa tekanan pertemanan.","tables":[],"figs":[],"id":586},{"cat":"tkp-antiradikal","q":"Dalam pertemuan komunitas, beberapa peserta mulai mengejek simbol negara dan menyebutnya tidak penting. Anda adalah ASN yang hadir. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Meninggalkan acara dengan raut kesal tanpa menyampaikan apa pun, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai.","Diam saja karena tidak ingin berdebat, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan.","Ikut tertawa agar suasana tetap akrab, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mengingatkan dengan santun bahwa simbol negara perlu dihormati karena melambangkan persatuan, serta mengalihkan diskusi ke hal yang konstruktif, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menegur peserta itu seusai acara secara pribadi, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Tidak membantu meluruskan.\nB. Skor 3. Pasif.\nC. Skor 1. Mendukung sikap yang merendahkan simbol negara.\nD. Skor 5. Menguatkan nasionalisme dengan cara damai.\nE. Skor 4. Baik, tetapi tidak langsung.","tables":[],"figs":[],"id":587},{"cat":"tkp-antiradikal","q":"Dalam grup pesan kantor, seorang rekan membagikan ajakan untuk menolak dasar negara dan menyebut Pancasila bertentangan dengan keyakinan tertentu. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menegur rekan itu secara pribadi agar tidak mengulanginya, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan.","Membiarkan karena itu pendapat pribadinya, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian.","Meninggalkan grup agar tidak terlibat, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Ikut menyebarkan ajakan itu agar dibahas lebih luas, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Tidak menyebarkannya, menanggapi dengan santun bahwa Pancasila adalah kesepakatan bersama, lalu melaporkannya kepada atasan bila berulang, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Baik, tetapi tidak melapor.\nB. Skor 2. Abai terhadap paham yang berbahaya.\nC. Skor 3. Menghindar tanpa menyelesaikan masalah.\nD. Skor 1. Mendukung paham yang bertentangan dengan negara.\nE. Skor 5. Setia pada Pancasila dan bertindak melalui jalur resmi.","tables":[],"figs":[],"id":588},{"cat":"tkp-antiradikal","q":"Anda melihat selebaran yang mengajak masyarakat mengganti dasar negara dan menyebarkan paham yang bertentangan dengan Pancasila di sekitar kantor. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyimpannya untuk dibaca lebih dulu sebelum menentukan sikap, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut.","Membiarkannya karena itu bukan tugas Anda, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai.","Membuang selebaran itu dan tidak membicarakannya lagi, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai.","Tidak menyebarkannya, mengamankan selebaran sebagai bukti, dan segera melaporkannya kepada atasan atau aparat berwenang, sesuai dengan keadaan yang sedang dihadapi saat itu.","Membagikannya kepada rekan agar mereka tahu isinya, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Berisiko terpengaruh.\nB. Skor 2. Tidak peduli.\nC. Skor 4. Mencegah penyebaran, tetapi tidak melapor.\nD. Skor 5. Bertindak sesuai prosedur.\nE. Skor 1. Ikut menyebarkan paham terlarang.","tables":[],"figs":[],"id":589},{"cat":"tkp-antiradikal","q":"Anda menemukan unggahan di media sosial yang berisi ujaran kebencian terhadap pemeluk agama tertentu. Unggahan itu sudah dibagikan banyak orang. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Tidak ikut membagikan, tetapi juga tidak melakukan apa pun, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut.","Tidak ikut membagikan, melaporkan unggahan kepada platform dan pihak berwenang, serta menyebarkan informasi yang menyejukkan dan benar, sesuai dengan keadaan yang sedang dihadapi saat itu.","Membagikan unggahan itu disertai komentar kemarahan, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian.","Melaporkan unggahan itu tanpa melakukan hal lain, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian.","Membalas unggahan itu dengan kata-kata kasar, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Pasif.\nB. Skor 5. Menolak ujaran kebencian dan aktif mendamaikan.\nC. Skor 1. Menyebarkan ujaran kebencian.\nD. Skor 4. Baik, tetapi terbatas.\nE. Skor 2. Memperkeruh suasana.","tables":[],"figs":[],"id":590},{"cat":"tkp-antiradikal","q":"Anda melihat selebaran yang mengajak masyarakat memusuhi kelompok tertentu dan menyebarkan paham yang bertentangan dengan Pancasila di sekitar kantor. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Membuang selebaran itu dan tidak membicarakannya lagi, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Membagikannya kepada rekan agar mereka tahu isinya, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan.","Membiarkannya karena itu bukan tugas Anda, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai.","Tidak menyebarkannya, mengamankan selebaran sebagai bukti, dan segera melaporkannya kepada atasan atau aparat berwenang, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menyimpannya untuk dibaca lebih dulu sebelum menentukan sikap, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Mencegah penyebaran, tetapi tidak melapor.\nB. Skor 1. Ikut menyebarkan paham terlarang.\nC. Skor 2. Tidak peduli.\nD. Skor 5. Bertindak sesuai prosedur.\nE. Skor 3. Berisiko terpengaruh.","tables":[],"figs":[],"id":591},{"cat":"tkp-antiradikal","q":"Anda diminta mengajak generasi muda di karang taruna desa memperkuat rasa cinta tanah air dan menolak intoleransi. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyarankan agar kelompok yang berbeda tidak digabung agar tidak terjadi konflik, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menunggu instruksi pimpinan sebelum melakukan apa pun, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian.","Merancang kegiatan yang menarik dan melibatkan kalangan muda, seperti diskusi kebangsaan dan kegiatan kerja sama lintas kelompok, lalu mengevaluasi dampaknya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Membagikan poster kebangsaan tanpa kegiatan lanjutan, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Mengadakan ceramah singkat tentang pentingnya persatuan, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Memisahkan alih-alih mempersatukan.\nB. Skor 2. Pasif.\nC. Skor 5. Mengedukasi secara kreatif dan terukur.\nD. Skor 3. Formalitas.\nE. Skor 4. Baik, tetapi kurang menarik.","tables":[],"figs":[],"id":592},{"cat":"tkp-antiradikal","q":"Panitia peringatan hari besar mengusulkan mengundang pembicara yang dikenal sering menyebarkan kebencian terhadap kelompok berbeda dengan alasan \"menarik banyak peserta\". Pendapat Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Setuju asalkan acara ramai peserta, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menyarankan membatasi isi materi pembicara agar tidak memuat ujaran kebencian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mendukung usulan itu karena pandangan pembicara sejalan dengan Anda, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai.","Menyerahkan keputusan sepenuhnya kepada ketua panitia, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menolak usulan itu, menjelaskan bahwa acara harus menjunjung persatuan, dan mengusulkan pembicara lain yang kompeten dan menyejukkan, sambil mengikuti perkembangan keadaan."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Mengutamakan popularitas daripada nilai kebangsaan.\nB. Skor 4. Cukup baik, tetapi berisiko tidak terkendali.\nC. Skor 1. Mendukung paham yang memecah belah.\nD. Skor 3. Pasif.\nE. Skor 5. Menjaga persatuan dan menawarkan alternatif.","tables":[],"figs":[],"id":593},{"cat":"tkp-antiradikal","q":"Dalam rapat dengar pendapat, seorang warga menyampaikan kritik keras kepada pemerintah dengan cara santun dan berdasar data. Beberapa orang menuduhnya anti-pemerintah. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menghindari topik itu agar tidak terbawa perdebatan, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Melaporkan warga itu sebagai ancaman tanpa dasar, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Membedakan kritik konstruktif dari paham radikal, mendengarkan masukan itu, dan menyampaikannya kepada pihak terkait untuk ditindaklanjuti, menurut penilaian yang dibuat langsung di tempat kejadian.","Mendengarkan kritik itu tetapi tidak menanggapi tuduhan orang lain, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian.","Membenarkan tuduhan karena kritik itu terasa mengganggu, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Menghindar.\nB. Skor 1. Menyalahgunakan wewenang.\nC. Skor 5. Menghargai kritik yang damai.\nD. Skor 4. Baik, tetapi tidak meluruskan.\nE. Skor 2. Menyamakan kritik dengan radikalisme.","tables":[],"figs":[],"id":594},{"cat":"tkp-antiradikal","q":"Dalam grup pesan kelompok kerja, seorang rekan membagikan ajakan untuk menolak dasar negara dan menyebut Pancasila bertentangan dengan keyakinan tertentu. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Ikut menyebarkan ajakan itu agar dibahas lebih luas, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menegur rekan itu secara pribadi agar tidak mengulanginya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut.","Membiarkan karena itu pendapat pribadinya, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu.","Tidak menyebarkannya, menanggapi dengan santun bahwa Pancasila adalah kesepakatan bersama, lalu melaporkannya kepada atasan bila berulang, sambil mengikuti perkembangan keadaan.","Meninggalkan grup agar tidak terlibat, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Mendukung paham yang bertentangan dengan negara.\nB. Skor 4. Baik, tetapi tidak melapor.\nC. Skor 2. Abai terhadap paham yang berbahaya.\nD. Skor 5. Setia pada Pancasila dan bertindak melalui jalur resmi.\nE. Skor 3. Menghindar tanpa menyelesaikan masalah.","tables":[],"figs":[],"id":595},{"cat":"tkp-antiradikal","q":"Dalam musyawarah desa, seorang warga menyampaikan kritik keras kepada pemerintah dengan cara santun dan berdasar data. Beberapa orang menuduhnya anti-pemerintah. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Membedakan kritik konstruktif dari paham radikal, mendengarkan masukan itu, dan menyampaikannya kepada pihak terkait untuk ditindaklanjuti, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menghindari topik itu agar tidak terbawa perdebatan, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Membenarkan tuduhan karena kritik itu terasa mengganggu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian.","Melaporkan warga itu sebagai ancaman tanpa dasar, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian.","Mendengarkan kritik itu tetapi tidak menanggapi tuduhan orang lain, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Menghargai kritik yang damai.\nB. Skor 3. Menghindar.\nC. Skor 2. Menyamakan kritik dengan radikalisme.\nD. Skor 1. Menyalahgunakan wewenang.\nE. Skor 4. Baik, tetapi tidak meluruskan.","tables":[],"figs":[],"id":596},{"cat":"tkp-antiradikal","q":"Rekan Anda di tim proyek mengaku sering membaca konten yang menyebut bahwa hanya kelompoknya yang benar dan pihak lain layak dimusuhi. Ia mulai menjauhi rekan yang berbeda keyakinan. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Membiarkan karena itu pilihan pribadinya, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai.","Menjaga jarak agar tidak ikut terpengaruh, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan.","Menasihatinya sekali dan berharap ia berubah, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian.","Mengejek keyakinannya di depan rekan lain, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan.","Mendekatinya dengan empati, mengajaknya berdiskusi dengan fakta, mengenalkannya pada sumber yang beragam, dan melibatkan atasan atau tokoh yang dipercaya bila perlu, dengan cara yang menurutnya paling sesuai."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Abai terhadap potensi bahaya.\nB. Skor 3. Menghindar tanpa membantu.\nC. Skor 4. Baik, tetapi tidak berkelanjutan.\nD. Skor 1. Memperburuk keadaan dan memicu konflik.\nE. Skor 5. Merangkul, meluruskan, dan melibatkan pihak yang tepat.","tables":[],"figs":[],"id":597},{"cat":"tkp-antiradikal","q":"Panitia pelatihan pegawai mengusulkan mengundang pembicara yang dikenal sering menyebarkan kebencian terhadap kelompok berbeda dengan alasan \"menarik banyak peserta\". Pendapat Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mendukung usulan itu karena pandangan pembicara sejalan dengan Anda, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan.","Menolak usulan itu, menjelaskan bahwa acara harus menjunjung persatuan, dan mengusulkan pembicara lain yang kompeten dan menyejukkan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menyerahkan keputusan sepenuhnya kepada ketua panitia, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Setuju asalkan acara ramai peserta, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai.","Menyarankan membatasi isi materi pembicara agar tidak memuat ujaran kebencian, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Mendukung paham yang memecah belah.\nB. Skor 5. Menjaga persatuan dan menawarkan alternatif.\nC. Skor 3. Pasif.\nD. Skor 2. Mengutamakan popularitas daripada nilai kebangsaan.\nE. Skor 4. Cukup baik, tetapi berisiko tidak terkendali.","tables":[],"figs":[],"id":598},{"cat":"tkp-antiradikal","q":"Dalam diskusi kelompok, beberapa peserta mulai mengejek simbol negara dan menyebutnya tidak penting. Anda adalah ASN yang hadir. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Ikut tertawa agar suasana tetap akrab, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan.","Menegur peserta itu seusai acara secara pribadi, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Meninggalkan acara dengan raut kesal tanpa menyampaikan apa pun, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu.","Diam saja karena tidak ingin berdebat, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengingatkan dengan santun bahwa simbol negara perlu dihormati karena melambangkan persatuan, serta mengalihkan diskusi ke hal yang konstruktif, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Mendukung sikap yang merendahkan simbol negara.\nB. Skor 4. Baik, tetapi tidak langsung.\nC. Skor 2. Tidak membantu meluruskan.\nD. Skor 3. Pasif.\nE. Skor 5. Menguatkan nasionalisme dengan cara damai.","tables":[],"figs":[],"id":599},{"cat":"tkp-antiradikal","q":"Seorang teman lama mengajak Anda mengikuti pertemuan tertutup yang ternyata mengajarkan bahwa kekerasan boleh dilakukan terhadap pihak yang berbeda paham. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menolak ikut, mengingatkan temannya tentang bahayanya, dan melaporkan kegiatan itu kepada pihak berwenang atau atasan, dengan cara yang menurutnya paling sesuai.","Menolak ikut dan menjauh dari kelompok itu, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan.","Hadir dan mengikuti agar tidak mengecewakan teman, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian.","Bergabung karena merasa pandangannya masuk akal, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Hadir sekali untuk mengetahui isinya lalu memutuskan, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Tegas menolak kekerasan dan melapor.\nB. Skor 4. Aman, tetapi tidak melapor.\nC. Skor 2. Terbawa tekanan pertemanan.\nD. Skor 1. Mendukung paham kekerasan.\nE. Skor 3. Berisiko terpengaruh.","tables":[],"figs":[],"id":600},{"cat":"twk-pancasila","q":"Ketua Badan Penyelidik Usaha-usaha Persiapan Kemerdekaan Indonesia (BPUPKI) adalah ....","opts":["Mohammad Yamin","Ir. Soekarno","Drs. Mohammad Hatta","Prof. Dr. Soepomo","dr. K.R.T. Radjiman Wedyodiningrat"],"a":4,"why":"Kunci:
