UKUP.\nKesimpulan: Bahkan setelah digabung, datanya tetap tidak cukup. Jawaban: E.","tables":[],"figs":[],"id":449},{"cat":"kecukupan-sosial","q":"Pak Darto membeli sebuah sepatu dengan harga Rp750.000,00. Harga jual berupa kelipatan Rp1.000,00.\nPERTANYAAN UTAMA:\nBerapakah harga jual barang tersebut?\nPERNYATAAN (1): Persentase keuntungan lebih dari 6%.\nPERNYATAAN (2): Barang dijual dengan harga Rp780.000,00 sampai dengan Rp840.000,00.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":4,"why":"Yang ditanyakan: Berapakah harga jual barang tersebut?\nPernyataan (1): Masih banyak kemungkinan. Contoh: harga jual Rp1.031.000,00 (untung Rp281.000,00; 37,5%) → Rp1.031.000,00; harga jual Rp1.266.000,00 (untung Rp516.000,00; 68,8%) → Rp1.266.000,00. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: harga jual Rp800.000,00 (untung Rp50.000,00; 6,7%) → Rp800.000,00; harga jual Rp820.000,00 (untung Rp70.000,00; 9,3%) → Rp820.000,00. Jawabannya berbeda-beda → TIDAK CUKUP.\nDigabung pun masih ada lebih dari satu kemungkinan. Contoh: harga jual Rp811.000,00 (untung Rp61.000,00; 8,1%) → Rp811.000,00; harga jual Rp826.000,00 (untung Rp76.000,00; 10,1%) → Rp826.000,00 → TIDAK CUKUP.\nKesimpulan: Bahkan setelah digabung, datanya tetap tidak cukup. Jawaban: E.","tables":[],"figs":[],"id":450},{"cat":"tkp-pelayanan","q":"Seorang warga pemohon izin usaha marah-marah di depan petugas dan berkata kasar karena permohonannya ditolak akibat persyaratan tidak terpenuhi. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Tetap tenang dan sopan, menjelaskan alasan penolakan beserta langkah agar permohonannya bisa disetujui, dan menawarkan konsultasi, menurut penilaian yang dibuat langsung di tempat kejadian.","Meminta petugas keamanan mengeluarkan warga dari ruang pelayanan, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan.","Membalas dengan nada tinggi agar warga tahu bahwa petugas juga tidak boleh dibentak, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Tetap tenang dan menjelaskan alasan penolakan sesuai aturan, lalu mempersilakan warga bila ingin mengajukan ulang, sambil mengikuti perkembangan keadaan.","Mendiamkan warga hingga ia berhenti marah lalu melayani warga berikutnya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Menjaga profesionalitas dan memberi solusi.\nB. Skor 2. Reaksi berlebihan dan tidak menyelesaikan masalah.\nC. Skor 1. Melayani dengan emosi, merusak citra instansi.\nD. Skor 4. Sopan dan benar, tetapi belum memberi arahan perbaikan.\nE. Skor 3. Menghindar, tidak menyelesaikan masalah.","tables":[],"figs":[],"id":451},{"cat":"tkp-pelayanan","q":"Di kantor pertanahan, Anda menemukan bahwa warga sering salah mengisi formulir karena petunjuknya membingungkan. Sebagai petugas, Anda memutuskan untuk?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyampaikan keluhan kepada rekan tanpa melakukan tindakan apa pun, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Membantu warga mengisi formulir satu per satu setiap kali ada yang bertanya, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai.","Menolak formulir yang salah isi dan meminta warga memperbaikinya sendiri, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut.","Membantu warga yang kesulitan saat itu juga dan mengusulkan perbaikan petunjuk formulir beserta contoh pengisiannya kepada atasan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengisikan formulir untuk warga dengan meminta uang jasa, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Tahu masalah tetapi tidak bertindak.\nB. Skor 4. Membantu, tetapi masalah yang sama terus berulang.\nC. Skor 2. Kurang empati dan tidak memberi solusi.\nD. Skor 5. Menyelesaikan masalah di tempat dan menyentuh akar masalah.\nE. Skor 1. Memanfaatkan kesulitan warga, melanggar integritas.","tables":[],"figs":[],"id":452},{"cat":"tkp-pelayanan","q":"Warga mengajukan keluhan bahwa layanan penerbitan surat izin mengemudi tidak sesuai standar waktu yang dijanjikan. Keluhannya sebenarnya benar karena ada kelalaian rekan Anda. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Membantah keluhan dan menyatakan layanan sudah sesuai standar agar citra unit terjaga, sesuai dengan keadaan yang sedang dihadapi saat itu.","Meminta maaf dan menyelesaikan layanan warga secepatnya tanpa menyampaikan kelalaian itu kepada atasan, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai.","Menjelaskan bahwa keterlambatan itu bukan kesalahan Anda dan menyarankan warga menemui rekan tersebut, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Mencatat keluhan dan meneruskannya ke bagian pengaduan tanpa mengurus layanannya, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Meminta maaf atas nama instansi, segera menyelesaikan layanan warga, lalu melaporkan penyebabnya kepada atasan agar perbaikan dilakukan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Tidak jujur dan merugikan warga.\nB. Skor 4. Menyelesaikan masalah, tetapi akar penyebab tidak diperbaiki.\nC. Skor 2. Menyalahkan pihak lain.\nD. Skor 3. Prosedural, tetapi warga tidak terbantu.\nE. Skor 5. Bertanggung jawab, cepat tanggap, dan memperbaiki sistem.","tables":[],"figs":[],"id":453},{"cat":"tkp-pelayanan","q":"Pimpinan Anda menyatakan akan mengadakan inspeksi mendadak di loket pengaduan masyarakat besok. Beberapa rekan berencana hanya merapikan ruangan agar tampak baik, sementara layanan sehari-hari tetap lambat. Pandangan Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengajak rekan memperbaiki mutu layanan sehari-hari, bukan hanya penampilan, karena tujuan pelayanan adalah kepuasan masyarakat, dengan memperhatikan situasi yang ada pada waktu tersebut.","Membiarkan rekan bertindak sesuka mereka karena itu bukan tanggung jawab Anda, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian.","Menyembunyikan dokumen keluhan warga agar tidak terlihat oleh pimpinan, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengikuti rencana rekan agar suasana kerja tetap kompak, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai.","Merapikan ruangan dan sekaligus mempercepat layanan selama inspeksi berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Berorientasi pada kualitas pelayanan yang nyata.\nB. Skor 2. Tidak peduli pada kualitas layanan.\nC. Skor 1. Menutupi masalah, tidak jujur.\nD. Skor 3. Mengikuti tanpa menilai manfaatnya bagi masyarakat.\nE. Skor 4. Baik, tetapi hanya sementara.","tables":[],"figs":[],"id":454},{"cat":"tkp-pelayanan","q":"Seorang warga datang ke kantor imigrasi yang melayani pembuatan paspor dengan berkas yang kurang lengkap. Ia tampak bingung dan berkata sudah datang dari jauh. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengembalikan berkas dan menyebutkan bahwa persyaratan sudah tertera di papan pengumuman, sambil mengikuti perkembangan keadaan.","Menjelaskan dengan sabar berkas yang kurang, memberikan daftar persyaratan tertulis, dan membantu menyiapkan langkah selanjutnya, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menjelaskan berkas yang kurang dan mempersilakan warga melengkapinya, lalu melayani lebih dulu begitu berkas lengkap, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menawarkan agar berkas diproses cepat asalkan warga menyiapkan uang tambahan, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian.","Menyuruh warga bertanya ke petugas lain karena itu bukan bagian tugas Anda, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Benar secara aturan, tetapi dingin.\nB. Skor 5. Proaktif membantu dalam koridor aturan.\nC. Skor 4. Membantu tetapi tanpa panduan tertulis.\nD. Skor 1. Pungli, melanggar integritas.\nE. Skor 2. Melempar tanggung jawab.","tables":[],"figs":[],"id":455},{"cat":"tkp-pelayanan","q":"Pimpinan Anda menyatakan akan mengadakan inspeksi mendadak di unit pelayanan perizinan besok. Beberapa rekan berencana hanya merapikan ruangan agar tampak baik, sementara layanan sehari-hari tetap lambat. Pandangan Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Membiarkan rekan bertindak sesuka mereka karena itu bukan tanggung jawab Anda, dengan memperhatikan situasi yang ada pada waktu tersebut.","Merapikan ruangan dan sekaligus mempercepat layanan selama inspeksi berlangsung, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian.","Mengajak rekan memperbaiki mutu layanan sehari-hari, bukan hanya penampilan, karena tujuan pelayanan adalah kepuasan masyarakat, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Mengikuti rencana rekan agar suasana kerja tetap kompak, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menyembunyikan dokumen keluhan warga agar tidak terlihat oleh pimpinan, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Tidak peduli pada kualitas layanan.\nB. Skor 4. Baik, tetapi hanya sementara.\nC. Skor 5. Berorientasi pada kualitas pelayanan yang nyata.\nD. Skor 3. Mengikuti tanpa menilai manfaatnya bagi masyarakat.\nE. Skor 1. Menutupi masalah, tidak jujur.","tables":[],"figs":[],"id":456},{"cat":"tkp-pelayanan","q":"Seorang warga pengguna layanan administrasi kependudukan marah-marah di depan petugas dan berkata kasar karena permohonannya ditolak akibat persyaratan tidak terpenuhi. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mendiamkan warga hingga ia berhenti marah lalu melayani warga berikutnya, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Membalas dengan nada tinggi agar warga tahu bahwa petugas juga tidak boleh dibentak, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian.","Meminta petugas keamanan mengeluarkan warga dari ruang pelayanan, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu.","Tetap tenang dan menjelaskan alasan penolakan sesuai aturan, lalu mempersilakan warga bila ingin mengajukan ulang, sambil mengikuti perkembangan keadaan.","Tetap tenang dan sopan, menjelaskan alasan penolakan beserta langkah agar permohonannya bisa disetujui, dan menawarkan konsultasi, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Menghindar, tidak menyelesaikan masalah.\nB. Skor 1. Melayani dengan emosi, merusak citra instansi.\nC. Skor 2. Reaksi berlebihan dan tidak menyelesaikan masalah.\nD. Skor 4. Sopan dan benar, tetapi belum memberi arahan perbaikan.\nE. Skor 5. Menjaga profesionalitas dan memberi solusi.","tables":[],"figs":[],"id":457},{"cat":"tkp-pelayanan","q":"Saat bertugas di kantor pelayanan pajak, Anda menerima kenalan lama yang meminta layanan didahulukan tanpa mengantre karena sedang terburu-buru. Apa tindakan Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Melayani lebih dulu hanya jika tidak ada warga lain yang melihatnya, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai.","Menolak permintaan dan meminta kenalan mengambil nomor antrean seperti warga lain, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai.","Menyampaikan permintaan itu kepada atasan dan menunggu keputusannya, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan.","Mendahulukannya karena sudah kenal dan berharap mendapat balasan kebaikan kelak, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menolak dengan sopan, menjelaskan bahwa semua warga dilayani sesuai urutan, dan menyarankan jalur layanan cepat bila tersedia, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Diskriminatif dan menutupi pelanggaran.\nB. Skor 4. Adil, tetapi kurang memberi alternatif.\nC. Skor 3. Tidak langsung menolak, menunda keputusan.\nD. Skor 1. Diskriminatif dan berpotensi gratifikasi.\nE. Skor 5. Adil, tegas, dan tetap santun.","tables":[],"figs":[],"id":458},{"cat":"tkp-pelayanan","q":"Seorang warga datang ke kantor kecamatan pengurus akta dan kartu keluarga dengan berkas yang kurang lengkap. Ia tampak bingung dan berkata sudah datang dari jauh. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyuruh warga bertanya ke petugas lain karena itu bukan bagian tugas Anda, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian.","Menjelaskan berkas yang kurang dan mempersilakan warga melengkapinya, lalu melayani lebih dulu begitu berkas lengkap, dengan cara yang menurutnya paling sesuai.","Menawarkan agar berkas diproses cepat asalkan warga menyiapkan uang tambahan, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan.","Mengembalikan berkas dan menyebutkan bahwa persyaratan sudah tertera di papan pengumuman, dengan cara yang menurutnya paling sesuai.","Menjelaskan dengan sabar berkas yang kurang, memberikan daftar persyaratan tertulis, dan membantu menyiapkan langkah selanjutnya, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Melempar tanggung jawab.\nB. Skor 4. Membantu tetapi tanpa panduan tertulis.\nC. Skor 1. Pungli, melanggar integritas.\nD. Skor 3. Benar secara aturan, tetapi dingin.\nE. Skor 5. Proaktif membantu dalam koridor aturan.","tables":[],"figs":[],"id":459},{"cat":"tkp-pelayanan","q":"Anda petugas di kantor kelurahan yang melayani pengurusan KTP elektronik. Antrean memanjang, warga mulai mengeluh karena menunggu terlalu lama, sementara jumlah petugas terbatas. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menutup loket sementara sampai antrean berkurang supaya keluhan warga berhenti, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menyampaikan estimasi waktu dengan ramah kepada warga, mempercepat pelayanan sesuai prosedur, dan mengusulkan perbaikan alur antrean kepada atasan, dengan cara yang menurutnya paling sesuai.","Tetap melayani sesuai urutan tanpa menanggapi keluhan karena semua sudah sesuai prosedur, menurut penilaian yang dibuat langsung di tempat kejadian, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu.","Melayani sesuai nomor antrean dengan cepat dan menjelaskan alasan keterlambatan kepada warga yang mengeluh, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian.","Meminta warga yang mengeluh untuk datang lagi esok hari agar antrean berkurang, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Menghentikan pelayanan, merugikan masyarakat.\nB. Skor 5. Empatik, tetap sesuai prosedur, dan menawarkan solusi sistemik.\nC. Skor 3. Prosedural tetapi kurang empati dan daya tanggap.\nD. Skor 4. Baik dan sopan, tetapi belum mengusulkan perbaikan.\nE. Skor 2. Mengalihkan beban ke warga.","tables":[],"figs":[],"id":460},{"cat":"tkp-pelayanan","q":"Seorang warga lansia kesulitan memakai aplikasi pendaftaran daring di kantor kelurahan dengan layanan daring dan terus bertanya berulang kali. Anda diminta segera melayani warga lain. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Membantu warga lansia sampai pendaftarannya selesai dengan sabar, sambil meminta rekan mengatur warga lain, lalu menyiapkan panduan cetak sederhana, menurut penilaian yang dibuat langsung di tempat kejadian.","Meminta warga lansia menepi dan kembali nanti setelah bisa memakai aplikasi, menurut penilaian yang dibuat langsung di tempat kejadian, dengan cara yang menurutnya paling sesuai.","Menjelaskan sekali dengan singkat, lalu menyarankan warga lansia meminta bantuan anaknya di rumah, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian.","Mendampingi warga lansia mendaftar lebih dulu, baru kemudian melayani warga lain, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian.","Menunjukkan kekesalan agar warga lansia segera pergi dan antrean berjalan, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Empatik dan mencari solusi yang berkelanjutan.\nB. Skor 2. Kurang empati dan tidak memberi solusi.\nC. Skor 3. Menyerahkan masalah kepada pihak lain.\nD. Skor 4. Empatik, tetapi warga lain dibiarkan menunggu.\nE. Skor 1. Sikap kasar, merusak citra pelayanan.","tables":[],"figs":[],"id":461},{"cat":"tkp-pelayanan","q":"Saat jam istirahat di kantor pertanahan, seorang warga datang membawa urusan mendesak yang hanya bisa Anda layani. Jam istirahat Anda tinggal 20 menit lagi. Apa tindakan Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Meminta warga menunggu 20 menit agar Anda bisa menyelesaikan istirahat, kemudian segera melayaninya, sesuai dengan keadaan yang sedang dihadapi saat itu.","Melayani warga terlebih dahulu karena urusannya mendesak, lalu mengambil sisa waktu istirahat sesudahnya, dengan cara yang menurutnya paling sesuai.","Mengarahkan warga kembali setelah jam istirahat selesai tanpa penjelasan tambahan, sambil mengikuti perkembangan keadaan.","Menolak melayani karena sedang di luar jam kerja resmi, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut.","Meminta rekan lain melayani walaupun ia tidak menguasai urusan itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Wajar, tetapi warga yang mendesak harus menunggu.\nB. Skor 5. Mengutamakan kepentingan masyarakat di atas kepentingan pribadi.\nC. Skor 3. Kaku dan kurang peka.\nD. Skor 1. Tidak memiliki empati pelayanan.\nE. Skor 2. Mengalihkan tanggung jawab tanpa mempertimbangkan mutu layanan.","tables":[],"figs":[],"id":462},{"cat":"tkp-pelayanan","q":"Warga mengajukan keluhan bahwa layanan pembuatan surat keterangan domisili tidak sesuai standar waktu yang dijanjikan. Keluhannya sebenarnya benar karena ada kelalaian rekan Anda. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mencatat keluhan dan meneruskannya ke bagian pengaduan tanpa mengurus layanannya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Membantah keluhan dan menyatakan layanan sudah sesuai standar agar citra unit terjaga, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian.","Menjelaskan bahwa keterlambatan itu bukan kesalahan Anda dan menyarankan warga menemui rekan tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Meminta maaf atas nama instansi, segera menyelesaikan layanan warga, lalu melaporkan penyebabnya kepada atasan agar perbaikan dilakukan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Meminta maaf dan menyelesaikan layanan warga secepatnya tanpa menyampaikan kelalaian itu kepada atasan, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Prosedural, tetapi warga tidak terbantu.\nB. Skor 1. Tidak jujur dan merugikan warga.\nC. Skor 2. Menyalahkan pihak lain.\nD. Skor 5. Bertanggung jawab, cepat tanggap, dan memperbaiki sistem.\nE. Skor 4. Menyelesaikan masalah, tetapi akar penyebab tidak diperbaiki.","tables":[],"figs":[],"id":463},{"cat":"tkp-pelayanan","q":"Saat bertugas di loket pelayanan kesehatan di puskesmas, Anda menerima kenalan lama yang meminta layanan didahulukan tanpa mengantre karena sedang terburu-buru. Apa tindakan Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyampaikan permintaan itu kepada atasan dan menunggu keputusannya, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menolak permintaan dan meminta kenalan mengambil nomor antrean seperti warga lain, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan.","Menolak dengan sopan, menjelaskan bahwa semua warga dilayani sesuai urutan, dan menyarankan jalur layanan cepat bila tersedia, sambil mengikuti perkembangan keadaan.","Melayani lebih dulu hanya jika tidak ada warga lain yang melihatnya, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Mendahulukannya karena sudah kenal dan berharap mendapat balasan kebaikan kelak, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Tidak langsung menolak, menunda keputusan.\nB. Skor 4. Adil, tetapi kurang memberi alternatif.\nC. Skor 5. Adil, tegas, dan tetap santun.\nD. Skor 2. Diskriminatif dan menutupi pelanggaran.\nE. Skor 1. Diskriminatif dan berpotensi gratifikasi.","tables":[],"figs":[],"id":464},{"cat":"tkp-pelayanan","q":"Seorang warga lansia kesulitan memakai aplikasi pendaftaran daring di puskesmas yang menerapkan pendaftaran online dan terus bertanya berulang kali. Anda diminta segera melayani warga lain. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Membantu warga lansia sampai pendaftarannya selesai dengan sabar, sambil meminta rekan mengatur warga lain, lalu menyiapkan panduan cetak sederhana, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menjelaskan sekali dengan singkat, lalu menyarankan warga lansia meminta bantuan anaknya di rumah, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Meminta warga lansia menepi dan kembali nanti setelah bisa memakai aplikasi, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian.","Mendampingi warga lansia mendaftar lebih dulu, baru kemudian melayani warga lain, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menunjukkan kekesalan agar warga lansia segera pergi dan antrean berjalan, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Empatik dan mencari solusi yang berkelanjutan.\nB. Skor 3. Menyerahkan masalah kepada pihak lain.\nC. Skor 2. Kurang empati dan tidak memberi solusi.\nD. Skor 4. Empatik, tetapi warga lain dibiarkan menunggu.\nE. Skor 1. Sikap kasar, merusak citra pelayanan.","tables":[],"figs":[],"id":465},{"cat":"tkp-pelayanan","q":"Anda menemukan bahwa petugas senior di kantor pelayanan administrasi kependudukan sering menerima uang \"terima kasih\" dari warga yang urusannya dipercepat. Anda diminta ikut membagi hasilnya. Tindakan Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menerima sekali saja agar tidak dimusuhi lalu berhenti sesudahnya, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menolak dengan tegas, mengingatkan rekan akan aturan gratifikasi, dan melaporkan praktik tersebut melalui kanal pengaduan resmi, dengan cara yang menurutnya paling sesuai.","Ikut menerima karena semua rekan melakukannya, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian.","Menolak ikut menerima uang itu dan menegur rekan tersebut secara pribadi, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menolak ikut menerima, tetapi membiarkan karena khawatir merusak hubungan kerja, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Kompromi terhadap pelanggaran.\nB. Skor 5. Berintegritas dan memperbaiki sistem.\nC. Skor 1. Ikut melanggar aturan.\nD. Skor 4. Berintegritas, tetapi tidak melaporkan.\nE. Skor 3. Menjaga diri sendiri, tetapi praktik dibiarkan.","tables":[],"figs":[],"id":466},{"cat":"tkp-pelayanan","q":"Anda menemukan bahwa petugas senior di kantor samsat sering menerima uang \"terima kasih\" dari warga yang urusannya dipercepat. Anda diminta ikut membagi hasilnya. Tindakan Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menolak ikut menerima, tetapi membiarkan karena khawatir merusak hubungan kerja, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Ikut menerima karena semua rekan melakukannya, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai.","Menolak ikut menerima uang itu dan menegur rekan tersebut secara pribadi, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menolak dengan tegas, mengingatkan rekan akan aturan gratifikasi, dan melaporkan praktik tersebut melalui kanal pengaduan resmi, dengan cara yang menurutnya paling sesuai.","Menerima sekali saja agar tidak dimusuhi lalu berhenti sesudahnya, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Menjaga diri sendiri, tetapi praktik dibiarkan.\nB. Skor 1. Ikut melanggar aturan.\nC. Skor 4. Berintegritas, tetapi tidak melaporkan.\nD. Skor 5. Berintegritas dan memperbaiki sistem.\nE. Skor 2. Kompromi terhadap pelanggaran.","tables":[],"figs":[],"id":467},{"cat":"tkp-pelayanan","q":"Saat bertugas di unit pelayanan administrasi kependudukan, Anda menerima kenalan lama yang meminta layanan didahulukan tanpa mengantre karena sedang terburu-buru. Apa tindakan Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mendahulukannya karena sudah kenal dan berharap mendapat balasan kebaikan kelak, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menolak permintaan dan meminta kenalan mengambil nomor antrean seperti warga lain, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut.","Melayani lebih dulu hanya jika tidak ada warga lain yang melihatnya, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menyampaikan permintaan itu kepada atasan dan menunggu keputusannya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian.","Menolak dengan sopan, menjelaskan bahwa semua warga dilayani sesuai urutan, dan menyarankan jalur layanan cepat bila tersedia, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Diskriminatif dan berpotensi gratifikasi.\nB. Skor 4. Adil, tetapi kurang memberi alternatif.\nC. Skor 2. Diskriminatif dan menutupi pelanggaran.\nD. Skor 3. Tidak langsung menolak, menunda keputusan.\nE. Skor 5. Adil, tegas, dan tetap santun.","tables":[],"figs":[],"id":468},{"cat":"tkp-pelayanan","q":"Anda petugas di kantor dinas penanaman modal yang melayani izin usaha. Antrean memanjang, warga mulai mengeluh karena menunggu terlalu lama, sementara jumlah petugas terbatas. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyampaikan estimasi waktu dengan ramah kepada warga, mempercepat pelayanan sesuai prosedur, dan mengusulkan perbaikan alur antrean kepada atasan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Meminta warga yang mengeluh untuk datang lagi esok hari agar antrean berkurang, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian.","Melayani sesuai nomor antrean dengan cepat dan menjelaskan alasan keterlambatan kepada warga yang mengeluh, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menutup loket sementara sampai antrean berkurang supaya keluhan warga berhenti, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Tetap melayani sesuai urutan tanpa menanggapi keluhan karena semua sudah sesuai prosedur, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Empatik, tetap sesuai prosedur, dan menawarkan solusi sistemik.\nB. Skor 2. Mengalihkan beban ke warga.\nC. Skor 4. Baik dan sopan, tetapi belum mengusulkan perbaikan.\nD. Skor 1. Menghentikan pelayanan, merugikan masyarakat.\nE. Skor 3. Prosedural tetapi kurang empati dan daya tanggap.","tables":[],"figs":[],"id":469},{"cat":"tkp-pelayanan","q":"Seorang warga pendaftar program bantuan sosial marah-marah di depan petugas dan berkata kasar karena permohonannya ditolak akibat persyaratan tidak terpenuhi. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Tetap tenang dan menjelaskan alasan penolakan sesuai aturan, lalu mempersilakan warga bila ingin mengajukan ulang, sesuai dengan keadaan yang sedang dihadapi saat itu.","Membalas dengan nada tinggi agar warga tahu bahwa petugas juga tidak boleh dibentak, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mendiamkan warga hingga ia berhenti marah lalu melayani warga berikutnya, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan.","Tetap tenang dan sopan, menjelaskan alasan penolakan beserta langkah agar permohonannya bisa disetujui, dan menawarkan konsultasi, sambil mengikuti perkembangan keadaan.","Meminta petugas keamanan mengeluarkan warga dari ruang pelayanan, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Sopan dan benar, tetapi belum memberi arahan perbaikan.\nB. Skor 1. Melayani dengan emosi, merusak citra instansi.\nC. Skor 3. Menghindar, tidak menyelesaikan masalah.\nD. Skor 5. Menjaga profesionalitas dan memberi solusi.\nE. Skor 2. Reaksi berlebihan dan tidak menyelesaikan masalah.","tables":[],"figs":[],"id":470},{"cat":"tkp-pelayanan","q":"Warga mengajukan keluhan bahwa layanan pengurusan sertifikat tanah tidak sesuai standar waktu yang dijanjikan. Keluhannya sebenarnya benar karena ada kelalaian rekan Anda. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Membantah keluhan dan menyatakan layanan sudah sesuai standar agar citra unit terjaga, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian.","Meminta maaf dan menyelesaikan layanan warga secepatnya tanpa menyampaikan kelalaian itu kepada atasan, menurut penilaian yang dibuat langsung di tempat kejadian.","Meminta maaf atas nama instansi, segera menyelesaikan layanan warga, lalu melaporkan penyebabnya kepada atasan agar perbaikan dilakukan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menjelaskan bahwa keterlambatan itu bukan kesalahan Anda dan menyarankan warga menemui rekan tersebut, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai.","Mencatat keluhan dan meneruskannya ke bagian pengaduan tanpa mengurus layanannya, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Tidak jujur dan merugikan warga.\nB. Skor 4. Menyelesaikan masalah, tetapi akar penyebab tidak diperbaiki.\nC. Skor 5. Bertanggung jawab, cepat tanggap, dan memperbaiki sistem.\nD. Skor 2. Menyalahkan pihak lain.\nE. Skor 3. Prosedural, tetapi warga tidak terbantu.","tables":[],"figs":[],"id":471},{"cat":"tkp-pelayanan","q":"Anda petugas di kantor Samsat yang melayani pembayaran pajak kendaraan. Antrean memanjang, warga mulai mengeluh karena menunggu terlalu lama, sementara jumlah petugas terbatas. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menutup loket sementara sampai antrean berkurang supaya keluhan warga berhenti, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai.","Melayani sesuai nomor antrean dengan cepat dan menjelaskan alasan keterlambatan kepada warga yang mengeluh, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menyampaikan estimasi waktu dengan ramah kepada warga, mempercepat pelayanan sesuai prosedur, dan mengusulkan perbaikan alur antrean kepada atasan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Meminta warga yang mengeluh untuk datang lagi esok hari agar antrean berkurang, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian.","Tetap melayani sesuai urutan tanpa menanggapi keluhan karena semua sudah sesuai prosedur, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Menghentikan pelayanan, merugikan masyarakat.\nB. Skor 4. Baik dan sopan, tetapi belum mengusulkan perbaikan.\nC. Skor 5. Empatik, tetap sesuai prosedur, dan menawarkan solusi sistemik.\nD. Skor 2. Mengalihkan beban ke warga.\nE. Skor 3. Prosedural tetapi kurang empati dan daya tanggap.","tables":[],"figs":[],"id":472},{"cat":"tkp-pelayanan","q":"Anda menemukan bahwa petugas senior di kantor pelayanan perizinan sering menerima uang \"terima kasih\" dari warga yang urusannya dipercepat. Anda diminta ikut membagi hasilnya. Tindakan Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menerima sekali saja agar tidak dimusuhi lalu berhenti sesudahnya, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menolak ikut menerima uang itu dan menegur rekan tersebut secara pribadi, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menolak dengan tegas, mengingatkan rekan akan aturan gratifikasi, dan melaporkan praktik tersebut melalui kanal pengaduan resmi, menurut penilaian yang dibuat langsung di tempat kejadian.","Menolak ikut menerima, tetapi membiarkan karena khawatir merusak hubungan kerja, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan.","Ikut menerima karena semua rekan melakukannya, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Kompromi terhadap pelanggaran.\nB. Skor 4. Berintegritas, tetapi tidak melaporkan.\nC. Skor 5. Berintegritas dan memperbaiki sistem.\nD. Skor 3. Menjaga diri sendiri, tetapi praktik dibiarkan.\nE. Skor 1. Ikut melanggar aturan.","tables":[],"figs":[],"id":473},{"cat":"tkp-pelayanan","q":"Saat jam istirahat di kantor pelayanan administrasi kependudukan, seorang warga datang membawa urusan mendesak yang hanya bisa Anda layani. Jam istirahat Anda tinggal 20 menit lagi. Apa tindakan Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Meminta rekan lain melayani walaupun ia tidak menguasai urusan itu, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan.","Melayani warga terlebih dahulu karena urusannya mendesak, lalu mengambil sisa waktu istirahat sesudahnya, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengarahkan warga kembali setelah jam istirahat selesai tanpa penjelasan tambahan, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Meminta warga menunggu 20 menit agar Anda bisa menyelesaikan istirahat, kemudian segera melayaninya, menurut penilaian yang dibuat langsung di tempat kejadian.","Menolak melayani karena sedang di luar jam kerja resmi, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Mengalihkan tanggung jawab tanpa mempertimbangkan mutu layanan.\nB. Skor 5. Mengutamakan kepentingan masyarakat di atas kepentingan pribadi.\nC. Skor 3. Kaku dan kurang peka.\nD. Skor 4. Wajar, tetapi warga yang mendesak harus menunggu.\nE. Skor 1. Tidak memiliki empati pelayanan.","tables":[],"figs":[],"id":474},{"cat":"tkp-pelayanan","q":"Seorang warga datang ke loket pelayanan perizinan pemerintah daerah dengan berkas yang kurang lengkap. Ia tampak bingung dan berkata sudah datang dari jauh. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menawarkan agar berkas diproses cepat asalkan warga menyiapkan uang tambahan, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menjelaskan berkas yang kurang dan mempersilakan warga melengkapinya, lalu melayani lebih dulu begitu berkas lengkap, menurut penilaian yang dibuat langsung di tempat kejadian, dengan cara yang menurutnya paling sesuai.","Menyuruh warga bertanya ke petugas lain karena itu bukan bagian tugas Anda, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menjelaskan dengan sabar berkas yang kurang, memberikan daftar persyaratan tertulis, dan membantu menyiapkan langkah selanjutnya, sambil mengikuti perkembangan keadaan.","Mengembalikan berkas dan menyebutkan bahwa persyaratan sudah tertera di papan pengumuman, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Pungli, melanggar integritas.\nB. Skor 4. Membantu tetapi tanpa panduan tertulis.\nC. Skor 2. Melempar tanggung jawab.\nD. Skor 5. Proaktif membantu dalam koridor aturan.\nE. Skor 3. Benar secara aturan, tetapi dingin.","tables":[],"figs":[],"id":475},{"cat":"tkp-profesional","q":"Anda ditugaskan menyelesaikan pembuatan dokumen presentasi anggaran dengan tenggat dua hari, tetapi Anda belum menguasai aplikasi yang diperlukan. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mempelajari aplikasi lewat panduan dan pelatihan singkat, bertanya kepada yang berpengalaman, lalu menyelesaikan tugas tepat waktu, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengerjakan dengan cara manual yang lebih lama walaupun melewati tenggat, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai.","Mengaku sudah menguasai aplikasi, lalu menyerahkan hasil seadanya, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Meminta tugas dialihkan kepada rekan yang lebih mahir, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai.","Meminta rekan yang menguasai aplikasi mengajari Anda, lalu menyelesaikan tugas bersama-sama, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Belajar mandiri dan berorientasi pada hasil.\nB. Skor 3. Kurang efisien dan terlambat.\nC. Skor 1. Tidak jujur dan hasilnya tidak berkualitas.\nD. Skor 2. Menghindari tanggung jawab.\nE. Skor 4. Mencari bantuan, tetapi bergantung pada orang lain.","tables":[],"figs":[],"id":476},{"cat":"tkp-profesional","q":"Anda sedang menyelesaikan rekapitulasi data pegawai yang harus rampung hari ini. Seorang rekan mengajak Anda makan siang bersama dan bercerita panjang, sehingga waktu Anda tersita. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Ikut makan siang sebentar, lalu segera kembali dan melembur menyelesaikan pekerjaan, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menunda pekerjaan hingga besok agar suasana tetap akrab, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan.","Mendengarkan cerita rekan sampai selesai karena tidak enak hati lalu mengerjakan sisanya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menolak dengan sopan, menjelaskan bahwa tugas harus selesai hari ini, dan mengajaknya bertemu sesudah pekerjaan rampung, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menitipkan pekerjaan kepada rekan lain lalu pergi bersama, menurut penilaian yang dibuat langsung di tempat kejadian, dengan cara yang menurutnya paling sesuai."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Tanggung jawab tetap dijaga, tetapi waktu terbuang.\nB. Skor 2. Menunda pekerjaan.\nC. Skor 3. Mengorbankan waktu kerja karena sungkan.\nD. Skor 5. Fokus pada tugas dan tetap menjaga hubungan.\nE. Skor 1. Melepaskan tanggung jawab.","tables":[],"figs":[],"id":477},{"cat":"tkp-profesional","q":"Anda menemukan bahwa prosedur kerja di proses pembuatan laporan dapat disingkat sehingga lebih efisien, tetapi sedikit berbeda dari SOP. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Tetap mengikuti SOP dan menyimpan ide itu untuk diri sendiri, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menyampaikan ide kepada rekan agar dibahas dalam rapat berikutnya, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menjalankan prosedur baru diam-diam karena hasilnya lebih cepat, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mengusulkan perubahan SOP kepada atasan beserta alasan dan uji coba terbatas, sambil tetap menjalankan SOP saat ini, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengabaikan SOP dan mengajak rekan lain memakai cara Anda, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Kurang inisiatif.\nB. Skor 4. Baik, tetapi tanpa tindak lanjut jelas.\nC. Skor 3. Melanggar SOP.\nD. Skor 5. Inovatif tanpa melanggar aturan.\nE. Skor 1. Melanggar aturan dan memengaruhi orang lain.","tables":[],"figs":[],"id":478},{"cat":"tkp-profesional","q":"Anda menemukan bahwa prosedur kerja di proses pengarsipan surat dapat disingkat sehingga lebih efisien, tetapi sedikit berbeda dari SOP. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menjalankan prosedur baru diam-diam karena hasilnya lebih cepat, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai.","Mengusulkan perubahan SOP kepada atasan beserta alasan dan uji coba terbatas, sambil tetap menjalankan SOP saat ini, dengan memperhatikan situasi yang ada pada waktu tersebut.","Tetap mengikuti SOP dan menyimpan ide itu untuk diri sendiri, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mengabaikan SOP dan mengajak rekan lain memakai cara Anda, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menyampaikan ide kepada rekan agar dibahas dalam rapat berikutnya, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Melanggar SOP.\nB. Skor 5. Inovatif tanpa melanggar aturan.\nC. Skor 2. Kurang inisiatif.\nD. Skor 1. Melanggar aturan dan memengaruhi orang lain.\nE. Skor 4. Baik, tetapi tanpa tindak lanjut jelas.","tables":[],"figs":[],"id":479},{"cat":"tkp-profesional","q":"Anda menemukan bahwa prosedur kerja di proses persetujuan cuti dapat disingkat sehingga lebih efisien, tetapi sedikit berbeda dari SOP. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menjalankan prosedur baru diam-diam karena hasilnya lebih cepat, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengusulkan perubahan SOP kepada atasan beserta alasan dan uji coba terbatas, sambil tetap menjalankan SOP saat ini, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Mengabaikan SOP dan mengajak rekan lain memakai cara Anda, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian.","Menyampaikan ide kepada rekan agar dibahas dalam rapat berikutnya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu.","Tetap mengikuti SOP dan menyimpan ide itu untuk diri sendiri, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Melanggar SOP.\nB. Skor 5. Inovatif tanpa melanggar aturan.\nC. Skor 1. Melanggar aturan dan memengaruhi orang lain.\nD. Skor 4. Baik, tetapi tanpa tindak lanjut jelas.\nE. Skor 2. Kurang inisiatif.","tables":[],"figs":[],"id":480},{"cat":"tkp-profesional","q":"Anda baru menyadari bahwa laporan yang sudah Anda serahkan kepada atasan mengandung kesalahan data di rekapitulasi realisasi program. Atasan belum membacanya. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengubah data pada arsip agar kesalahan tidak terlihat, menurut penilaian yang dibuat langsung di tempat kejadian, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Segera memperbaiki laporan dan menyerahkannya kembali tanpa banyak penjelasan, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Segera menemui atasan, mengakui kesalahan, menyerahkan laporan yang sudah diperbaiki, dan memeriksa kembali agar tidak terulang, menurut penilaian yang dibuat langsung di tempat kejadian.","Menyalahkan sumber data dari bagian lain bila atasan menanyakannya, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menunggu apakah atasan menyadari kesalahan itu sebelum bertindak, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Memanipulasi data, melanggar integritas.\nB. Skor 4. Memperbaiki, tetapi kurang transparan.\nC. Skor 5. Bertanggung jawab, jujur, dan memperbaiki proses.\nD. Skor 2. Menghindar dari tanggung jawab.\nE. Skor 3. Pasif dan berisiko.","tables":[],"figs":[],"id":481},{"cat":"tkp-profesional","q":"Dalam kegiatan lapangan, Anda melihat rekan memakai fasilitas kantor untuk kepentingan pribadi. Rekan itu mengajak Anda ikut memakainya. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menolak ikut dan menegur rekan secara pribadi, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian.","Ikut memakai dan menutupinya dari atasan, menurut penilaian yang dibuat langsung di tempat kejadian, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menolak ikut dan tidak mempedulikan tindakan rekan, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Ikut memakai sekali karena rekan mengatakan hal itu biasa, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menolak ikut dan mengingatkan rekan dengan sopan tentang aturan penggunaan aset negara, serta melapor bila berulang, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Berintegritas, tetapi tidak melapor.\nB. Skor 1. Melanggar aturan dan menutupi pelanggaran.\nC. Skor 3. Menjaga diri sendiri saja.\nD. Skor 2. Terbawa lingkungan yang salah.\nE. Skor 5. Berintegritas dan menjaga aset negara.","tables":[],"figs":[],"id":482},{"cat":"tkp-profesional","q":"Anda sedang menyelesaikan laporan keuangan bulanan yang harus rampung hari ini. Seorang rekan mengajak Anda makan siang bersama dan bercerita panjang, sehingga waktu Anda tersita. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menunda pekerjaan hingga besok agar suasana tetap akrab, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Mendengarkan cerita rekan sampai selesai karena tidak enak hati lalu mengerjakan sisanya, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Ikut makan siang sebentar, lalu segera kembali dan melembur menyelesaikan pekerjaan, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan.","Menolak dengan sopan, menjelaskan bahwa tugas harus selesai hari ini, dan mengajaknya bertemu sesudah pekerjaan rampung, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menitipkan pekerjaan kepada rekan lain lalu pergi bersama, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Menunda pekerjaan.\nB. Skor 3. Mengorbankan waktu kerja karena sungkan.\nC. Skor 4. Tanggung jawab tetap dijaga, tetapi waktu terbuang.\nD. Skor 5. Fokus pada tugas dan tetap menjaga hubungan.\nE. Skor 1. Melepaskan tanggung jawab.","tables":[],"figs":[],"id":483},{"cat":"tkp-profesional","q":"Dalam unit kerja, Anda melihat rekan memakai fasilitas kantor untuk kepentingan pribadi. Rekan itu mengajak Anda ikut memakainya. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menolak ikut dan mengingatkan rekan dengan sopan tentang aturan penggunaan aset negara, serta melapor bila berulang, menurut penilaian yang dibuat langsung di tempat kejadian.","Menolak ikut dan menegur rekan secara pribadi, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menolak ikut dan tidak mempedulikan tindakan rekan, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut.","Ikut memakai sekali karena rekan mengatakan hal itu biasa, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Ikut memakai dan menutupinya dari atasan, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Berintegritas dan menjaga aset negara.\nB. Skor 4. Berintegritas, tetapi tidak melapor.\nC. Skor 3. Menjaga diri sendiri saja.\nD. Skor 2. Terbawa lingkungan yang salah.\nE. Skor 1. Melanggar aturan dan menutupi pelanggaran.","tables":[],"figs":[],"id":484},{"cat":"tkp-profesional","q":"Saat Anda sedang menyelesaikan pekerjaan utama di sekretariat dinas, atasan Anda tiba-tiba menugaskan pekerjaan lain yang juga mendesak. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyerahkan pekerjaan baru kepada rekan tanpa memberi tahu atasan, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menjelaskan kondisi pekerjaan saat ini kepada atasan, meminta arahan prioritas, lalu mengatur waktu agar keduanya selesai tepat waktu, menurut penilaian yang dibuat langsung di tempat kejadian.","Mengerjakan keduanya sekaligus tanpa melapor sehingga hasilnya kurang rapi, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai.","Menolak pekerjaan baru karena sudah sibuk dengan pekerjaan utama, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan.","Menyelesaikan pekerjaan baru lebih dahulu karena itu perintah atasan, lalu melanjutkan pekerjaan sebelumnya, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Mengalihkan tugas tanpa izin.\nB. Skor 5. Mengelola prioritas dengan komunikasi yang baik.\nC. Skor 3. Memaksakan diri dan kualitas turun.\nD. Skor 2. Menolak perintah tanpa dialog.\nE. Skor 4. Patuh, tetapi risiko pekerjaan awal terlambat.","tables":[],"figs":[],"id":485},{"cat":"tkp-profesional","q":"Anda mendapat undangan mengikuti pelatihan pengelolaan arsip pada hari libur. Waktu itu Anda sudah punya rencana pribadi. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyesuaikan rencana pribadi dan mengikuti pelatihan karena akan meningkatkan kemampuan kerja Anda dan bermanfaat bagi unit, dengan cara yang menurutnya paling sesuai.","Mengikuti pelatihan setengah hari lalu melanjutkan rencana pribadi, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Tidak hadir karena itu hari libur dan bukan kewajiban, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu.","Tidak hadir, tetapi meminta materi pelatihan dari rekan, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan.","Hadir hanya untuk mengisi daftar hadir lalu pulang, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Mengutamakan pengembangan kompetensi.\nB. Skor 4. Cukup baik, tetapi tidak sepenuhnya.\nC. Skor 2. Tidak memiliki semangat mengembangkan diri.\nD. Skor 3. Belajar pasif.\nE. Skor 1. Tidak jujur dan formalitas semata.","tables":[],"figs":[],"id":486},{"cat":"tkp-profesional","q":"Anda mendapat undangan mengikuti pelatihan penyusunan laporan kinerja pada hari libur. Waktu itu Anda sudah punya rencana pribadi. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Tidak hadir, tetapi meminta materi pelatihan dari rekan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan.","Tidak hadir karena itu hari libur dan bukan kewajiban, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian.","Mengikuti pelatihan setengah hari lalu melanjutkan rencana pribadi, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian, dengan cara yang menurutnya paling sesuai.","Menyesuaikan rencana pribadi dan mengikuti pelatihan karena akan meningkatkan kemampuan kerja Anda dan bermanfaat bagi unit, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Hadir hanya untuk mengisi daftar hadir lalu pulang, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Belajar pasif.\nB. Skor 2. Tidak memiliki semangat mengembangkan diri.\nC. Skor 4. Cukup baik, tetapi tidak sepenuhnya.\nD. Skor 5. Mengutamakan pengembangan kompetensi.\nE. Skor 1. Tidak jujur dan formalitas semata.","tables":[],"figs":[],"id":487},{"cat":"tkp-profesional","q":"Anda ditugaskan menyelesaikan pengolahan data survei kepuasan dengan tenggat dua hari, tetapi Anda belum menguasai aplikasi yang diperlukan. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Meminta rekan yang menguasai aplikasi mengajari Anda, lalu menyelesaikan tugas bersama-sama, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mempelajari aplikasi lewat panduan dan pelatihan singkat, bertanya kepada yang berpengalaman, lalu menyelesaikan tugas tepat waktu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Meminta tugas dialihkan kepada rekan yang lebih mahir, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Mengerjakan dengan cara manual yang lebih lama walaupun melewati tenggat, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan.","Mengaku sudah menguasai aplikasi, lalu menyerahkan hasil seadanya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Mencari bantuan, tetapi bergantung pada orang lain.\nB. Skor 5. Belajar mandiri dan berorientasi pada hasil.\nC. Skor 2. Menghindari tanggung jawab.\nD. Skor 3. Kurang efisien dan terlambat.\nE. Skor 1. Tidak jujur dan hasilnya tidak berkualitas.","tables":[],"figs":[],"id":488},{"cat":"tkp-profesional","q":"Pada saat evaluasi kinerja di unit pengelolaan data, Anda ditegur pimpinan karena hasil kerja Anda di bawah target. Anda merasa target terlalu tinggi. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menerima masukan dengan terbuka, menganalisis penyebab kekurangan, lalu menyusun rencana perbaikan dan meminta umpan balik secara berkala, sambil mengikuti perkembangan keadaan.","Diam saja dan tidak menanggapi karena merasa penilaian tidak adil, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menerima teguran dan berjanji bekerja lebih keras bulan depan, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mengubah angka laporan agar capaian terlihat memenuhi target, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai.","Membantah penilaian pimpinan dan menyebut target tidak masuk akal, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Terbuka terhadap kritik dan berorientasi perbaikan.\nB. Skor 3. Tidak responsif.\nC. Skor 4. Mau memperbaiki, tetapi belum ada rencana.\nD. Skor 1. Memanipulasi data.\nE. Skor 2. Defensif dan tidak mau belajar.","tables":[],"figs":[],"id":489},{"cat":"tkp-profesional","q":"Pada saat evaluasi kinerja di bagian pelayanan, Anda ditegur pimpinan karena hasil kerja Anda di bawah target. Anda merasa target terlalu tinggi. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menerima teguran dan berjanji bekerja lebih keras bulan depan, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan.","Mengubah angka laporan agar capaian terlihat memenuhi target, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Diam saja dan tidak menanggapi karena merasa penilaian tidak adil, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian.","Membantah penilaian pimpinan dan menyebut target tidak masuk akal, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menerima masukan dengan terbuka, menganalisis penyebab kekurangan, lalu menyusun rencana perbaikan dan meminta umpan balik secara berkala, sambil mengikuti perkembangan keadaan."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Mau memperbaiki, tetapi belum ada rencana.\nB. Skor 1. Memanipulasi data.\nC. Skor 3. Tidak responsif.\nD. Skor 2. Defensif dan tidak mau belajar.\nE. Skor 5. Terbuka terhadap kritik dan berorientasi perbaikan.","tables":[],"figs":[],"id":490},{"cat":"tkp-profesional","q":"Anda diminta memberikan data internal anggaran kepada seorang kenalan di luar instansi yang mengaku membutuhkannya untuk keperluan pribadi. Tindakan Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Memberikan data setelah kenalan berjanji tidak menyebarkannya, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Memberikan sebagian data yang menurut Anda tidak terlalu penting, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan.","Menolak dengan sopan, menjelaskan bahwa data bersifat rahasia, dan mengarahkan kenalan itu mengajukan permohonan informasi resmi, dengan cara yang menurutnya paling sesuai.","Memberikan seluruh data karena kenalan itu sudah sangat dikenal, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menolak memberikan data dan menyarankan kenalan mencari informasi dari sumber publik, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Mengandalkan janji, melanggar aturan.\nB. Skor 3. Membocorkan data meski sebagian.\nC. Skor 5. Menjaga kerahasiaan dan memberi jalur resmi.\nD. Skor 1. Membocorkan data rahasia.\nE. Skor 4. Menjaga rahasia, tetapi tanpa arahan prosedur.","tables":[],"figs":[],"id":491},{"cat":"tkp-profesional","q":"Anda ditugaskan menyelesaikan pengelolaan arsip digital dengan tenggat dua hari, tetapi Anda belum menguasai aplikasi yang diperlukan. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Meminta rekan yang menguasai aplikasi mengajari Anda, lalu menyelesaikan tugas bersama-sama, sesuai dengan keadaan yang sedang dihadapi saat itu.","Meminta tugas dialihkan kepada rekan yang lebih mahir, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian.","Mengerjakan dengan cara manual yang lebih lama walaupun melewati tenggat, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mengaku sudah menguasai aplikasi, lalu menyerahkan hasil seadanya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mempelajari aplikasi lewat panduan dan pelatihan singkat, bertanya kepada yang berpengalaman, lalu menyelesaikan tugas tepat waktu, dengan cara yang menurutnya paling sesuai."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Mencari bantuan, tetapi bergantung pada orang lain.\nB. Skor 2. Menghindari tanggung jawab.\nC. Skor 3. Kurang efisien dan terlambat.\nD. Skor 1. Tidak jujur dan hasilnya tidak berkualitas.\nE. Skor 5. Belajar mandiri dan berorientasi pada hasil.","tables":[],"figs":[],"id":492},{"cat":"tkp-profesional","q":"Anda mendapat undangan mengikuti pelatihan tata naskah dinas pada hari libur. Waktu itu Anda sudah punya rencana pribadi. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Tidak hadir karena itu hari libur dan bukan kewajiban, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut.","Tidak hadir, tetapi meminta materi pelatihan dari rekan, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menyesuaikan rencana pribadi dan mengikuti pelatihan karena akan meningkatkan kemampuan kerja Anda dan bermanfaat bagi unit, menurut penilaian yang dibuat langsung di tempat kejadian.","Mengikuti pelatihan setengah hari lalu melanjutkan rencana pribadi, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Hadir hanya untuk mengisi daftar hadir lalu pulang, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Tidak memiliki semangat mengembangkan diri.\nB. Skor 3. Belajar pasif.\nC. Skor 5. Mengutamakan pengembangan kompetensi.\nD. Skor 4. Cukup baik, tetapi tidak sepenuhnya.\nE. Skor 1. Tidak jujur dan formalitas semata.","tables":[],"figs":[],"id":493},{"cat":"tkp-profesional","q":"Saat Anda sedang menyelesaikan pekerjaan utama di bagian perencanaan, atasan Anda tiba-tiba menugaskan pekerjaan lain yang juga mendesak. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyelesaikan pekerjaan baru lebih dahulu karena itu perintah atasan, lalu melanjutkan pekerjaan sebelumnya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menyerahkan pekerjaan baru kepada rekan tanpa memberi tahu atasan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai.","Mengerjakan keduanya sekaligus tanpa melapor sehingga hasilnya kurang rapi, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menjelaskan kondisi pekerjaan saat ini kepada atasan, meminta arahan prioritas, lalu mengatur waktu agar keduanya selesai tepat waktu, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menolak pekerjaan baru karena sudah sibuk dengan pekerjaan utama, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Patuh, tetapi risiko pekerjaan awal terlambat.\nB. Skor 1. Mengalihkan tugas tanpa izin.\nC. Skor 3. Memaksakan diri dan kualitas turun.\nD. Skor 5. Mengelola prioritas dengan komunikasi yang baik.\nE. Skor 2. Menolak perintah tanpa dialog.","tables":[],"figs":[],"id":494},{"cat":"tkp-profesional","q":"Pada saat evaluasi kinerja di tim program, Anda ditegur pimpinan karena hasil kerja Anda di bawah target. Anda merasa target terlalu tinggi. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengubah angka laporan agar capaian terlihat memenuhi target, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut.","Membantah penilaian pimpinan dan menyebut target tidak masuk akal, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai.","Menerima masukan dengan terbuka, menganalisis penyebab kekurangan, lalu menyusun rencana perbaikan dan meminta umpan balik secara berkala, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menerima teguran dan berjanji bekerja lebih keras bulan depan, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut.","Diam saja dan tidak menanggapi karena merasa penilaian tidak adil, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Memanipulasi data.\nB. Skor 2. Defensif dan tidak mau belajar.\nC. Skor 5. Terbuka terhadap kritik dan berorientasi perbaikan.\nD. Skor 4. Mau memperbaiki, tetapi belum ada rencana.\nE. Skor 3. Tidak responsif.","tables":[],"figs":[],"id":495},{"cat":"tkp-profesional","q":"Anda diminta memberikan data internal kontrak pengadaan kepada seorang kenalan di luar instansi yang mengaku membutuhkannya untuk keperluan pribadi. Tindakan Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menolak memberikan data dan menyarankan kenalan mencari informasi dari sumber publik, dengan memperhatikan situasi yang ada pada waktu tersebut.","Memberikan seluruh data karena kenalan itu sudah sangat dikenal, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Memberikan sebagian data yang menurut Anda tidak terlalu penting, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Memberikan data setelah kenalan berjanji tidak menyebarkannya, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menolak dengan sopan, menjelaskan bahwa data bersifat rahasia, dan mengarahkan kenalan itu mengajukan permohonan informasi resmi, dengan cara yang menurutnya paling sesuai."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Menjaga rahasia, tetapi tanpa arahan prosedur.\nB. Skor 1. Membocorkan data rahasia.\nC. Skor 3. Membocorkan data meski sebagian.\nD. Skor 2. Mengandalkan janji, melanggar aturan.\nE. Skor 5. Menjaga kerahasiaan dan memberi jalur resmi.","tables":[],"figs":[],"id":496},{"cat":"tkp-profesional","q":"Anda baru menyadari bahwa laporan yang sudah Anda serahkan kepada atasan mengandung kesalahan data di bagian tabel anggaran. Atasan belum membacanya. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyalahkan sumber data dari bagian lain bila atasan menanyakannya, sesuai dengan keadaan yang sedang dihadapi saat itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menunggu apakah atasan menyadari kesalahan itu sebelum bertindak, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan.","Segera memperbaiki laporan dan menyerahkannya kembali tanpa banyak penjelasan, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Mengubah data pada arsip agar kesalahan tidak terlihat, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan.","Segera menemui atasan, mengakui kesalahan, menyerahkan laporan yang sudah diperbaiki, dan memeriksa kembali agar tidak terulang, sambil mengikuti perkembangan keadaan."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Menghindar dari tanggung jawab.\nB. Skor 3. Pasif dan berisiko.\nC. Skor 4. Memperbaiki, tetapi kurang transparan.\nD. Skor 1. Memanipulasi data, melanggar integritas.\nE. Skor 5. Bertanggung jawab, jujur, dan memperbaiki proses.","tables":[],"figs":[],"id":497},{"cat":"tkp-profesional","q":"Anda sedang menyelesaikan draf surat keputusan pimpinan yang harus rampung hari ini. Seorang rekan mengajak Anda makan siang bersama dan bercerita panjang, sehingga waktu Anda tersita. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menitipkan pekerjaan kepada rekan lain lalu pergi bersama, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mendengarkan cerita rekan sampai selesai karena tidak enak hati lalu mengerjakan sisanya, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menolak dengan sopan, menjelaskan bahwa tugas harus selesai hari ini, dan mengajaknya bertemu sesudah pekerjaan rampung, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menunda pekerjaan hingga besok agar suasana tetap akrab, menurut penilaian yang dibuat langsung di tempat kejadian, dengan cara yang menurutnya paling sesuai.","Ikut makan siang sebentar, lalu segera kembali dan melembur menyelesaikan pekerjaan, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Melepaskan tanggung jawab.\nB. Skor 3. Mengorbankan waktu kerja karena sungkan.\nC. Skor 5. Fokus pada tugas dan tetap menjaga hubungan.\nD. Skor 2. Menunda pekerjaan.\nE. Skor 4. Tanggung jawab tetap dijaga, tetapi waktu terbuang.","tables":[],"figs":[],"id":498},{"cat":"tkp-profesional","q":"Anda baru menyadari bahwa laporan yang sudah Anda serahkan kepada atasan mengandung kesalahan data di ringkasan jumlah peserta kegiatan. Atasan belum membacanya. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Segera menemui atasan, mengakui kesalahan, menyerahkan laporan yang sudah diperbaiki, dan memeriksa kembali agar tidak terulang, dengan cara yang menurutnya paling sesuai.","Menunggu apakah atasan menyadari kesalahan itu sebelum bertindak, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian.","Menyalahkan sumber data dari bagian lain bila atasan menanyakannya, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan.","Mengubah data pada arsip agar kesalahan tidak terlihat, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian.","Segera memperbaiki laporan dan menyerahkannya kembali tanpa banyak penjelasan, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Bertanggung jawab, jujur, dan memperbaiki proses.\nB. Skor 3. Pasif dan berisiko.\nC. Skor 2. Menghindar
