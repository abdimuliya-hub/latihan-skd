dari tanggung jawab.\nD. Skor 1. Memanipulasi data, melanggar integritas.\nE. Skor 4. Memperbaiki, tetapi kurang transparan.","tables":[],"figs":[],"id":499},{"cat":"tkp-profesional","q":"Anda diminta memberikan data internal pegawai kepada seorang kenalan di luar instansi yang mengaku membutuhkannya untuk keperluan pribadi. Tindakan Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Memberikan seluruh data karena kenalan itu sudah sangat dikenal, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian.","Menolak dengan sopan, menjelaskan bahwa data bersifat rahasia, dan mengarahkan kenalan itu mengajukan permohonan informasi resmi, menurut penilaian yang dibuat langsung di tempat kejadian.","Memberikan sebagian data yang menurut Anda tidak terlalu penting, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menolak memberikan data dan menyarankan kenalan mencari informasi dari sumber publik, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Memberikan data setelah kenalan berjanji tidak menyebarkannya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Membocorkan data rahasia.\nB. Skor 5. Menjaga kerahasiaan dan memberi jalur resmi.\nC. Skor 3. Membocorkan data meski sebagian.\nD. Skor 4. Menjaga rahasia, tetapi tanpa arahan prosedur.\nE. Skor 2. Mengandalkan janji, melanggar aturan.","tables":[],"figs":[],"id":500},{"cat":"tkp-jejaring","q":"Anda baru dipindahkan ke unit kerja yang baru dan belum mengenal siapa pun. Beberapa rekan tampak sibuk dan jarang berbicara. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menunggu rekan mengajak berbicara lebih dahulu, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai.","Memperkenalkan diri kepada semua rekan, menawarkan bantuan pada tugas kecil, dan aktif ikut kegiatan bersama, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengeluh kepada atasan bahwa rekan baru tidak ramah, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai.","Bekerja sendiri tanpa banyak berinteraksi agar tidak mengganggu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian.","Memperkenalkan diri kepada rekan terdekat saja, lalu fokus bekerja, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Pasif.\nB. Skor 5. Supel dan proaktif membangun jejaring.\nC. Skor 1. Menyalahkan lingkungan.\nD. Skor 2. Menutup diri.\nE. Skor 4. Cukup baik, tetapi terbatas.","tables":[],"figs":[],"id":501},{"cat":"tkp-jejaring","q":"Anda diminta mewakili instansi dalam forum koordinasi antarinstansi yang melibatkan banyak pihak dengan kepentingan berbeda. Hasil rapat belum sepakat. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mendengarkan kepentingan semua pihak, merumuskan titik temu yang menguntungkan bersama, dan menindaklanjutinya dengan komunikasi berkala, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengakhiri pembahasan dan menyerahkannya kepada pimpinan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mengikuti kemauan pihak yang paling berpengaruh agar cepat selesai, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian.","Menekan pihak lain agar menerima usulan instansi Anda, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menyampaikan posisi instansi dengan jelas lalu menunggu pihak lain menyesuaikan, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Membangun kolaborasi yang saling menguntungkan.\nB. Skor 2. Menghindar dari tanggung jawab.\nC. Skor 3. Mengabaikan kepentingan bersama.\nD. Skor 1. Memaksakan kehendak.\nE. Skor 4. Tegas, tetapi kurang fleksibel.","tables":[],"figs":[],"id":502},{"cat":"tkp-jejaring","q":"Anda diminta berkoordinasi dengan instansi vertikal di daerah untuk sebuah program bersama, tetapi mereka lambat menanggapi surat dan pesan Anda. Tenggat semakin dekat. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengirim pengingat tertulis dan meminta atasan membantu menghubungi pimpinan mereka, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menghubungi mereka secara langsung melalui telepon atau bertemu, menjelaskan pentingnya program, dan menyepakati jadwal bersama, menurut penilaian yang dibuat langsung di tempat kejadian.","Menjalankan program tanpa melibatkan mereka agar cepat selesai, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menyalahkan mereka di depan rekan dan atasan atas keterlambatan program, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian.","Menunggu tanggapan mereka sambil menyelesaikan bagian Anda sendiri, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Cukup baik, tetapi kurang langsung.\nB. Skor 5. Proaktif membangun komunikasi.\nC. Skor 2. Mengabaikan kolaborasi.\nD. Skor 1. Merusak hubungan kerja sama.\nE. Skor 3. Pasif dan berisiko terlambat.","tables":[],"figs":[],"id":503},{"cat":"tkp-jejaring","q":"Setelah kegiatan sosialisasi berhasil dilaksanakan, rekan Anda mengumumkan keberhasilan itu sebagai hasil kerjanya sendiri, padahal Anda dan beberapa orang lain ikut berkontribusi. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Diam saja agar tidak terjadi perselisihan, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian.","Menyindirnya di media sosial agar semua orang tahu, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan.","Meminta atasan menegaskan bahwa keberhasilan itu hasil kerja tim, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menemui rekan itu secara baik-baik, menyampaikan harapan agar kontribusi tim diakui, lalu fokus menjaga hubungan kerja dan hasil bersama, menurut penilaian yang dibuat langsung di tempat kejadian.","Tidak mau lagi bekerja sama dengan rekan itu, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Menghindar dari masalah.\nB. Skor 2. Memperburuk hubungan.\nC. Skor 4. Mencari penyelesaian lewat atasan, tetapi tidak berbicara langsung.\nD. Skor 5. Menyelesaikan dengan komunikasi dan menjaga kerja sama.\nE. Skor 1. Merusak jejaring kerja.","tables":[],"figs":[],"id":504},{"cat":"tkp-jejaring","q":"Anda baru dipindahkan ke tim proyek lintas bidang dan belum mengenal siapa pun. Beberapa rekan tampak sibuk dan jarang berbicara. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengeluh kepada atasan bahwa rekan baru tidak ramah, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan.","Memperkenalkan diri kepada rekan terdekat saja, lalu fokus bekerja, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan.","Memperkenalkan diri kepada semua rekan, menawarkan bantuan pada tugas kecil, dan aktif ikut kegiatan bersama, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menunggu rekan mengajak berbicara lebih dahulu, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut.","Bekerja sendiri tanpa banyak berinteraksi agar tidak mengganggu, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Menyalahkan lingkungan.\nB. Skor 4. Cukup baik, tetapi terbatas.\nC. Skor 5. Supel dan proaktif membangun jejaring.\nD. Skor 3. Pasif.\nE. Skor 2. Menutup diri.","tables":[],"figs":[],"id":505},{"cat":"tkp-jejaring","q":"Dalam rapat rapat evaluasi bulanan, Anda memiliki usulan yang berbeda dari mayoritas peserta, dan beberapa orang tampak tidak menyukainya. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mempertahankan usulan dengan keras dan menyebut pendapat lain keliru, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu.","Meninggalkan rapat karena merasa tidak dihargai, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menyampaikan usulan dengan santun beserta alasan dan data, mendengarkan tanggapan, lalu bersedia mencari titik temu, menurut penilaian yang dibuat langsung di tempat kejadian.","Menyampaikan usulan sekali lalu menerima keputusan mayoritas, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian.","Diam saja dan mengikuti pendapat mayoritas agar tidak ada masalah, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Tidak menghargai orang lain.\nB. Skor 1. Merusak kerja sama tim.\nC. Skor 5. Terbuka dan menghargai pendapat lain.\nD. Skor 4. Cukup baik, tetapi mudah menyerah.\nE. Skor 3. Tidak berkontribusi.","tables":[],"figs":[],"id":506},{"cat":"tkp-jejaring","q":"Dalam rapat rapat koordinasi program, Anda memiliki usulan yang berbeda dari mayoritas peserta, dan beberapa orang tampak tidak menyukainya. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mempertahankan usulan dengan keras dan menyebut pendapat lain keliru, sesuai dengan keadaan yang sedang dihadapi saat itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Meninggalkan rapat karena merasa tidak dihargai, sesuai dengan keadaan yang sedang dihadapi saat itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menyampaikan usulan sekali lalu menerima keputusan mayoritas, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Diam saja dan mengikuti pendapat mayoritas agar tidak ada masalah, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menyampaikan usulan dengan santun beserta alasan dan data, mendengarkan tanggapan, lalu bersedia mencari titik temu, sambil mengikuti perkembangan keadaan."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Tidak menghargai orang lain.\nB. Skor 1. Merusak kerja sama tim.\nC. Skor 4. Cukup baik, tetapi mudah menyerah.\nD. Skor 3. Tidak berkontribusi.\nE. Skor 5. Terbuka dan menghargai pendapat lain.","tables":[],"figs":[],"id":507},{"cat":"tkp-jejaring","q":"Setelah proyek bersama selesai tepat waktu, rekan Anda mengumumkan keberhasilan itu sebagai hasil kerjanya sendiri, padahal Anda dan beberapa orang lain ikut berkontribusi. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Tidak mau lagi bekerja sama dengan rekan itu, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Diam saja agar tidak terjadi perselisihan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian.","Menemui rekan itu secara baik-baik, menyampaikan harapan agar kontribusi tim diakui, lalu fokus menjaga hubungan kerja dan hasil bersama, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menyindirnya di media sosial agar semua orang tahu, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Meminta atasan menegaskan bahwa keberhasilan itu hasil kerja tim, menurut penilaian yang dibuat langsung di tempat kejadian, dengan cara yang menurutnya paling sesuai."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Merusak jejaring kerja.\nB. Skor 3. Menghindar dari masalah.\nC. Skor 5. Menyelesaikan dengan komunikasi dan menjaga kerja sama.\nD. Skor 2. Memperburuk hubungan.\nE. Skor 4. Mencari penyelesaian lewat atasan, tetapi tidak berbicara langsung.","tables":[],"figs":[],"id":508},{"cat":"tkp-jejaring","q":"Anda ditunjuk memimpin tim kecil di panitia kegiatan lapangan. Salah satu anggota senior tidak mau mengikuti arahan Anda karena merasa lebih berpengalaman. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Melaporkannya kepada atasan tanpa pernah berbicara langsung, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Mengabaikan anggota senior itu dan bekerja dengan anggota lain, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengajaknya berdiskusi, menghargai pengalamannya, dan melibatkannya dalam perencanaan agar ia merasa menjadi bagian dari tujuan bersama, dengan cara yang menurutnya paling sesuai.","Menyerahkan tugas yang tidak melibatkan dia agar tidak menimbulkan konflik, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menyampaikan arahan secara tegas dan meminta ia mengikuti struktur tim, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Melewatkan komunikasi langsung.\nB. Skor 1. Mengabaikan anggota tim.\nC. Skor 5. Merangkul dan membangun kepercayaan.\nD. Skor 3. Menghindari konflik tanpa menyelesaikannya.\nE. Skor 4. Tegas, tetapi kurang merangkul.","tables":[],"figs":[],"id":509},{"cat":"tkp-jejaring","q":"Anda diminta mewakili instansi dalam kerja sama dengan pemerintah daerah yang melibatkan banyak pihak dengan kepentingan berbeda. Hasil rapat belum sepakat. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengikuti kemauan pihak yang paling berpengaruh agar cepat selesai, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian.","Menyampaikan posisi instansi dengan jelas lalu menunggu pihak lain menyesuaikan, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan.","Mengakhiri pembahasan dan menyerahkannya kepada pimpinan, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mendengarkan kepentingan semua pihak, merumuskan titik temu yang menguntungkan bersama, dan menindaklanjutinya dengan komunikasi berkala, dengan cara yang menurutnya paling sesuai.","Menekan pihak lain agar menerima usulan instansi Anda, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Mengabaikan kepentingan bersama.\nB. Skor 4. Tegas, tetapi kurang fleksibel.\nC. Skor 2. Menghindar dari tanggung jawab.\nD. Skor 5. Membangun kolaborasi yang saling menguntungkan.\nE. Skor 1. Memaksakan kehendak.","tables":[],"figs":[],"id":510},{"cat":"tkp-jejaring","q":"Rekan satu tim Anda kesulitan menyelesaikan bagiannya pada persiapan kegiatan sosialisasi, padahal tenggat tinggal dua hari. Bagian Anda sendiri sudah selesai. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyelesaikan bagian Anda saja dan menyebut tugas lainnya bukan urusan Anda, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Memberi saran singkat, lalu membiarkan rekan menyelesaikannya sendiri, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menawarkan bantuan hanya bila rekan memintanya, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menawarkan bantuan, membagi sebagian pekerjaan sesuai kemampuan, dan memastikan seluruh tim selesai tepat waktu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Melaporkan kepada atasan bahwa rekan itu lambat, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Individualistis.\nB. Skor 3. Membantu seadanya.\nC. Skor 4. Mau membantu, tetapi menunggu diminta.\nD. Skor 5. Bekerja sama untuk hasil bersama.\nE. Skor 2. Mencari aman tanpa membantu.","tables":[],"figs":[],"id":511},{"cat":"tkp-jejaring","q":"Seorang rekan dari bagian lain meminta Anda berbagi informasi data kegiatan, padahal bukan bagian tugasnya. Informasi itu tidak rahasia dan dapat mempercepat pekerjaannya. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Memberikan informasi bila ia mengajukan permintaan tertulis, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menunda pemberian informasi sampai pekerjaan Anda selesai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menyuruhnya meminta langsung kepada atasan Anda, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian.","Menolak karena tidak ingin pekerjaan unit Anda dicampuri bagian lain, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan.","Berbagi informasi yang relevan dengan tepat waktu, memastikan penggunaannya sesuai tugas, dan terbuka bila ia membutuhkan data lain, sambil mengikuti perkembangan keadaan."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Mau berbagi, tetapi menambah prosedur.\nB. Skor 2. Kurang kooperatif.\nC. Skor 3. Menghambat tanpa alasan kuat.\nD. Skor 1. Bekerja secara terkotak-kotak.\nE. Skor 5. Terbuka dan mendukung kerja lintas unit.","tables":[],"figs":[],"id":512},{"cat":"tkp-jejaring","q":"Anda baru dipindahkan ke kantor cabang dan belum mengenal siapa pun. Beberapa rekan tampak sibuk dan jarang berbicara. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengeluh kepada atasan bahwa rekan baru tidak ramah, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Memperkenalkan diri kepada semua rekan, menawarkan bantuan pada tugas kecil, dan aktif ikut kegiatan bersama, sambil mengikuti perkembangan keadaan.","Menunggu rekan mengajak berbicara lebih dahulu, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian.","Bekerja sendiri tanpa banyak berinteraksi agar tidak mengganggu, menurut penilaian yang dibuat langsung di tempat kejadian, dengan cara yang menurutnya paling sesuai.","Memperkenalkan diri kepada rekan terdekat saja, lalu fokus bekerja, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Menyalahkan lingkungan.\nB. Skor 5. Supel dan proaktif membangun jejaring.\nC. Skor 3. Pasif.\nD. Skor 2. Menutup diri.\nE. Skor 4. Cukup baik, tetapi terbatas.","tables":[],"figs":[],"id":513},{"cat":"tkp-jejaring","q":"Rekan satu tim Anda kesulitan menyelesaikan bagiannya pada penyusunan dokumen kerja sama, padahal tenggat tinggal dua hari. Bagian Anda sendiri sudah selesai. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyelesaikan bagian Anda saja dan menyebut tugas lainnya bukan urusan Anda, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Memberi saran singkat, lalu membiarkan rekan menyelesaikannya sendiri, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menawarkan bantuan hanya bila rekan memintanya, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menawarkan bantuan, membagi sebagian pekerjaan sesuai kemampuan, dan memastikan seluruh tim selesai tepat waktu, sesuai dengan keadaan yang sedang dihadapi saat itu.","Melaporkan kepada atasan bahwa rekan itu lambat, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Individualistis.\nB. Skor 3. Membantu seadanya.\nC. Skor 4. Mau membantu, tetapi menunggu diminta.\nD. Skor 5. Bekerja sama untuk hasil bersama.\nE. Skor 2. Mencari aman tanpa membantu.","tables":[],"figs":[],"id":514},{"cat":"tkp-jejaring","q":"Anda diminta berkoordinasi dengan dinas lain untuk sebuah program bersama, tetapi mereka lambat menanggapi surat dan pesan Anda. Tenggat semakin dekat. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menunggu tanggapan mereka sambil menyelesaikan bagian Anda sendiri, sesuai dengan keadaan yang sedang dihadapi saat itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menjalankan program tanpa melibatkan mereka agar cepat selesai, sesuai dengan keadaan yang sedang dihadapi saat itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menyalahkan mereka di depan rekan dan atasan atas keterlambatan program, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mengirim pengingat tertulis dan meminta atasan membantu menghubungi pimpinan mereka, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menghubungi mereka secara langsung melalui telepon atau bertemu, menjelaskan pentingnya program, dan menyepakati jadwal bersama, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Pasif dan berisiko terlambat.\nB. Skor 2. Mengabaikan kolaborasi.\nC. Skor 1. Merusak hubungan kerja sama.\nD. Skor 4. Cukup baik, tetapi kurang langsung.\nE. Skor 5. Proaktif membangun komunikasi.","tables":[],"figs":[],"id":515},{"cat":"tkp-jejaring","q":"Dalam rapat rapat kelompok kerja, Anda memiliki usulan yang berbeda dari mayoritas peserta, dan beberapa orang tampak tidak menyukainya. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Diam saja dan mengikuti pendapat mayoritas agar tidak ada masalah, menurut penilaian yang dibuat langsung di tempat kejadian.","Menyampaikan usulan dengan santun beserta alasan dan data, mendengarkan tanggapan, lalu bersedia mencari titik temu, dengan cara yang menurutnya paling sesuai.","Mempertahankan usulan dengan keras dan menyebut pendapat lain keliru, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan.","Menyampaikan usulan sekali lalu menerima keputusan mayoritas, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Meninggalkan rapat karena merasa tidak dihargai, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Tidak berkontribusi.\nB. Skor 5. Terbuka dan menghargai pendapat lain.\nC. Skor 2. Tidak menghargai orang lain.\nD. Skor 4. Cukup baik, tetapi mudah menyerah.\nE. Skor 1. Merusak kerja sama tim.","tables":[],"figs":[],"id":516},{"cat":"tkp-jejaring","q":"Anda diminta mewakili instansi dalam pertemuan dengan lembaga mitra yang melibatkan banyak pihak dengan kepentingan berbeda. Hasil rapat belum sepakat. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menekan pihak lain agar menerima usulan instansi Anda, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian.","Mengikuti kemauan pihak yang paling berpengaruh agar cepat selesai, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian.","Mengakhiri pembahasan dan menyerahkannya kepada pimpinan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian.","Menyampaikan posisi instansi dengan jelas lalu menunggu pihak lain menyesuaikan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mendengarkan kepentingan semua pihak, merumuskan titik temu yang menguntungkan bersama, dan menindaklanjutinya dengan komunikasi berkala, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Memaksakan kehendak.\nB. Skor 3. Mengabaikan kepentingan bersama.\nC. Skor 2. Menghindar dari tanggung jawab.\nD. Skor 4. Tegas, tetapi kurang fleksibel.\nE. Skor 5. Membangun kolaborasi yang saling menguntungkan.","tables":[],"figs":[],"id":517},{"cat":"tkp-jejaring","q":"Di tim penyusunan laporan tahunan, dua rekan berselisih tentang pembagian tugas dan saling tidak bertegur sapa, sehingga pekerjaan tim terhambat. Anda yang tidak terlibat akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengajak keduanya berbicara bersama secara tenang, membantu mencari kesepakatan pembagian tugas yang adil, dan melaporkannya kepada atasan bila belum selesai, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengambil alih sebagian tugas mereka agar pekerjaan tetap berjalan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu.","Memihak salah satu rekan yang lebih dekat dengan Anda, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian.","Berbicara dengan keduanya secara terpisah dan menyarankan mereka berdamai demi pekerjaan, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian.","Membiarkan sampai atasan mengetahuinya sendiri, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Memediasi untuk solusi bersama (win-win).\nB. Skor 3. Mengurangi dampak, tetapi masalah tidak selesai.\nC. Skor 1. Memperuncing konflik.\nD. Skor 4. Berniat baik, tetapi tidak mempertemukan.\nE. Skor 2. Pasif dan menghambat kerja tim.","tables":[],"figs":[],"id":518},{"cat":"tkp-jejaring","q":"Anda diminta berkoordinasi dengan mitra swasta untuk sebuah program bersama, tetapi mereka lambat menanggapi surat dan pesan Anda. Tenggat semakin dekat. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyalahkan mereka di depan rekan dan atasan atas keterlambatan program, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan.","Menunggu tanggapan mereka sambil menyelesaikan bagian Anda sendiri, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menghubungi mereka secara langsung melalui telepon atau bertemu, menjelaskan pentingnya program, dan menyepakati jadwal bersama, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menjalankan program tanpa melibatkan mereka agar cepat selesai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian.","Mengirim pengingat tertulis dan meminta atasan membantu menghubungi pimpinan mereka, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Merusak hubungan kerja sama.\nB. Skor 3. Pasif dan berisiko terlambat.\nC. Skor 5. Proaktif membangun komunikasi.\nD. Skor 2. Mengabaikan kolaborasi.\nE. Skor 4. Cukup baik, tetapi kurang langsung.","tables":[],"figs":[],"id":519},{"cat":"tkp-jejaring","q":"Rekan satu tim Anda kesulitan menyelesaikan bagiannya pada pengumpulan data lapangan, padahal tenggat tinggal dua hari. Bagian Anda sendiri sudah selesai. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menawarkan bantuan, membagi sebagian pekerjaan sesuai kemampuan, dan memastikan seluruh tim selesai tepat waktu, sesuai dengan keadaan yang sedang dihadapi saat itu.","Memberi saran singkat, lalu membiarkan rekan menyelesaikannya sendiri, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Melaporkan kepada atasan bahwa rekan itu lambat, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai.","Menawarkan bantuan hanya bila rekan memintanya, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan.","Menyelesaikan bagian Anda saja dan menyebut tugas lainnya bukan urusan Anda, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Bekerja sama untuk hasil bersama.\nB. Skor 3. Membantu seadanya.\nC. Skor 2. Mencari aman tanpa membantu.\nD. Skor 4. Mau membantu, tetapi menunggu diminta.\nE. Skor 1. Individualistis.","tables":[],"figs":[],"id":520},{"cat":"tkp-jejaring","q":"Di tim pengelolaan proyek, dua rekan berselisih tentang pembagian tugas dan saling tidak bertegur sapa, sehingga pekerjaan tim terhambat. Anda yang tidak terlibat akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengambil alih sebagian tugas mereka agar pekerjaan tetap berjalan, sesuai dengan keadaan yang sedang dihadapi saat itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Memihak salah satu rekan yang lebih dekat dengan Anda, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai.","Berbicara dengan keduanya secara terpisah dan menyarankan mereka berdamai demi pekerjaan, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Membiarkan sampai atasan mengetahuinya sendiri, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian.","Mengajak keduanya berbicara bersama secara tenang, membantu mencari kesepakatan pembagian tugas yang adil, dan melaporkannya kepada atasan bila belum selesai, dengan cara yang menurutnya paling sesuai."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Mengurangi dampak, tetapi masalah tidak selesai.\nB. Skor 1. Memperuncing konflik.\nC. Skor 4. Berniat baik, tetapi tidak mempertemukan.\nD. Skor 2. Pasif dan menghambat kerja tim.\nE. Skor 5. Memediasi untuk solusi bersama (win-win).","tables":[],"figs":[],"id":521},{"cat":"tkp-jejaring","q":"Seorang rekan dari bagian lain meminta Anda berbagi informasi dokumen kebijakan, padahal bukan bagian tugasnya. Informasi itu tidak rahasia dan dapat mempercepat pekerjaannya. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Memberikan informasi bila ia mengajukan permintaan tertulis, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Berbagi informasi yang relevan dengan tepat waktu, memastikan penggunaannya sesuai tugas, dan terbuka bila ia membutuhkan data lain, menurut penilaian yang dibuat langsung di tempat kejadian.","Menyuruhnya meminta langsung kepada atasan Anda, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan.","Menolak karena tidak ingin pekerjaan unit Anda dicampuri bagian lain, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian.","Menunda pemberian informasi sampai pekerjaan Anda selesai, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Mau berbagi, tetapi menambah prosedur.\nB. Skor 5. Terbuka dan mendukung kerja lintas unit.\nC. Skor 3. Menghambat tanpa alasan kuat.\nD. Skor 1. Bekerja secara terkotak-kotak.\nE. Skor 2. Kurang kooperatif.","tables":[],"figs":[],"id":522},{"cat":"tkp-jejaring","q":"Anda ditunjuk memimpin tim kecil di tim penyusun kebijakan. Salah satu anggota senior tidak mau mengikuti arahan Anda karena merasa lebih berpengalaman. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengajaknya berdiskusi, menghargai pengalamannya, dan melibatkannya dalam perencanaan agar ia merasa menjadi bagian dari tujuan bersama, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Melaporkannya kepada atasan tanpa pernah berbicara langsung, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menyampaikan arahan secara tegas dan meminta ia mengikuti struktur tim, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menyerahkan tugas yang tidak melibatkan dia agar tidak menimbulkan konflik, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengabaikan anggota senior itu dan bekerja dengan anggota lain, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Merangkul dan membangun kepercayaan.\nB. Skor 2. Melewatkan komunikasi langsung.\nC. Skor 4. Tegas, tetapi kurang merangkul.\nD. Skor 3. Menghindari konflik tanpa menyelesaikannya.\nE. Skor 1. Mengabaikan anggota tim.","tables":[],"figs":[],"id":523},{"cat":"tkp-jejaring","q":"Seorang rekan dari bagian lain meminta Anda berbagi informasi jadwal program, padahal bukan bagian tugasnya. Informasi itu tidak rahasia dan dapat mempercepat pekerjaannya. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menolak karena tidak ingin pekerjaan unit Anda dicampuri bagian lain, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menunda pemberian informasi sampai pekerjaan Anda selesai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu.","Memberikan informasi bila ia mengajukan permintaan tertulis, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai.","Berbagi informasi yang relevan dengan tepat waktu, memastikan penggunaannya sesuai tugas, dan terbuka bila ia membutuhkan data lain, sambil mengikuti perkembangan keadaan.","Menyuruhnya meminta langsung kepada atasan Anda, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Bekerja secara terkotak-kotak.\nB. Skor 2. Kurang kooperatif.\nC. Skor 4. Mau berbagi, tetapi menambah prosedur.\nD. Skor 5. Terbuka dan mendukung kerja lintas unit.\nE. Skor 3. Menghambat tanpa alasan kuat.","tables":[],"figs":[],"id":524},{"cat":"tkp-jejaring","q":"Setelah laporan tim mendapat apresiasi pimpinan, rekan Anda mengumumkan keberhasilan itu sebagai hasil kerjanya sendiri, padahal Anda dan beberapa orang lain ikut berkontribusi. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menemui rekan itu secara baik-baik, menyampaikan harapan agar kontribusi tim diakui, lalu fokus menjaga hubungan kerja dan hasil bersama, menurut penilaian yang dibuat langsung di tempat kejadian.","Menyindirnya di media sosial agar semua orang tahu, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Meminta atasan menegaskan bahwa keberhasilan itu hasil kerja tim, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Diam saja agar tidak terjadi perselisihan, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian.","Tidak mau lagi bekerja sama dengan rekan itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Menyelesaikan dengan komunikasi dan menjaga kerja sama.\nB. Skor 2. Memperburuk hubungan.\nC. Skor 4. Mencari penyelesaian lewat atasan, tetapi tidak berbicara langsung.\nD. Skor 3. Menghindar dari masalah.\nE. Skor 1. Merusak jejaring kerja.","tables":[],"figs":[],"id":525},{"cat":"tkp-tik","q":"Perangkat lunak yang Anda pakai untuk pengolahan data menampilkan pemberitahuan pembaruan keamanan. Pembaruan itu membutuhkan waktu sekitar 30 menit dan Anda sedang dikejar tenggat. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menggunakan perangkat lunak bajakan agar tidak perlu memperbarui, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian.","Menunda pembaruan hingga akhir pekan agar pekerjaan tidak terganggu, menurut penilaian yang dibuat langsung di tempat kejadian, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan.","Menutup pemberitahuan dan melanjutkan pekerjaan, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menjadwalkan pembaruan pada waktu yang tidak mengganggu, menyelesaikan pekerjaan lebih dulu, lalu memastikan pembaruan terpasang hari itu juga, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menonaktifkan pemberitahuan agar tidak mengganggu, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Melanggar hukum dan mengancam keamanan.\nB. Skor 4. Menunda keamanan terlalu lama.\nC. Skor 3. Mengabaikan keamanan.\nD. Skor 5. Menjaga keamanan tanpa mengabaikan tugas.\nE. Skor 2. Mengabaikan risiko.","tables":[],"figs":[],"id":526},{"cat":"tkp-tik","q":"Sebuah akun media sosial membahas keluhan masyarakat tentang layanan pelayanan kependudukan dan menandai instansi Anda dengan nada kasar. Anda adalah admin media sosial instansi. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Membiarkan unggahan itu karena nadanya kasar, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan.","Membalas dengan nada yang sama agar akun itu berhenti, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menghapus komentar yang kasar agar tidak terlihat oleh masyarakat, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menanggapi dengan sopan lalu mengarahkan akun itu ke kanal pengaduan resmi, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menanggapi dengan sopan dan cepat, meminta data keluhan lewat pesan pribadi, meneruskannya ke unit terkait, dan memberi kabar perkembangannya, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Abai terhadap aspirasi.\nB. Skor 1. Melayani dengan emosi, merusak citra instansi.\nC. Skor 2. Menutupi kritik.\nD. Skor 4. Benar, tetapi tidak menindaklanjuti.\nE. Skor 5. Responsif, santun, dan menindaklanjuti.","tables":[],"figs":[],"id":527},{"cat":"tkp-tik","q":"Anda diminta menyelesaikan pengubahan format dokumen anggaran dengan cepat. Ada aplikasi gratis di internet yang sangat memudahkan, tetapi aplikasi itu meminta unggahan dokumen instansi ke server luar. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Tidak mengunggah dokumen, meminta atasan merekomendasikan aplikasi resmi yang disetujui instansi, dan menyelesaikan tugas dengan perangkat yang aman, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengunggah hanya dokumen yang bersifat umum, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengunggah dokumen sekali saja karena tenggat mendesak, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai.","Mengunggah dokumen lalu menghapusnya setelah selesai, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mengunggah seluruh dokumen karena aplikasi itu populer, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Mengutamakan keamanan dan prosedur.\nB. Skor 4. Tetap berisiko.\nC. Skor 3. Mengorbankan keamanan demi kecepatan.\nD. Skor 2. Data tetap berpotensi bocor.\nE. Skor 1. Mengabaikan risiko keamanan data.","tables":[],"figs":[],"id":528},{"cat":"tkp-tik","q":"Dalam rapat koordinasi tingkat provinsi secara daring dengan banyak peserta dari daerah, koneksi internet Anda tiba-tiba terputus dan Anda sedang diminta menyampaikan paparan. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mencoba menyambung kembali sampai berhasil lalu meminta maaf, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan.","Mematikan perangkat dan tidak melanjutkan rapat, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menyalahkan penyedia internet dan menunda paparan ke pertemuan berikutnya, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan.","Menunggu hingga koneksi pulih tanpa memberi kabar, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Segera berpindah ke koneksi cadangan, memberi tahu panitia melalui pesan singkat, dan mengirimkan materi paparan agar rapat tetap berjalan, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Berusaha, tetapi rapat tertunda.\nB. Skor 1. Tidak bertanggung jawab.\nC. Skor 2. Menyalahkan keadaan.\nD. Skor 3. Pasif dan tidak berkomunikasi.\nE. Skor 5. Sigap, berkomunikasi efektif, dan punya solusi cadangan.","tables":[],"figs":[],"id":529},{"cat":"tkp-tik","q":"Anda diminta membuat informasi layanan publik untuk masyarakat. Pimpinan ingin cepat, dan Anda tahu ada alat digital yang mampu menyajikannya lebih menarik dan mudah diakses. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyalin materi dari internet tanpa memeriksa kebenarannya, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Memanfaatkan alat digital yang tepat, memastikan isinya akurat dan mudah dipahami, lalu mengevaluasi tanggapan masyarakat, dengan cara yang menurutnya paling sesuai.","Meminta pihak ketiga membuatnya tanpa memeriksa isinya, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Membuat dengan cara biasa karena lebih aman dan sudah dikuasai, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian.","Memakai alat digital sebisanya dan membuat versi cetak sebagai cadangan, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Tidak teliti dan berisiko menyebarkan kekeliruan.\nB. Skor 5. Memilih teknologi yang efektif dan bertanggung jawab.\nC. Skor 2. Mengabaikan akurasi.\nD. Skor 3. Tidak mau berinovasi.\nE. Skor 4. Cukup baik, tetapi kurang dioptimalkan.","tables":[],"figs":[],"id":530},{"cat":"tkp-tik","q":"Anda diberi akses aplikasi keuangan instansi yang memuat data sensitif untuk keperluan tugas. Sebuah rekan meminta kata sandi Anda karena aksesnya belum selesai diproses. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Memberikan kata sandi karena rekan itu dipercaya, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menolak memberikan kata sandi, menjelaskan bahwa akses bersifat pribadi, dan membantu rekan mengajukan permohonan akses resmi dengan cepat, sambil mengikuti perkembangan keadaan.","Memberikan kata sandi lalu mengubahnya setelah rekan selesai, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian.","Menolak memberikan kata sandi dan menyarankan rekan menunggu akses selesai, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Mengerjakan bagian rekan yang memerlukan akses itu menggunakan akun Anda, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Mengabaikan keamanan data.\nB. Skor 5. Menjaga keamanan dan membantu lewat jalur resmi.\nC. Skor 2. Melanggar kebijakan akses.\nD. Skor 4. Aman, tetapi kurang membantu.\nE. Skor 3. Menggunakan akses untuk kepentingan lain.","tables":[],"figs":[],"id":531},{"cat":"tkp-tik","q":"Anda menerima pesan berantai di grup kantor yang menyebut kantor akan ditutup karena ancaman keamanan, disertai ajakan untuk menyebarkannya. Sumbernya tidak jelas. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyebarkannya ke grup lain agar semua orang waspada, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan.","Menyebarkannya disertai kalimat \"belum tentu benar\", menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan.","Menyebarkannya karena khawatir informasinya benar dan bermanfaat, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut.","Tidak menyebarkannya, memeriksa kebenaran lewat sumber resmi, lalu menyampaikan hasilnya kepada grup bila memang hoaks, menurut penilaian yang dibuat langsung di tempat kejadian.","Tidak menyebarkannya dan menghapus pesan itu, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Memperluas penyebaran hoaks.\nB. Skor 2. Tetap menyebarkan informasi tidak terverifikasi.\nC. Skor 3. Menyebarkan tanpa verifikasi.\nD. Skor 5. Kritis, anti-hoaks, dan memberi klarifikasi.\nE. Skor 4. Aman, tetapi tidak mengedukasi.","tables":[],"figs":[],"id":532},{"cat":"tkp-tik","q":"Dalam rapat pembahasan anggaran secara daring dengan banyak peserta dari daerah, koneksi internet Anda tiba-tiba terputus dan Anda sedang diminta menyampaikan paparan. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menunggu hingga koneksi pulih tanpa memberi kabar, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Segera berpindah ke koneksi cadangan, memberi tahu panitia melalui pesan singkat, dan mengirimkan materi paparan agar rapat tetap berjalan, menurut penilaian yang dibuat langsung di tempat kejadian.","Mematikan perangkat dan tidak melanjutkan rapat, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mencoba menyambung kembali sampai berhasil lalu meminta maaf, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menyalahkan penyedia internet dan menunda paparan ke pertemuan berikutnya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Pasif dan tidak berkomunikasi.\nB. Skor 5. Sigap, berkomunikasi efektif, dan punya solusi cadangan.\nC. Skor 1. Tidak bertanggung jawab.\nD. Skor 4. Berusaha, tetapi rapat tertunda.\nE. Skor 2. Menyalahkan keadaan.","tables":[],"figs":[],"id":533},{"cat":"tkp-tik","q":"Anda diminta menyelesaikan penerjemahan dokumen kerja sama dengan cepat. Ada aplikasi gratis di internet yang sangat memudahkan, tetapi aplikasi itu meminta unggahan dokumen instansi ke server luar. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengunggah dokumen lalu menghapusnya setelah selesai, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut.","Tidak mengunggah dokumen, meminta atasan merekomendasikan aplikasi resmi yang disetujui instansi, dan menyelesaikan tugas dengan perangkat yang aman, sambil mengikuti perkembangan keadaan.","Mengunggah hanya dokumen yang bersifat umum, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian.","Mengunggah dokumen sekali saja karena tenggat mendesak, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Mengunggah seluruh dokumen karena aplikasi itu populer, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Data tetap berpotensi bocor.\nB. Skor 5. Mengutamakan keamanan dan prosedur.\nC. Skor 4. Tetap berisiko.\nD. Skor 3. Mengorbankan keamanan demi kecepatan.\nE. Skor 1. Mengabaikan risiko keamanan data.","tables":[],"figs":[],"id":534},{"cat":"tkp-tik","q":"Saat mengolah data penerima bantuan, Anda menemukan berkas berisi data pribadi warga yang tidak dilindungi kata sandi. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyebarkan berkas ke grup pesan agar semua rekan bisa memakainya, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menyalin berkas ke perangkat pribadi agar mudah dikerjakan di rumah, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan.","Membiarkan berkas karena sudah lama seperti itu, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai, sambil mengikuti perkembangan keadaan.","Segera mengamankan berkas dengan kata sandi, membatasi akses, dan melaporkan celah keamanan kepada atasan agar kebijakan diperbaiki, dengan cara yang menurutnya paling sesuai.","Mengamankan berkas yang Anda pegang dan mengingatkan rekan agar berhati-hati, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Membocorkan data pribadi.\nB. Skor 2. Mengancam keamanan data.\nC. Skor 3. Abai terhadap risiko.\nD. Skor 5. Menjaga keamanan data dan memperbaiki sistem.\nE. Skor 4. Baik, tetapi tidak melaporkan.","tables":[],"figs":[],"id":535},{"cat":"tkp-tik","q":"Instansi Anda baru meluncurkan aplikasi pengelolaan surat elektronik. Banyak rekan senior enggan memakainya dan memilih cara manual. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Tetap memakai cara manual karena sudah terbiasa, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mempelajari dan memakainya sendiri tanpa mengajak rekan lain, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mempelajarinya sampai mahir, memakainya dalam pekerjaan, dan membagikan manfaatnya kepada rekan yang belum paham melalui pendampingan singkat, sesuai dengan keadaan yang sedang dihadapi saat itu.","Memakai aplikasi hanya bila diwajibkan atasan, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengkritik aplikasi di depan rekan tanpa pernah mencobanya, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Menolak teknologi.\nB. Skor 4. Baik untuk diri sendiri, tetapi tidak berdampak luas.\nC. Skor 5. Antusias, belajar cepat, dan menyebarkan manfaat.\nD. Skor 3. Menunggu perintah.\nE. Skor 1. Menolak tanpa dasar dan memengaruhi orang lain.","tables":[],"figs":[],"id":536},{"cat":"tkp-tik","q":"Anda diminta membuat materi sosialisasi program untuk masyarakat. Pimpinan ingin cepat, dan Anda tahu ada alat digital yang mampu menyajikannya lebih menarik dan mudah diakses. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Membuat dengan cara biasa karena lebih aman dan sudah dikuasai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menyalin materi dari internet tanpa memeriksa kebenarannya, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian.","Memakai alat digital sebisanya dan membuat versi cetak sebagai cadangan, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Meminta pihak ketiga membuatnya tanpa memeriksa isinya, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Memanfaatkan alat digital yang tepat, memastikan isinya akurat dan mudah dipahami, lalu mengevaluasi tanggapan masyarakat, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Tidak mau berinovasi.\nB. Skor 1. Tidak teliti dan berisiko menyebarkan kekeliruan.\nC. Skor 4. Cukup baik, tetapi kurang dioptimalkan.\nD. Skor 2. Mengabaikan akurasi.\nE. Skor 5. Memilih teknologi yang efektif dan bertanggung jawab.","tables":[],"figs":[],"id":537},{"cat":"tkp-tik","q":"Sebuah akun media sosial membahas keluhan masyarakat tentang layanan pelayanan kesehatan dan menandai instansi Anda dengan nada kasar. Anda adalah admin media sosial instansi. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menanggapi dengan sopan dan cepat, meminta data keluhan lewat pesan pribadi, meneruskannya ke unit terkait, dan memberi kabar perkembangannya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menghapus komentar yang kasar agar tidak terlihat oleh masyarakat, menurut penilaian yang dibuat langsung di tempat kejadian, sambil mengikuti perkembangan keadaan.","Menanggapi dengan sopan lalu mengarahkan akun itu ke kanal pengaduan resmi, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian.","Membiarkan unggahan itu karena nadanya kasar, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian.","Membalas dengan nada yang sama agar akun itu berhenti, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Responsif, santun, dan menindaklanjuti.\nB. Skor 2. Menutupi kritik.\nC. Skor 4. Benar, tetapi tidak menindaklanjuti.\nD. Skor 3. Abai terhadap aspirasi.\nE. Skor 1. Melayani dengan emosi, merusak citra instansi.","tables":[],"figs":[],"id":538},{"cat":"tkp-tik","q":"Anda diberi akses sistem informasi kepegawaian yang memuat data sensitif untuk keperluan tugas. Sebuah rekan meminta kata sandi Anda karena aksesnya belum selesai diproses. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Memberikan kata sandi karena rekan itu dipercaya, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian.","Mengerjakan bagian rekan yang memerlukan akses itu menggunakan akun Anda, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menolak memberikan kata sandi dan menyarankan rekan menunggu akses selesai, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai.","Menolak memberikan kata sandi, menjelaskan bahwa akses bersifat pribadi, dan membantu rekan mengajukan permohonan akses resmi dengan cepat, sambil mengikuti perkembangan keadaan.","Memberikan kata sandi lalu mengubahnya setelah rekan selesai, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Mengabaikan keamanan data.\nB. Skor 3. Menggunakan akses untuk kepentingan lain.\nC. Skor 4. Aman, tetapi kurang membantu.\nD. Skor 5. Menjaga keamanan dan membantu lewat jalur resmi.\nE. Skor 2. Melanggar kebijakan akses.","tables":[],"figs":[],"id":539},{"cat":"tkp-tik","q":"Instansi Anda baru meluncurkan sistem pelaporan kinerja daring. Banyak rekan senior enggan memakainya dan memilih cara manual. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Tetap memakai cara manual karena sudah terbiasa, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan.","Mempelajari dan memakainya sendiri tanpa mengajak rekan lain, menurut penilaian yang dibuat langsung di tempat kejadian, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai.","Mempelajarinya sampai mahir, memakainya dalam pekerjaan, dan membagikan manfaatnya kepada rekan yang belum paham melalui pendampingan singkat, sesuai dengan keadaan yang sedang dihadapi saat itu.","Mengkritik aplikasi di depan rekan tanpa pernah mencobanya, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian.","Memakai aplikasi hanya bila diwajibkan atasan, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 2. Menolak teknologi.\nB. Skor 4. Baik untuk diri sendiri, tetapi tidak berdampak luas.\nC. Skor 5. Antusias, belajar cepat, dan menyebarkan manfaat.\nD. Skor 1. Menolak tanpa dasar dan memengaruhi orang lain.\nE. Skor 3. Menunggu perintah.","tables":[],"figs":[],"id":540},{"cat":"tkp-tik","q":"Anda diminta menyelesaikan penyuntingan laporan dengan cepat. Ada aplikasi gratis di internet yang sangat memudahkan, tetapi aplikasi itu meminta unggahan dokumen instansi ke server luar. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mengunggah dokumen sekali saja karena tenggat mendesak, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mengunggah seluruh dokumen karena aplikasi itu populer, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mengunggah hanya dokumen yang bersifat umum, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai, menurut penilaian yang dibuat langsung di tempat kejadian.","Tidak mengunggah dokumen, meminta atasan merekomendasikan aplikasi resmi yang disetujui instansi, dan menyelesaikan tugas dengan perangkat yang aman, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Mengunggah dokumen lalu menghapusnya setelah selesai, dengan memperhatikan situasi yang ada pada waktu tersebut, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung."],"a":3,"why":"Kunci: D (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Mengorbankan keamanan demi kecepatan.\nB. Skor 1. Mengabaikan risiko keamanan data.\nC. Skor 4. Tetap berisiko.\nD. Skor 5. Mengutamakan keamanan dan prosedur.\nE. Skor 2. Data tetap berpotensi bocor.","tables":[],"figs":[],"id":541},{"cat":"tkp-tik","q":"Anda diminta membuat laporan transparansi anggaran untuk masyarakat. Pimpinan ingin cepat, dan Anda tahu ada alat digital yang mampu menyajikannya lebih menarik dan mudah diakses. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Memanfaatkan alat digital yang tepat, memastikan isinya akurat dan mudah dipahami, lalu mengevaluasi tanggapan masyarakat, dengan cara yang menurutnya paling sesuai.","Meminta pihak ketiga membuatnya tanpa memeriksa isinya, menurut penilaian yang dibuat langsung di tempat kejadian, dengan cara yang menurutnya paling sesuai.","Memakai alat digital sebisanya dan membuat versi cetak sebagai cadangan, dengan memperhatikan situasi yang ada pada waktu tersebut, dengan cara yang menurutnya paling sesuai.","Menyalin materi dari internet tanpa memeriksa kebenarannya, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian.","Membuat dengan cara biasa karena lebih aman dan sudah dikuasai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Memilih teknologi yang efektif dan bertanggung jawab.\nB. Skor 2. Mengabaikan akurasi.\nC. Skor 4. Cukup baik, tetapi kurang dioptimalkan.\nD. Skor 1. Tidak teliti dan berisiko menyebarkan kekeliruan.\nE. Skor 3. Tidak mau berinovasi.","tables":[],"figs":[],"id":542},{"cat":"tkp-tik","q":"Saat mengolah data pelayanan kesehatan, Anda menemukan berkas berisi data pribadi warga yang tidak dilindungi kata sandi. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Membiarkan berkas karena sudah lama seperti itu, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan memperhatikan situasi yang ada pada waktu tersebut, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Segera mengamankan berkas dengan kata sandi, membatasi akses, dan melaporkan celah keamanan kepada atasan agar kebijakan diperbaiki, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Mengamankan berkas yang Anda pegang dan mengingatkan rekan agar berhati-hati, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian.","Menyalin berkas ke perangkat pribadi agar mudah dikerjakan di rumah, sambil mengikuti perkembangan keadaan, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menyebarkan berkas ke grup pesan agar semua rekan bisa memakainya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":1,"why":"Kunci: B (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Abai terhadap risiko.\nB. Skor 5. Menjaga keamanan data dan memperbaiki sistem.\nC. Skor 4. Baik, tetapi tidak melaporkan.\nD. Skor 2. Mengancam keamanan data.\nE. Skor 1. Membocorkan data pribadi.","tables":[],"figs":[],"id":543},{"cat":"tkp-tik","q":"Anda diberi akses basis data penerima layanan yang memuat data sensitif untuk keperluan tugas. Sebuah rekan meminta kata sandi Anda karena aksesnya belum selesai diproses. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menolak memberikan kata sandi dan menyarankan rekan menunggu akses selesai, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai.","Memberikan kata sandi karena rekan itu dipercaya, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan.","Menolak memberikan kata sandi, menjelaskan bahwa akses bersifat pribadi, dan membantu rekan mengajukan permohonan akses resmi dengan cepat, menurut penilaian yang dibuat langsung di tempat kejadian.","Memberikan kata sandi lalu mengubahnya setelah rekan selesai, sesuai dengan keadaan yang sedang dihadapi saat itu, dengan cara yang menurutnya paling sesuai.","Mengerjakan bagian rekan yang memerlukan akses itu menggunakan akun Anda, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 4. Aman, tetapi kurang membantu.\nB. Skor 1. Mengabaikan keamanan data.\nC. Skor 5. Menjaga keamanan dan membantu lewat jalur resmi.\nD. Skor 2. Melanggar kebijakan akses.\nE. Skor 3. Menggunakan akses untuk kepentingan lain.","tables":[],"figs":[],"id":544},{"cat":"tkp-tik","q":"Saat mengolah data pendaftaran layanan publik, Anda menemukan berkas berisi data pribadi warga yang tidak dilindungi kata sandi. Sikap Anda?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyebarkan berkas ke grup pesan agar semua rekan bisa memakainya, dengan memperhatikan situasi yang ada pada waktu tersebut, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menyalin berkas ke perangkat pribadi agar mudah dikerjakan di rumah, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sesuai dengan keadaan yang sedang dihadapi saat itu.","Segera mengamankan berkas dengan kata sandi, membatasi akses, dan melaporkan celah keamanan kepada atasan agar kebijakan diperbaiki, dengan memperhatikan situasi yang ada pada waktu tersebut.","Membiarkan berkas karena sudah lama seperti itu, menurut penilaian yang dibuat langsung di tempat kejadian, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mengamankan berkas yang Anda pegang dan mengingatkan rekan agar berhati-hati, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":2,"why":"Kunci: C (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Membocorkan data pribadi.\nB. Skor 2. Mengancam keamanan data.\nC. Skor 5. Menjaga keamanan data dan memperbaiki sistem.\nD. Skor 3. Abai terhadap risiko.\nE. Skor 4. Baik, tetapi tidak melaporkan.","tables":[],"figs":[],"id":545},{"cat":"tkp-tik","q":"Dalam rapat evaluasi program nasional secara daring dengan banyak peserta dari daerah, koneksi internet Anda tiba-tiba terputus dan Anda sedang diminta menyampaikan paparan. Apa yang Anda lakukan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mematikan perangkat dan tidak melanjutkan rapat, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menyalahkan penyedia internet dan menunda paparan ke pertemuan berikutnya, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Mencoba menyambung kembali sampai berhasil lalu meminta maaf, menurut penilaian yang dibuat langsung di tempat kejadian, dengan memperhatikan situasi yang ada pada waktu tersebut, sesuai dengan keadaan yang sedang dihadapi saat itu.","Menunggu hingga koneksi pulih tanpa memberi kabar, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan, menurut penilaian yang dibuat langsung di tempat kejadian.","Segera berpindah ke koneksi cadangan, memberi tahu panitia melalui pesan singkat, dan mengirimkan materi paparan agar rapat tetap berjalan, menurut penilaian yang dibuat langsung di tempat kejadian."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 1. Tidak bertanggung jawab.\nB. Skor 2. Menyalahkan keadaan.\nC. Skor 4. Berusaha, tetapi rapat tertunda.\nD. Skor 3. Pasif dan tidak berkomunikasi.\nE. Skor 5. Sigap, berkomunikasi efektif, dan punya solusi cadangan.","tables":[],"figs":[],"id":546},{"cat":"tkp-tik","q":"Instansi Anda baru meluncurkan aplikasi absensi digital. Banyak rekan senior enggan memakainya dan memilih cara manual. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Mempelajarinya sampai mahir, memakainya dalam pekerjaan, dan membagikan manfaatnya kepada rekan yang belum paham melalui pendampingan singkat, sambil mengikuti perkembangan keadaan.","Mempelajari dan memakainya sendiri tanpa mengajak rekan lain, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu.","Tetap memakai cara manual karena sudah terbiasa, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Mengkritik aplikasi di depan rekan tanpa pernah mencobanya, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai, sesuai dengan keadaan yang sedang dihadapi saat itu.","Memakai aplikasi hanya bila diwajibkan atasan, menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan cara yang menurutnya paling sesuai."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Antusias, belajar cepat, dan menyebarkan manfaat.\nB. Skor 4. Baik untuk diri sendiri, tetapi tidak berdampak luas.\nC. Skor 2. Menolak teknologi.\nD. Skor 1. Menolak tanpa dasar dan memengaruhi orang lain.\nE. Skor 3. Menunggu perintah.","tables":[],"figs":[],"id":547},{"cat":"tkp-tik","q":"Perangkat lunak yang Anda pakai untuk pengelolaan arsip digital menampilkan pemberitahuan pembaruan keamanan. Pembaruan itu membutuhkan waktu sekitar 30 menit dan Anda sedang dikejar tenggat. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menjadwalkan pembaruan pada waktu yang tidak mengganggu, menyelesaikan pekerjaan lebih dulu, lalu memastikan pembaruan terpasang hari itu juga, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menonaktifkan pemberitahuan agar tidak mengganggu, sesuai dengan keadaan yang sedang dihadapi saat itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan.","Menunda pembaruan hingga akhir pekan agar pekerjaan tidak terganggu, dengan cara yang menurutnya paling sesuai, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menggunakan perangkat lunak bajakan agar tidak perlu memperbarui, sesuai dengan keadaan yang sedang dihadapi saat itu, menurut penilaian yang dibuat langsung di tempat kejadian, dengan cara yang menurutnya paling sesuai.","Menutup pemberitahuan dan melanjutkan pekerjaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, sambil mengikuti perkembangan keadaan."],"a":0,"why":"Kunci: A (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 5. Menjaga keamanan tanpa mengabaikan tugas.\nB. Skor 2. Mengabaikan risiko.\nC. Skor 4. Menunda keamanan terlalu lama.\nD. Skor 1. Melanggar hukum dan mengancam keamanan.\nE. Skor 3. Mengabaikan keamanan.","tables":[],"figs":[],"id":548},{"cat":"tkp-tik","q":"Anda menerima pesan berantai di grup kantor yang menyebut bantuan sosial akan dicairkan besok, disertai ajakan untuk menyebarkannya. Sumbernya tidak jelas. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyebarkannya karena khawatir informasinya benar dan bermanfaat, sambil mengikuti perkembangan keadaan, dengan cara yang menurutnya paling sesuai, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menyebarkannya ke grup lain agar semua orang waspada, sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan, dengan memperhatikan situasi yang ada pada waktu tersebut.","Menyebarkannya disertai kalimat \"belum tentu benar\", menurut penilaian yang dibuat langsung di tempat kejadian, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Tidak menyebarkannya dan menghapus pesan itu, seperti yang dipertimbangkan pada saat kejadian itu berlangsung, dengan memperhatikan situasi yang ada pada waktu tersebut.","Tidak menyebarkannya, memeriksa kebenaran lewat sumber resmi, lalu menyampaikan hasilnya kepada grup bila memang hoaks, sesuai dengan keadaan yang sedang dihadapi saat itu."],"a":4,"why":"Kunci: E (skor 5)\nPola skor TKP: 5 = tindakan nyata, solusi dan tanggung jawab; 1 = menghindar atau melanggar aturan.\nA. Skor 3. Menyebarkan tanpa verifikasi.\nB. Skor 1. Memperluas penyebaran hoaks.\nC. Skor 2. Tetap menyebarkan informasi tidak terverifikasi.\nD. Skor 4. Aman, tetapi tidak mengedukasi.\nE. Skor 5. Kritis, anti-hoaks, dan memberi klarifikasi.","tables":[],"figs":[],"id":549},{"cat":"tkp-tik","q":"Anda menerima pesan berantai di grup kantor yang menyebut kebijakan baru akan mengubah gaji pegawai, disertai ajakan untuk menyebarkannya. Sumbernya tidak jelas. Anda akan?\n\nManakah respons terbaik (skor tertinggi)?","opts":["Menyebarkannya disertai kalimat \"belum tentu benar\", sesuai dengan keadaan yang sedang dihadapi saat itu, sambil mengikuti perkembangan keadaan, seperti yang dipertimbangkan pada saat kejadian itu berlangsung.","Menyebarkannya karena khawatir informasinya benar dan bermanfaat, dengan memperhatikan situasi yang ada pada waktu tersebut.","Tidak menyebarkannya, memeriksa kebenaran lewat sumber resmi
