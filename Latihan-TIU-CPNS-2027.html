nTips: pelemah terkuat menyerang mekanisme atau akar masalahnya, bukan sekadar menyebut kendala teknis yang masih bisa diperbaiki.","tables":[],"figs":[],"id":362},{"cat":"argumen","q":"Penyuluhan cuci tangan di desa dapat menurunkan kasus diare karena warga memahami pentingnya kebersihan. Oleh karena itu, semakin sering penyuluhan diadakan, semakin sedikit kasus diare.\n\nManakah pernyataan berikut yang MEMPERLEMAH pernyataan di atas?","opts":["Penyuluhan dilaksanakan di balai desa yang baru dicat oleh karang taruna setempat bersama para pemuda, sebagaimana sudah diumumkan dalam rapat tahunan sejak beberapa waktu lalu.","Puskesmas mencatat anak-anak dari keluarga yang rajin menghadiri penyuluhan lebih jarang datang berobat karena diare, menurut laporan yang disusun oleh tim peneliti setempat.","Sebagian besar kasus diare di desa itu berasal dari sumber air minum yang tercemar limbah, sehingga warga yang rajin mencuci tangan pun tetap jatuh sakit setelah meminum air tersebut.","Warga yang bekerja di ladang sering melewatkan penyuluhan karena jadwalnya bersamaan dengan jam kerja di siang hari, meskipun kejadian itu tidak berlangsung terus-menerus sepanjang tahun.","Sabun yang dibagikan saat penyuluhan cepat habis sehingga beberapa keluarga kembali mencuci tangan dengan air saja, namun situasi tersebut biasanya hanya berlangsung sebentar."],"a":2,"why":"Kunci: C\nInti argumen: Penyuluhan cuci tangan di desa dapat menurunkan kasus diare karena warga memahami pentingnya kebersihan.\nA. Tidak relevan. Kondisi gedung tidak berkaitan dengan jumlah kasus diare.\nB. Justru MEMPERKUAT. Data yang mendukung argumen.\nC. MEMPERLEMAH TOTAL. Penyebab utama diare adalah air tercemar, bukan tangan kotor; penyuluhan cuci tangan tidak menurunkan kasus.\nD. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Masalah jadwal yang bisa diatur ulang.\nE. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Soal persediaan sabun, bisa diatasi dengan menambah sabun.\nTips: pelemah terkuat menyerang mekanisme atau akar masalahnya, bukan sekadar menyebut kendala teknis yang masih bisa diperbaiki.","tables":[],"figs":[],"id":363},{"cat":"argumen","q":"Pemberian diskon besar pada akhir pekan dapat meningkatkan keuntungan toko karena jumlah pembeli bertambah. Oleh karena itu, semakin besar diskon yang diberikan, semakin besar keuntungan toko.\n\nManakah pernyataan berikut yang MEMPERLEMAH pernyataan di atas?","opts":["Beberapa barang diskon cepat habis sehingga pembeli yang datang pada siang hari tidak kebagian barang yang diincarnya, meskipun kejadian itu tidak berlangsung terus-menerus sepanjang tahun.","Diskon yang besar membuat harga jual turun di bawah harga modal untuk sebagian besar barang, sehingga setiap barang yang laku justru menambah kerugian meskipun pembelinya semakin banyak.","Toko tersebut berdiri sejak tiga puluh tahun lalu dan memiliki banyak pelanggan tetap di lingkungan sekitarnya, menurut keterangan pihak pengelola kepada para wartawan, dan keadaan itu sudah berlangsung selama beberapa bulan terakhir.","Catatan kasir menunjukkan pembeli pada hari diskon membeli barang lebih banyak, termasuk barang yang tidak didiskon, sehingga total penjualan meningkat tajam, sebagaimana dicatat petugas selama beberapa bulan pengamatan terakhir.","Antrean kasir pada akhir pekan memanjang sehingga sebagian pembeli membatalkan belanjanya dan meninggalkan toko, namun situasi tersebut biasanya hanya berlangsung sebentar."],"a":1,"why":"Kunci: B\nInti argumen: Pemberian diskon besar pada akhir pekan dapat meningkatkan keuntungan toko karena jumlah pembeli bertambah.\nA. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Soal stok, bisa diatasi dengan menambah persediaan.\nB. MEMPERLEMAH TOTAL. Menghitung untung-rugi: harga jual di bawah modal berarti pembeli bertambah pun membuat rugi, jadi kesimpulan runtuh.\nC. Tidak relevan. Sejarah toko tidak menyangkut hubungan diskon dan keuntungan.\nD. Justru MEMPERKUAT. Mendukung bahwa diskon menaikkan penjualan dan keuntungan.\nE. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Masalah layanan yang bisa dibenahi dengan menambah kasir.\nTips: pelemah terkuat menyerang mekanisme atau akar masalahnya, bukan sekadar menyebut kendala teknis yang masih bisa diperbaiki.","tables":[],"figs":[],"id":364},{"cat":"argumen","q":"Program cuci tangan pakai sabun sebelum makan di sekolah dapat menurunkan angka siswa sakit perut karena kuman dari tangan tidak ikut tertelan. Oleh karena itu, semakin rutin siswa mencuci tangan, semakin sedikit siswa yang sakit perut.\n\nManakah pernyataan berikut yang MEMPERKUAT pernyataan di atas?","opts":["Pemeriksaan laboratorium menunjukkan jumlah kuman pada tangan siswa turun drastis setelah mencuci tangan, dan kelas dengan kepatuhan cuci tangan tertinggi mencatat kasus sakit perut paling rendah dibanding kelas lain pada semester yang sama.","Beberapa siswa mengaku tangan mereka terasa lebih bersih dan harum setelah memakai sabun cair yang disediakan oleh pihak sekolah di setiap wastafel, menurut keterangan beberapa orang yang ditanya secara acak.","Siswa rajin mencuci tangan karena kelas yang paling patuh dijanjikan piala dan acara jalan-jalan pada akhir semester oleh kepala sekolah, sebagaimana tertulis dalam ketentuan yang berlaku, dan hal tersebut diketahui oleh banyak orang di lingkungan itu.","Sekolah memasang wastafel baru di depan kantin dengan keran otomatis yang hemat air dan sangat mudah dibersihkan oleh petugas, sebagaimana tercantum dalam rencana kerja tahunan, dan keadaan itu sudah berlangsung selama beberapa bulan terakhir.","Program cuci tangan sedang ramai dibicarakan di media sosial dan banyak sekolah lain mengikutinya agar dianggap peduli pada kesehatan siswa, sehingga topik ini kerap menjadi bahan perbincangan di berbagai kesempatan, dan hal tersebut diketahui oleh banyak orang di lingkungan itu."],"a":0,"why":"Kunci: A\nInti argumen: Program cuci tangan pakai sabun sebelum makan di sekolah dapat menurunkan angka siswa sakit perut karena kuman dari tangan tidak ikut tertelan.\nA. MEMPERKUAT KUAT (bukti terukur dengan pembanding). Ada data terukur, pembanding antarkelas, dan hubungan sebab-akibat: kuman turun, kasus turun, makin patuh makin sedikit kasus.\nB. Lemah (perasaan subjektif). Hanya kesan pribadi, tidak membuktikan penurunan sakit perut.\nC. Motif lain (tidak membuktikan hubungan sebab-akibat). Menjelaskan alasan siswa patuh, bukan bukti sakit perut berkurang.\nD. Tidak relevan (urusan fasilitas, bukan hasil). Soal fasilitas, bukan bukti penurunan sakit perut.\nE. Tidak relevan (ikut tren atau ramai dibicarakan). Ikut tren tidak membuktikan program efektif.\nTips: penguat terkuat memberi bukti terukur dengan pembanding dan menjelaskan sebab-akibatnya, bukan sekadar kesan, tren, atau fasilitas.","tables":[],"figs":[],"id":365},{"cat":"argumen","q":"Pelatihan metode mengajar bagi guru dapat meningkatkan hasil belajar siswa karena guru mampu menjelaskan materi dengan lebih jelas. Oleh karena itu, semakin banyak guru yang dilatih, semakin tinggi hasil belajar siswa.\n\nManakah pernyataan berikut yang MEMPERKUAT pernyataan di atas?","opts":["Guru yang mengikuti pelatihan mendapat tunjangan tambahan sehingga mereka berlomba-lomba mendaftar pada pelatihan berikutnya, sebagaimana tertulis dalam ketentuan yang berlaku, dan kejadian serupa pernah dilaporkan pada tahun-tahun sebelumnya.","Di sekolah yang gurunya sudah dilatih, rata-rata nilai ulangan naik dari 68 menjadi 78 dalam satu semester, sedangkan sekolah serupa tanpa pelatihan hanya naik 1 poin, dan siswa lebih banyak menjawab benar pada soal penjelasan konsep.","Pelatihan diselenggarakan di hotel yang nyaman dengan konsumsi lengkap serta suvenir menarik bagi seluruh peserta yang hadir, sebagaimana tercantum dalam rencana kerja tahunan, dan keadaan itu sudah berlangsung selama beberapa bulan terakhir.","Para guru yang mengikuti pelatihan mengaku lebih percaya diri dan lebih senang berdiri di depan kelas setelah pulang dari acara pelatihan, terutama ketika mereka berbincang santai setelah kegiatan selesai, dan keadaan itu sudah berlangsung selama beberapa bulan terakhir.","Pelatihan guru menjadi agenda wajib di banyak daerah karena dinas pendidikan di wilayah lain juga menyelenggarakannya setiap tahun, sehingga topik ini kerap menjadi bahan perbincangan di berbagai kesempatan."],"a":1,"why":"Kunci: B\nInti argumen: Pelatihan metode mengajar bagi guru dapat meningkatkan hasil belajar siswa karena guru mampu menjelaskan materi dengan lebih jelas.\nA. Motif lain (tidak membuktikan hubungan sebab-akibat). Menjelaskan motif mendaftar, bukan dampak ke siswa.\nB. MEMPERKUAT KUAT (bukti terukur dengan pembanding). Data terukur dengan pembanding sekolah tanpa pelatihan, serta mekanisme (penjelasan konsep lebih baik).\nC. Tidak relevan (urusan fasilitas, bukan hasil). Soal fasilitas acara, bukan hasil belajar.\nD. Lemah (perasaan subjektif). Perasaan guru bukan bukti nilai siswa naik.\nE. Tidak relevan (ikut tren atau ramai dibicarakan). Kebiasaan banyak daerah tidak membuktikan hasil belajar naik.\nTips: penguat terkuat memberi bukti terukur dengan pembanding dan menjelaskan sebab-akibatnya, bukan sekadar kesan, tren, atau fasilitas.","tables":[],"figs":[],"id":366},{"cat":"argumen","q":"Bank sampah di lingkungan RW dapat mengurangi sampah yang dibuang ke TPA karena warga memilah dan menyetorkan sampahnya. Oleh karena itu, semakin banyak warga yang menabung di bank sampah, semakin sedikit sampah yang dibuang ke TPA.\n\nManakah pernyataan berikut yang MEMPERKUAT pernyataan di atas?","opts":["Warga mengaku merasa lebih bangga dan lebih peduli lingkungan sejak ikut menabung di bank sampah di lingkungannya, menurut keterangan beberapa orang yang ditanya secara acak.","Warga rajin menyetor karena setiap setoran dihargai dengan tabungan uang tunai dan hadiah peralatan dapur, sebagaimana tertulis dalam ketentuan yang berlaku.","Bank sampah menyediakan ruang penyimpanan yang luas dengan timbangan digital baru yang dibeli dari dana kelurahan, sebagaimana tercantum dalam rencana kerja tahunan, dan hal tersebut diketahui oleh banyak orang di lingkungan itu.","Bank sampah sedang menjadi gerakan populer di kota-kota besar dan sering diliput televisi sebagai ikon peduli lingkungan, sehingga topik ini kerap menjadi bahan perbincangan di berbagai kesempatan.","Catatan dinas kebersihan menunjukkan volume sampah dari RW yang memiliki bank sampah turun 35% dalam setahun dan penurunannya sejajar dengan jumlah warga yang aktif menyetor, sedangkan RW tanpa bank sampah tidak berubah."],"a":4,"why":"Kunci: E\nInti argumen: Bank sampah di lingkungan RW dapat mengurangi sampah yang dibuang ke TPA karena warga memilah dan menyetorkan sampahnya.\nA. Lemah (perasaan subjektif). Perasaan bangga bukan bukti volume sampah berkurang.\nB. Motif lain (tidak membuktikan hubungan sebab-akibat). Menjelaskan motif menyetor, bukan bukti sampah ke TPA berkurang.\nC. Tidak relevan (urusan fasilitas, bukan hasil). Soal fasilitas, bukan hasil.\nD. Tidak relevan (ikut tren atau ramai dibicarakan). Populer bukan berarti terbukti mengurangi sampah.\nE. MEMPERKUAT KUAT (bukti terukur dengan pembanding). Data volume sampah, hubungan dosis (makin banyak penabung makin turun), dan pembanding RW tanpa bank sampah.\nTips: penguat terkuat memberi bukti terukur dengan pembanding dan menjelaskan sebab-akibatnya, bukan sekadar kesan, tren, atau fasilitas.","tables":[],"figs":[],"id":367},{"cat":"argumen","q":"Pemasangan panel surya di atap rumah dapat menurunkan tagihan listrik karena rumah memakai listrik dari sinar matahari. Oleh karena itu, semakin banyak panel terpasang, semakin rendah tagihan listrik rumah tangga.\n\nManakah pernyataan berikut yang MEMPERKUAT pernyataan di atas?","opts":["Pemasangan panel dilakukan teknisi bersertifikat yang bekerja rapi dan memberi garansi pemasangan selama dua tahun, sebagaimana tercantum dalam rencana kerja tahunan.","Data meteran pada 120 rumah menunjukkan tagihan bulanan turun rata-rata 15% untuk setiap tambahan satu panel, sedangkan rumah tanpa panel di lingkungan yang sama tidak mengalami penurunan tagihan.","Pemerintah memberi potongan pajak bumi dan bangunan bagi rumah yang memasang panel surya sehingga banyak pemilik rumah tertarik, sebagaimana tertulis dalam ketentuan yang berlaku.","Pemilik rumah merasa atap rumahnya tampak modern dan canggih setelah dipasangi deretan panel surya, terutama ketika mereka berbincang santai setelah kegiatan selesai.","Panel surya atap banyak dipasang di kompleks perumahan baru sebagai tren rumah ramah lingkungan, sehingga topik ini kerap menjadi bahan perbincangan di berbagai kesempatan."],"a":1,"why":"Kunci: B\nInti argumen: Pemasangan panel surya di atap rumah dapat menurunkan tagihan listrik karena rumah memakai listrik dari sinar matahari.\nA. Tidak relevan (urusan fasilitas, bukan hasil). Soal kualitas pemasangan, bukan hasil tagihan.\nB. MEMPERKUAT KUAT (bukti terukur dengan pembanding). Data terukur, hubungan jumlah panel dan penurunan, dan pembanding rumah tanpa panel.\nC. Motif lain (tidak membuktikan hubungan sebab-akibat). Menjelaskan alasan memasang, bukan bukti tagihan listrik turun.\nD. Lemah (perasaan subjektif). Penilaian tampilan, bukan penurunan tagihan.\nE. Tidak relevan (ikut tren atau ramai dibicarakan). Tren tidak membuktikan tagihan turun.\nTips: penguat terkuat memberi bukti terukur dengan pembanding dan menjelaskan sebab-akibatnya, bukan sekadar kesan, tren, atau fasilitas.","tables":[],"figs":[],"id":368},{"cat":"argumen","q":"Penggunaan mobil listrik dapat menurunkan polusi udara di perkotaan karena tidak menghasilkan gas buang dari knalpot. Oleh karena itu, semakin banyak mobil listrik berjalan di jalan, semakin rendah kadar polusi udara kota.\n\nManakah pernyataan berikut yang MEMPERKUAT pernyataan di atas?","opts":["Pabrikan otomotif besar berlomba meluncurkan model mobil listrik baru yang ramai diberitakan di berbagai media, dan pembicaraan tersebut terus ramai selama beberapa pekan terakhir, dan hal tersebut diketahui oleh banyak orang di lingkungan itu.","Stasiun pengisian daya dibangun di banyak pusat perbelanjaan dengan area parkir yang luas dan aman, sebagaimana tercantum dalam rencana kerja tahunan, dan kejadian serupa pernah dilaporkan pada tahun-tahun sebelumnya.","Pengemudi mobil listrik mengaku suara mesinnya jauh lebih halus sehingga perjalanan terasa lebih tenang dan nyaman, terutama ketika mereka berbincang santai setelah kegiatan selesai, dan keadaan itu sudah berlangsung selama beberapa bulan terakhir.","Sensor kualitas udara di jalur yang banyak dilalui mobil listrik mencatat kadar partikel debu dan nitrogen oksida sekitar 20% lebih rendah dibanding jalur serupa yang didominasi mobil bensin, dan kadarnya makin turun saat mobil listrik bertambah.","Pembeli mobil listrik mendapat pembebasan aturan ganjil genap sehingga banyak orang memilih mobil jenis ini, dan hal itu diumumkan kepada seluruh peserta sejak awal program, dan hal tersebut diketahui oleh banyak orang di lingkungan itu."],"a":3,"why":"Kunci: D\nInti argumen: Penggunaan mobil listrik dapat menurunkan polusi udara di perkotaan karena tidak menghasilkan gas buang dari knalpot.\nA. Tidak relevan (ikut tren atau ramai dibicarakan). Ramai diberitakan tidak membuktikan polusi turun.\nB. Tidak relevan (urusan fasilitas, bukan hasil). Soal fasilitas pengisian, bukan hasil udara.\nC. Lemah (perasaan subjektif). Soal kenyamanan, bukan kadar polusi.\nD. MEMPERKUAT KUAT (bukti terukur dengan pembanding). Pengukuran udara dengan pembanding jalur dan hubungan jumlah mobil listrik dengan penurunan polusi.\nE. Motif lain (tidak membuktikan hubungan sebab-akibat). Menjelaskan alasan membeli, bukan bukti polusi menurun.\nTips: penguat terkuat memberi bukti terukur dengan pembanding dan menjelaskan sebab-akibatnya, bukan sekadar kesan, tren, atau fasilitas.","tables":[],"figs":[],"id":369},{"cat":"argumen","q":"Penerapan jam kerja fleksibel dapat meningkatkan kinerja karyawan karena mereka bekerja pada jam saat paling produktif. Oleh karena itu, semakin fleksibel jam kerja, semakin tinggi kinerja karyawan.\n\nManakah pernyataan berikut yang MEMPERKUAT pernyataan di atas?","opts":["Karyawan mengaku lebih senang dan merasa dihargai saat diberi kebebasan mengatur jam masuk kerja, terutama ketika mereka berbincang santai setelah kegiatan selesai, dan hal tersebut diketahui oleh banyak orang di lingkungan itu.","Banyak perusahaan rintisan menerapkan jam kerja fleksibel karena dianggap gaya kerja yang modern dan keren, sehingga topik ini kerap menjadi bahan perbincangan di berbagai kesempatan.","Kantor menambah ruang santai dan menyediakan mesin kopi gratis sehingga karyawan betah berada di gedung, sebagaimana tercantum dalam rencana kerja tahunan, dan kejadian serupa pernah dilaporkan pada tahun-tahun sebelumnya.","Karyawan bekerja rajin karena dijanjikan bonus tahunan bagi yang paling jarang terlambat masuk kerja, dan hal itu diumumkan kepada seluruh peserta sejak awal program.","Perusahaan yang menerapkan jam kerja fleksibel mencatat target penjualan tercapai 92% dibanding 78% sebelum diterapkan, dan karyawan dengan jam paling fleksibel mencatat penyelesaian pekerjaan paling cepat."],"a":4,"why":"Kunci: E\nInti argumen: Penerapan jam kerja fleksibel dapat meningkatkan kinerja karyawan karena mereka bekerja pada jam saat paling produktif.\nA. Lemah (perasaan subjektif). Rasa senang bukan ukuran kinerja.\nB. Tidak relevan (ikut tren atau ramai dibicarakan). Ikut tren, tidak membuktikan kinerja naik.\nC. Tidak relevan (urusan fasilitas, bukan hasil). Soal fasilitas, bukan kinerja.\nD. Motif lain (tidak membuktikan hubungan sebab-akibat). Menjelaskan motif lain (bonus), bukan efek jam fleksibel.\nE. MEMPERKUAT KUAT (bukti terukur dengan pembanding). Data kinerja sebelum-sesudah dan hubungan makin fleksibel makin cepat; jelas terukur.\nTips: penguat terkuat memberi bukti terukur dengan pembanding dan menjelaskan sebab-akibatnya, bukan sekadar kesan, tren, atau fasilitas.","tables":[],"figs":[],"id":370},{"cat":"argumen","q":"Program pendampingan (mentoring) bagi karyawan baru dapat mengurangi pengunduran diri karena karyawan merasa terbantu beradaptasi. Oleh karena itu, semakin intensif pendampingan, semakin sedikit karyawan baru yang mengundurkan diri.\n\nManakah pernyataan berikut yang MEMPERKUAT pernyataan di atas?","opts":["Data kepegawaian menunjukkan karyawan baru yang didampingi mentor setiap minggu hanya 8% yang mengundurkan diri dalam setahun, dibanding 30% pada kelompok tanpa mentor yang masuk pada periode dan posisi serupa.","Sejumlah karyawan baru mengaku mentornya ramah dan sering mengajak mereka makan siang bersama, menurut keterangan beberapa orang yang ditanya secara acak, dan kejadian serupa pernah dilaporkan pada tahun-tahun sebelumnya.","Mentor menerima insentif tambahan sehingga mereka berlomba menambah jumlah karyawan baru yang dibinanya, sebagaimana tertulis dalam ketentuan yang berlaku, dan hal tersebut diketahui oleh banyak orang di lingkungan itu.","Perusahaan menyediakan ruang mentoring dengan sofa nyaman dan papan tulis besar di lantai dua gedung, sebagaimana tercantum dalam rencana kerja tahunan.","Program mentoring sedang digemari perusahaan besar dan sering dibahas dalam seminar sumber daya manusia, sehingga topik ini kerap menjadi bahan perbincangan di berbagai kesempatan."],"a":0,"why":"Kunci: A\nInti argumen: Program pendampingan (mentoring) bagi karyawan baru dapat mengurangi pengunduran diri karena karyawan merasa terbantu beradaptasi.\nA. MEMPERKUAT KUAT (bukti terukur dengan pembanding). Angka pengunduran diri dibandingkan antar kelompok sebanding, dan makin intensif pendampingan makin rendah.\nB. Lemah (perasaan subjektif). Kesan pribadi, bukan data pengunduran diri.\nC. Motif lain (tidak membuktikan hubungan sebab-akibat). Menjelaskan motif mentor, bukan bukti pengunduran diri berkurang.\nD. Tidak relevan (urusan fasilitas, bukan hasil). Soal fasilitas ruangan.\nE. Tidak relevan (ikut tren atau ramai dibicarakan). Populer bukan bukti efektif.\nTips: penguat terkuat memberi bukti terukur dengan pembanding dan menjelaskan sebab-akibatnya, bukan sekadar kesan, tren, atau fasilitas.","tables":[],"figs":[],"id":371},{"cat":"argumen","q":"Penyediaan menu sehat di kantin sekolah dapat menurunkan kasus kegemukan siswa karena asupan gula dan lemak berkurang. Oleh karena itu, semakin banyak menu sehat tersedia, semakin sedikit siswa yang mengalami kegemukan.\n\nManakah pernyataan berikut yang MEMPERKUAT pernyataan di atas?","opts":["Kantin sehat menjadi program yang sering dipamerkan sekolah-sekolah dalam lomba tingkat provinsi, sehingga topik ini kerap menjadi bahan perbincangan di berbagai kesempatan, dan keadaan itu sudah berlangsung selama beberapa bulan terakhir.","Kantin direnovasi dengan meja baru dan pendingin udara sehingga siswa nyaman makan di dalamnya, sebagaimana tercantum dalam rencana kerja tahunan, dan hal tersebut diketahui oleh banyak orang di lingkungan itu.","Siswa mengatakan menu sayur di kantin terlihat segar dan warnanya menarik untuk difoto, terutama ketika mereka berbincang santai setelah kegiatan selesai, dan keadaan itu sudah berlangsung selama beberapa bulan terakhir.","Pemeriksaan tahunan menunjukkan persentase siswa dengan berat badan berlebih turun dari 22% menjadi 14% di sekolah yang mengganti sebagian besar menu kantinnya, sementara sekolah yang tetap menjual gorengan dan minuman manis tidak berubah.","Penjual kantin senang karena modal belanja sayur ternyata lebih murah dibanding bahan menu goreng, dan hal itu diumumkan kepada seluruh peserta sejak awal program, dan kejadian serupa pernah dilaporkan pada tahun-tahun sebelumnya."],"a":3,"why":"Kunci: D\nInti argumen: Penyediaan menu sehat di kantin sekolah dapat menurunkan kasus kegemukan siswa karena asupan gula dan lemak berkurang.\nA. Tidak relevan (ikut tren atau ramai dibicarakan). Sering dipamerkan bukan bukti berhasil.\nB. Tidak relevan (urusan fasilitas, bukan hasil). Soal fasilitas kantin.\nC. Lemah (perasaan subjektif). Kesan tampilan, bukan data kegemukan.\nD. MEMPERKUAT KUAT (bukti terukur dengan pembanding). Data sebelum-sesudah dengan pembanding sekolah yang tidak mengganti menu.\nE. Motif lain (tidak membuktikan hubungan sebab-akibat). Menjelaskan keuntungan penjual, bukan bukti kegemukan turun.\nTips: penguat terkuat memberi bukti terukur dengan pembanding dan menjelaskan sebab-akibatnya, bukan sekadar kesan, tren, atau fasilitas.","tables":[],"figs":[],"id":372},{"cat":"argumen","q":"Pelajaran pemrograman dasar dapat meningkatkan kemampuan penalaran logis siswa karena siswa terbiasa menyusun langkah penyelesaian secara berurutan. Oleh karena itu, semakin lama siswa belajar pemrograman, semakin baik kemampuan penalarannya.\n\nManakah pernyataan berikut yang MEMPERKUAT pernyataan di atas?","opts":["Tes penalaran yang sama diberikan pada awal dan akhir tahun, dan skor siswa yang belajar pemrograman naik 25 poin serta terus naik tiap bulan, sedangkan siswa seangkatan yang tidak belajar pemrograman hanya naik 5 poin.","Siswa mengaku pelajaran pemrograman terasa seru karena mereka dapat membuat permainan sederhana buatan sendiri, menurut keterangan beberapa orang yang ditanya secara acak.","Pemrograman dijadikan materi populer di sekolah karena banyak negara maju sudah memasukkannya ke dalam kurikulum, sehingga topik ini kerap menjadi bahan perbincangan di berbagai kesempatan.","Siswa rajin mengikuti pelajaran karena nilai pemrograman menjadi syarat mengikuti lomba berhadiah, sebagaimana tertulis dalam ketentuan yang berlaku, dan kejadian serupa pernah dilaporkan pada tahun-tahun sebelumnya.","Sekolah membeli laptop baru dengan spesifikasi tinggi untuk dipasang di laboratorium komputer, sebagaimana tercantum dalam rencana kerja tahunan, dan keadaan itu sudah berlangsung selama beberapa bulan terakhir."],"a":0,"why":"Kunci: A\nInti argumen: Pelajaran pemrograman dasar dapat meningkatkan kemampuan penalaran logis siswa karena siswa terbiasa menyusun langkah penyelesaian secara berurutan.\nA. MEMPERKUAT KUAT (bukti terukur dengan pembanding). Pengukuran dengan alat yang sama, ada pembanding, dan peningkatan sejalan dengan lamanya belajar.\nB. Lemah (perasaan subjektif). Rasa seru bukan bukti penalaran meningkat.\nC. Tidak relevan (ikut tren atau ramai dibicarakan). Ikut negara lain tidak membuktikan hasil.\nD. Motif lain (tidak membuktikan hubungan sebab-akibat). Menjelaskan motif belajar, bukan peningkatan penalaran.\nE. Tidak relevan (urusan fasilitas, bukan hasil). Soal peralatan, bukan penalaran.\nTips: penguat terkuat memberi bukti terukur dengan pembanding dan menjelaskan sebab-akibatnya, bukan sekadar kesan, tren, atau fasilitas.","tables":[],"figs":[],"id":373},{"cat":"argumen","q":"Pembangunan taman atap di gedung perkantoran dapat menurunkan suhu ruangan di bawahnya karena tanaman menyerap panas matahari. Oleh karena itu, semakin luas taman atap, semakin sejuk ruangan gedung.\n\nManakah pernyataan berikut yang MEMPERKUAT pernyataan di atas?","opts":["Penghuni gedung mengaku senang memandang hijaunya taman atap dari jendela kantor mereka, menurut keterangan beberapa orang yang ditanya secara acak, dan kejadian serupa pernah dilaporkan pada tahun-tahun sebelumnya.","Taman atap kini menjadi desain populer yang sering muncul pada majalah arsitektur dan media sosial, sehingga topik ini kerap menjadi bahan perbincangan di berbagai kesempatan.","Pengukuran termometer menunjukkan suhu ruangan lantai teratas turun 3°C pada gedung bertaman atap, penurunannya makin besar pada gedung dengan taman atap yang lebih luas, dan gedung tanpa taman atap tidak mengalami penurunan.","Pengelola gedung mendapat penghargaan bangunan hijau dari asosiasi pengembang setelah membangun taman atap, dan hal itu diumumkan kepada seluruh peserta sejak awal program, dan keadaan itu sudah berlangsung selama beberapa bulan terakhir.","Taman atap dilengkapi bangku dan gazebo tempat karyawan beristirahat saat makan siang, sebagaimana tercantum dalam rencana kerja tahunan, dan keadaan itu sudah berlangsung selama beberapa bulan terakhir."],"a":2,"why":"Kunci: C\nInti argumen: Pembangunan taman atap di gedung perkantoran dapat menurunkan suhu ruangan di bawahnya karena tanaman menyerap panas matahari.\nA. Lemah (perasaan subjektif). Soal pemandangan, bukan suhu ruangan.\nB. Tidak relevan (ikut tren atau ramai dibicarakan). Populer bukan bukti menurunkan suhu.\nC. MEMPERKUAT KUAT (bukti terukur dengan pembanding). Data suhu terukur, hubungan luas dan penurunan, serta pembanding gedung tanpa taman atap.\nD. Motif lain (tidak membuktikan hubungan sebab-akibat). Penghargaan tidak membuktikan suhu turun.\nE. Tidak relevan (urusan fasilitas, bukan hasil). Soal fasilitas, bukan suhu.\nTips: penguat terkuat memberi bukti terukur dengan pembanding dan menjelaskan sebab-akibatnya, bukan sekadar kesan, tren, atau fasilitas.","tables":[],"figs":[],"id":374},{"cat":"argumen","q":"Pemeriksaan kesehatan berkala dapat menurunkan kematian akibat penyakit jantung karena penyakit terdeteksi sebelum parah. Oleh karena itu, semakin banyak warga yang rutin memeriksakan diri, semakin sedikit kematian akibat penyakit jantung.\n\nManakah pernyataan berikut yang MEMPERKUAT pernyataan di atas?","opts":["Pemeriksaan kesehatan berkala menjadi tren gaya hidup sehat yang diikuti banyak orang di media sosial, dan pembicaraan tersebut terus ramai selama beberapa pekan terakhir, dan hal tersebut diketahui oleh banyak orang di lingkungan itu.","Puskesmas membuka loket pemeriksaan di pasar sehingga warga tidak perlu antre lama, dan pekerjaan tersebut selesai sebelum kegiatan dimulai, dan hal tersebut diketahui oleh banyak orang di lingkungan itu.","Warga datang memeriksakan diri karena diberi paket sembako gratis oleh pemerintah daerah, sebagaimana tertulis dalam ketentuan yang berlaku, dan hal tersebut diketahui oleh banyak orang di lingkungan itu.","Warga yang ikut pemeriksaan mengaku merasa lebih tenang dan yakin tubuhnya sehat setelah mendapat hasil pemeriksaan, menurut keterangan beberapa orang yang ditanya secara acak, dan hal tersebut diketahui oleh banyak orang di lingkungan itu.","Catatan rumah sakit di dua kabupaten menunjukkan kematian akibat penyakit jantung turun 18% di kabupaten yang warganya rutin diperiksa dan sebagian besar pasien terdeteksi pada stadium awal, sedangkan kabupaten tanpa program pemeriksaan tidak berubah."],"a":4,"why":"Kunci: E\nInti argumen: Pemeriksaan kesehatan berkala dapat menurunkan kematian akibat penyakit jantung karena penyakit terdeteksi sebelum parah.\nA. Tidak relevan (ikut tren atau ramai dibicarakan). Tren tidak membuktikan hasil.\nB. Tidak relevan (urusan fasilitas, bukan hasil). Soal kemudahan layanan, bukan angka kematian.\nC. Motif lain (tidak membuktikan hubungan sebab-akibat). Menjelaskan alasan datang, bukan bukti kematian berkurang.\nD. Lemah (perasaan subjektif). Perasaan tenang bukan bukti angka kematian turun.\nE. MEMPERKUAT KUAT (bukti terukur dengan pembanding). Data kematian dengan pembanding kabupaten, ditambah mekanisme deteksi stadium awal.\nTips: penguat terkuat memberi bukti terukur dengan pembanding dan menjelaskan sebab-akibatnya, bukan sekadar kesan, tren, atau fasilitas.","tables":[],"figs":[],"id":375},{"cat":"kecukupan-aljabar","q":"Diketahui x dan y adalah bilangan bulat.\nPERTANYAAN UTAMA:\nBerapakah nilai 4x + 2?\nPERNYATAAN (1): x = 4.\nPERNYATAAN (2): 2x + 5 = 13.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":3,"why":"Yang ditanyakan: Berapakah nilai 4x + 2?\nPernyataan (1): Dari pernyataan ini nilai x langsung diketahui: x = 4. Jawabannya pasti: 18. → CUKUP.\nPernyataan (2): 2x = 13 − 5 = 8, sehingga x = 4. Jawabannya pasti: 18. → CUKUP.\nKesimpulan: Masing-masing pernyataan sudah cukup. Jawaban: D.","tables":[],"figs":[],"id":376},{"cat":"kecukupan-aljabar","q":"Diketahui a dan b adalah bilangan bulat.\nPERTANYAAN UTAMA:\nBerapakah nilai a + b?\nPERNYATAAN (1): a + b = 23.\nPERNYATAAN (2): a = 15.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":0,"why":"Yang ditanyakan: Berapakah nilai a + b?\nPernyataan (1): Semua kemungkinan yang memenuhi pernyataan (1) menghasilkan jawaban yang sama: 23. Contoh: a = 3, b = 20; a = 21, b = 2, semuanya 23. → CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: a = 15, b = 5 → 20; a = 15, b = 25 → 40. Jawabannya berbeda-beda → TIDAK CUKUP.\nKesimpulan: Hanya pernyataan (1) yang cukup. Jawaban: A.","tables":[],"figs":[],"id":377},{"cat":"kecukupan-aljabar","q":"Diketahui a, b, dan c adalah bilangan bulat dari 0 sampai 24.\nPERTANYAAN UTAMA:\nBerapakah nilai rata-rata dari tiga bilangan bulat a, b, dan c?\nPERNYATAAN (1): b = 11.\nPERNYATAAN (2): a + b + c = 25.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":1,"why":"Yang ditanyakan: Berapakah nilai rata-rata dari tiga bilangan bulat a, b, dan c?\nPernyataan (1): Masih banyak kemungkinan. Contoh: a = 8, b = 11, c = 8 → 9; a = 16, b = 11, c = 16 → 14,33333333333333333333333333. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Rata-rata = jumlah ÷ 3 = 25 ÷ 3. Jawabannya pasti: 8,333333333333333333333333333. → CUKUP.\nKesimpulan: Hanya pernyataan (2) yang cukup. Jawaban: B.","tables":[],"figs":[],"id":378},{"cat":"kecukupan-aljabar","q":"Diketahui a dan b adalah bilangan bulat.\nPERTANYAAN UTAMA:\nBerapakah nilai a?\nPERNYATAAN (1): a = 17.\nPERNYATAAN (2): 4a + 2 = 70.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":3,"why":"Yang ditanyakan: Berapakah nilai a?\nPernyataan (1): Dari pernyataan ini nilai a langsung diketahui: a = 17. Jawabannya pasti: 17. → CUKUP.\nPernyataan (2): 4a = 70 − 2 = 68, sehingga a = 17. Jawabannya pasti: 17. → CUKUP.\nKesimpulan: Masing-masing pernyataan sudah cukup. Jawaban: D.","tables":[],"figs":[],"id":379},{"cat":"kecukupan-aljabar","q":"Diketahui a, b, dan c adalah bilangan bulat dari 0 sampai 24.\nPERTANYAAN UTAMA:\nBerapakah nilai rata-rata dari tiga bilangan bulat a, b, dan c?\nPERNYATAAN (1): b + c = 38.\nPERNYATAAN (2): a = 4.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":2,"why":"Yang ditanyakan: Berapakah nilai rata-rata dari tiga bilangan bulat a, b, dan c?\nPernyataan (1): Masih banyak kemungkinan. Contoh: a = 8, b = 19, c = 19 → 15,33333333333333333333333333; a = 16, b = 19, c = 19 → 18. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: a = 4, b = 8, c = 8 → 6,666666666666666666666666667; a = 4, b = 16, c = 16 → 12. Jawabannya berbeda-beda → TIDAK CUKUP.\nDigabung: hanya tersisa satu kemungkinan (a = 4, b = 14, c = 24), jawabannya 14 → CUKUP.\nKesimpulan: Satu pernyataan saja tidak cukup, tetapi keduanya bersama-sama cukup. Jawaban: C.","tables":[],"figs":[],"id":380},{"cat":"kecukupan-aljabar","q":"Diketahui a, b, dan c adalah bilangan bulat dari 0 sampai 24.\nPERTANYAAN UTAMA:\nBerapakah nilai rata-rata dari tiga bilangan bulat a, b, dan c?\nPERNYATAAN (1): a + b = 27.\nPERNYATAAN (2): a + b + c = 32.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":1,"why":"Yang ditanyakan: Berapakah nilai rata-rata dari tiga bilangan bulat a, b, dan c?\nPernyataan (1): Masih banyak kemungkinan. Contoh: a = 14, b = 13, c = 8 → 11,66666666666666666666666667; a = 14, b = 13, c = 16 → 14,33333333333333333333333333. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Rata-rata = jumlah ÷ 3 = 32 ÷ 3. Jawabannya pasti: 10,66666666666666666666666667. → CUKUP.\nKesimpulan: Hanya pernyataan (2) yang cukup. Jawaban: B.","tables":[],"figs":[],"id":381},{"cat":"kecukupan-aljabar","q":"Diketahui x dan y adalah bilangan bulat.\nPERTANYAAN UTAMA:\nApakah x + y > 17?\nPERNYATAAN (1): y = 12.\nPERNYATAAN (2): 2x + 3 = 19.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":2,"why":"Yang ditanyakan: Apakah x + y > 17?\nPernyataan (1): Masih banyak kemungkinan. Contoh: x = −5, y = 12 → Tidak; x = 26, y = 12 → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: x = 8, y = −3 → Tidak; x = 8, y = 28 → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nDigabung: hanya tersisa satu kemungkinan (x = 8, y = 12), jawabannya Ya → CUKUP.\nKesimpulan: Satu pernyataan saja tidak cukup, tetapi keduanya bersama-sama cukup. Jawaban: C.","tables":[],"figs":[],"id":382},{"cat":"kecukupan-aljabar","q":"Diketahui p dan q adalah bilangan bulat.\nPERTANYAAN UTAMA:\nApakah p > q?\nPERNYATAAN (1): p − q = 3.\nPERNYATAAN (2): p + q = 21.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":0,"why":"Yang ditanyakan: Apakah p > q?\nPernyataan (1): Semua kemungkinan yang memenuhi pernyataan (1) menghasilkan jawaban yang sama: Ya. Contoh: p = 7, q = 4; p = 26, q = 23, semuanya Ya. → CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: p = −2, q = 23 → Tidak; p = 24, q = −3 → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nKesimpulan: Hanya pernyataan (1) yang cukup. Jawaban: A.","tables":[],"figs":[],"id":383},{"cat":"kecukupan-aljabar","q":"Diketahui a, b, dan c adalah bilangan bulat dari 0 sampai 24.\nPERTANYAAN UTAMA:\nBerapakah nilai rata-rata dari tiga bilangan bulat a, b, dan c?\nPERNYATAAN (1): a + b + c = 40.\nPERNYATAAN (2): a + b = 27.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":0,"why":"Yang ditanyakan: Berapakah nilai rata-rata dari tiga bilangan bulat a, b, dan c?\nPernyataan (1): Rata-rata = jumlah ÷ 3 = 40 ÷ 3. Jawabannya pasti: 13,33333333333333333333333333. → CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: a = 14, b = 13, c = 8 → 11,66666666666666666666666667; a = 14, b = 13, c = 16 → 14,33333333333333333333333333. Jawabannya berbeda-beda → TIDAK CUKUP.\nKesimpulan: Hanya pernyataan (1) yang cukup. Jawaban: A.","tables":[],"figs":[],"id":384},{"cat":"kecukupan-aljabar","q":"Sebuah persegi panjang memiliki panjang p dan lebar l, keduanya bilangan bulat (dalam cm) dengan p > l.\nPERTANYAAN UTAMA:\nApakah luas persegi panjang tersebut lebih dari 327 cm²?\nPERNYATAAN (1): Persegi panjang tersebut digambar pada kertas berpetak.\nPERNYATAAN (2): Panjang persegi panjang adalah 20 cm.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":4,"why":"Yang ditanyakan: Apakah luas persegi panjang tersebut lebih dari 327 cm²?\nPernyataan (1): Masih banyak kemungkinan. Contoh: p = 24, l = 4 → Tidak; p = 40, l = 39 → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: p = 20, l = 9 → Tidak; p = 20, l = 18 → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nDigabung pun masih ada lebih dari satu kemungkinan. Contoh: p = 20, l = 9 → Tidak; p = 20, l = 18 → Ya → TIDAK CUKUP.\nKesimpulan: Bahkan setelah digabung, datanya tetap tidak cukup. Jawaban: E.","tables":[],"figs":[],"id":385},{"cat":"kecukupan-aljabar","q":"Sebuah persegi panjang memiliki panjang p dan lebar l, keduanya bilangan bulat (dalam cm) dengan p > l.\nPERTANYAAN UTAMA:\nBerapakah luas persegi panjang tersebut?\nPERNYATAAN (1): Keliling persegi panjang adalah 72 cm.\nPERNYATAAN (2): Lebar persegi panjang adalah 14 cm.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":2,"why":"Yang ditanyakan: Berapakah luas persegi panjang tersebut?\nPernyataan (1): Masih banyak kemungkinan. Contoh: p = 30, l = 6 → 180 cm²; p = 24, l = 12 → 288 cm². Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: p = 27, l = 14 → 378 cm²; p = 39, l = 14 → 546 cm². Jawabannya berbeda-beda → TIDAK CUKUP.\nDigabung: hanya tersisa satu kemungkinan (p = 22, l = 14), jawabannya 308 cm² → CUKUP.\nKesimpulan: Satu pernyataan saja tidak cukup, tetapi keduanya bersama-sama cukup. Jawaban: C.","tables":[],"figs":[],"id":386},{"cat":"kecukupan-aljabar","q":"Diketahui n adalah bilangan bulat positif.\nPERTANYAAN UTAMA:\nApakah bilangan n habis dibagi 3?\nPERNYATAAN (1): n merupakan bilangan prima.\nPERNYATAAN (2): n berada di antara 4 dan 19 (termasuk keduanya).","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":2,"why":"Yang ditanyakan: Apakah bilangan n habis dibagi 3?\nPernyataan (1): Masih banyak kemungkinan. Contoh: n = 53 → Tidak; n = 3 → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: n = 11 → Tidak; n = 12 → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nDigabung: hanya tersisa satu kemungkinan (n = 5), jawabannya Tidak → CUKUP.\nKesimpulan: Satu pernyataan saja tidak cukup, tetapi keduanya bersama-sama cukup. Jawaban: C.","tables":[],"figs":[],"id":387},{"cat":"kecukupan-aljabar","q":"Sebuah persegi panjang memiliki panjang p dan lebar l, keduanya bilangan bulat (dalam cm) dengan p > l.\nPERTANYAAN UTAMA:\nBerapakah luas persegi panjang tersebut?\nPERNYATAAN (1): Jumlah panjang dan lebar adalah 26 cm.\nPERNYATAAN (2): Luas persegi panjang adalah 88 cm².","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":1,"why":"Yang ditanyakan: Berapakah luas persegi panjang tersebut?\nPernyataan (1): Masih banyak kemungkinan. Contoh: p = 21, l = 5 → 105 cm²; p = 17, l = 9 → 153 cm². Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Semua kemungkinan yang memenuhi pernyataan (2) menghasilkan jawaban yang sama: 88 cm². Contoh: p = 22, l = 4; p = 44, l = 2, semuanya 88 cm². → CUKUP.\nKesimpulan: Hanya pernyataan (2) yang cukup. Jawaban: B.","tables":[],"figs":[],"id":388},{"cat":"kecukupan-aljabar","q":"Diketahui a dan b adalah bilangan bulat.\nPERTANYAAN UTAMA:\nBerapakah nilai a + b?\nPERNYATAAN (1): a − b = 9.\nPERNYATAAN (2): a merupakan bilangan positif.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":4,"why":"Yang ditanyakan: Berapakah nilai a + b?\nPernyataan (1): Masih banyak kemungkinan. Contoh: a = 11, b = 2 → 13; a = 28, b = 19 → 47. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: a = 19, b = 2 → 21; a = 28, b = 28 → 56. Jawabannya berbeda-beda → TIDAK CUKUP.\nDigabung pun masih ada lebih dari satu kemungkinan. Contoh: a = 16, b = 7 → 23; a = 31, b = 22 → 53 → TIDAK CUKUP.\nKesimpulan: Bahkan setelah digabung, datanya tetap tidak cukup. Jawaban: E.","tables":[],"figs":[],"id":389},{"cat":"kecukupan-aljabar","q":"Diketahui a, b, dan c adalah bilangan bulat dari 0 sampai 24.\nPERTANYAAN UTAMA:\nBerapakah nilai rata-rata dari tiga bilangan bulat a, b, dan c?\nPERNYATAAN (1): a + b = 28.\nPERNYATAAN (2): a = 14.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":4,"why":"Yang ditanyakan: Berapakah nilai rata-rata dari tiga bilangan bulat a, b, dan c?\nPernyataan (1): Masih banyak kemungkinan. Contoh: a = 14, b = 14, c = 8 → 12; a = 14, b = 14, c = 16 → 14,66666666666666666666666667. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: a = 14, b = 8, c = 8 → 10; a = 14, b = 16, c = 16 → 15,33333333333333333333333333. Jawabannya berbeda-beda → TIDAK CUKUP.\nDigabung pun masih ada lebih dari satu kemungkinan. Contoh: a = 14, b = 14, c = 8 → 12; a = 14, b = 14, c = 16 → 14,66666666666666666666666667 → TIDAK CUKUP.\nKesimpulan: Bahkan setelah digabung, datanya tetap tidak cukup. Jawaban: E.","tables":[],"figs":[],"id":390},{"cat":"kecukupan-aljabar","q":"Diketahui m dan n adalah bilangan bulat.\nPERTANYAAN UTAMA:\nBerapakah nilai m + n?\nPERNYATAAN (1): m + n = 15.\nPERNYATAAN (2): 4m + 4n = 60.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":3,"why":"Yang ditanyakan: Berapakah nilai m + n?\nPernyataan (1): Semua kemungkinan yang memenuhi pernyataan (1) menghasilkan jawaban yang sama: 15. Contoh: m = 0, n = 15; m = 15, n = 0, semuanya 15. → CUKUP.\nPernyataan (2): Semua kemungkinan yang memenuhi pernyataan (2) menghasilkan jawaban yang sama: 15. Contoh: m = 0, n = 15; m = 15, n = 0, semuanya 15. → CUKUP.\nKesimpulan: Masing-masing pernyataan sudah cukup. Jawaban: D.","tables":[],"figs":[],"id":391},{"cat":"kecukupan-aljabar","q":"Diketahui a dan b adalah bilangan bulat.\nPERTANYAAN UTAMA:\nBerapakah nilai 4a + 8?\nPERNYATAAN (1): b = 7.\nPERNYATAAN (2): a² = 4.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":4,"why":"Yang ditanyakan: Berapakah nilai 4a + 8?\nPernyataan (1): Masih banyak kemungkinan. Contoh: a = 5, b = 7 → 28; a = 25, b = 7 → 108. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: a = −2, b = 15 → 0; a = 2, b = 15 → 16. Jawabannya berbeda-beda → TIDAK CUKUP.\nDigabung pun masih ada lebih dari satu kemungkinan. Contoh: a = −2, b = 7 → 0; a = 2, b = 7 → 16 → TIDAK CUKUP.\nKesimpulan: Bahkan setelah digabung, datanya tetap tidak cukup. Jawaban: E.","tables":[],"figs":[],"id":392},{"cat":"kecukupan-aljabar","q":"Diketahui x dan y adalah bilangan bulat.\nPERTANYAAN UTAMA:\nBerapakah nilai x?\nPERNYATAAN (1): x = 13.\nPERNYATAAN (2): 3x + 7 = 46.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":3,"why":"Yang ditanyakan: Berapakah nilai x?\nPernyataan (1): Dari pernyataan ini nilai x langsung diketahui: x = 13. Jawabannya pasti: 13. → CUKUP.\nPernyataan (2): 3x = 46 − 7 = 39, sehingga x = 13. Jawabannya pasti: 13. → CUKUP.\nKesimpulan: Masing-masing pernyataan sudah cukup. Jawaban: D.","tables":[],"figs":[],"id":393},{"cat":"kecukupan-aljabar","q":"Sebuah persegi panjang memiliki panjang p dan lebar l, keduanya bilangan bulat (dalam cm) dengan p > l.\nPERTANYAAN UTAMA:\nApakah luas persegi panjang tersebut lebih dari 365 cm²?\nPERNYATAAN (1): Panjang persegi panjang adalah 23 cm.\nPERNYATAAN (2): Luas persegi panjang adalah 345 cm².","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":1,"why":"Yang ditanyakan: Apakah luas persegi panjang tersebut lebih dari 365 cm²?\nPernyataan (1): Masih banyak kemungkinan. Contoh: p = 23, l = 8 → Tidak; p = 23, l = 19 → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Semua kemungkinan yang memenuhi pernyataan (2) menghasilkan jawaban yang sama: Tidak. → CUKUP.\nKesimpulan: Hanya pernyataan (2) yang cukup. Jawaban: B.","tables":[],"figs":[],"id":394},{"cat":"kecukupan-aljabar","q":"Sebuah persegi panjang memiliki panjang p dan lebar l, keduanya bilangan bulat (dalam cm) dengan p > l.\nPERTANYAAN UTAMA:\nBerapakah keliling persegi panjang tersebut?\nPERNYATAAN (1): Selisih panjang dan lebar adalah 11 cm.\nPERNYATAAN (2): Keliling persegi panjang adalah 82 cm.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":1,"why":"Yang ditanyakan: Berapakah keliling persegi panjang tersebut?\nPernyataan (1): Masih banyak kemungkinan. Contoh: p = 25, l = 14 → 78 cm; p = 38, l = 27 → 130 cm. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Keliling = 2(p + l) = 82 sehingga p + l = 41. Jawabannya pasti: 82 cm. → CUKUP.\nKesimpulan: Hanya pernyataan (2) yang cukup. Jawaban: B.","tables":[],"figs":[],"id":395},{"cat":"kecukupan-aljabar","q":"Diketahui x dan y adalah bilangan bulat.\nPERTANYAAN UTAMA:\nBerapakah nilai x − y?\nPERNYATAAN (1): 5x + 6 = 56.\nPERNYATAAN (2): x = 10.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":4,"why":"Yang ditanyakan: Berapakah nilai x − y?\nPernyataan (1): Masih banyak kemungkinan. Contoh: x = 10, y = 25 → −15; x = 10, y = 5 → 5. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: x = 10, y = 25 → −15; x = 10, y = 5 → 5. Jawabannya berbeda-beda → TIDAK CUKUP.\nDigabung pun masih ada lebih dari satu kemungkinan. Contoh: x = 10, y = 25 → −15; x = 10, y = 5 → 5 → TIDAK CUKUP.\nKesimpulan: Bahkan setelah digabung, datanya tetap tidak cukup. Jawaban: E.","tables":[],"figs":[],"id":396},{"cat":"kecukupan-aljabar","q":"Diketahui a dan b adalah bilangan bulat.\nPERTANYAAN UTAMA:\nApakah a = b?\nPERNYATAAN (1): a − b = −2.\nPERNYATAAN (2): ab = 224.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":3,"why":"Yang ditanyakan: Apakah a = b?\nPernyataan (1): Semua kemungkinan yang memenuhi pernyataan (1) menghasilkan jawaban yang sama: Tidak. Contoh: a = 4, b = 6; a = 24, b = 26, semuanya Tidak. → CUKUP.\nPernyataan (2): Semua kemungkinan yang memenuhi pernyataan (2) menghasilkan jawaban yang sama: Tidak. Contoh: a = 14, b = 16; a = 28, b = 8, semuanya Tidak. → CUKUP.\nKesimpulan: Masing-masing pernyataan sudah cukup. Jawaban: D.","tables":[],"figs":[],"id":397},{"cat":"kecukupan-aljabar","q":"Diketahui p dan q adalah bilangan bulat.\nPERTANYAAN UTAMA:\nApakah p + q > 20?\nPERNYATAAN (1): p + q = 18.\nPERNYATAAN (2): 2p + 4q = 40.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":0,"why":"Yang ditanyakan: Apakah p + q > 20?\nPernyataan (1): Semua kemungkinan yang memenuhi pernyataan (1) menghasilkan jawaban yang sama: Tidak. Contoh: p = 1, q = 17; p = 17, q = 1, semuanya Tidak. → CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: p = 4, q = 8 → Tidak; p = 34, q = −7 → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nKesimpulan: Hanya pernyataan (1) yang cukup. Jawaban: A.","tables":[],"figs":[],"id":398},{"cat":"kecukupan-aljabar","q":"Diketahui p dan q adalah bilangan bulat.\nPERTANYAAN UTAMA:\nBerapakah nilai p + q?\nPERNYATAAN (1): p + q = 16.\nPERNYATAAN (2): 5p + 6 = 16.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernya ak cukup, tetapi keduanya bersama-sama cukup. Jawaban: C.","tables":[],"figs":[],"id":400},{"cat":"kecukupan-konteks","q":"Harga tiket dewasa Rp40.000,00 dan tiket anak-anak Rp20.000,00. Jumlah tiket dewasa a dan anak-anak c adalah bilangan bulat.\nPERTANYAAN UTAMA:\nBerapakah total pendapatan dari penjualan tiket?\nPERNYATAAN (1): Jumlah tiket anak-anak yang terjual adalah 27.\nPERNYATAAN (2): Jumlah tiket dewasa yang terjual adalah 37.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":2,"why":"Yang ditanyakan: Berapakah total pendapatan dari penjualan tiket?\nPernyataan (1): Masih banyak kemungkinan. Contoh: dewasa 20, anak-anak 27 → Rp1.340.000,00; dewasa 40, anak-anak 27 → Rp2.140.000,00. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: dewasa 37, anak-anak 20 → Rp1.880.000,00; dewasa 37, anak-anak 40 → Rp2.280.000,00. Jawabannya berbeda-beda → TIDAK CUKUP.\nDigabung: hanya tersisa satu kemungkinan (dewasa 37, anak-anak 27), jawabannya Rp2.020.000,00 → CUKUP.\nKesimpulan: Satu pernyataan saja tidak cukup, tetapi keduanya bersama-sama cukup. Jawaban: C.","tables":[],"figs":[],"id":401},{"cat":"kecukupan-konteks","q":"Nilai Raka pada tiga mata pelajaran adalah sebagai berikut (nilai berupa bilangan bulat 0–100).\nPERTANYAAN UTAMA:\nApakah rata-rata nilai Raka lebih dari 70?\nPERNYATAAN (1): Jumlah ketiga nilai adalah 229.\nPERNYATAAN (2): Nilai Bahasa Indonesia lebih dari 72.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetap ,"figs":[],"id":410},{"cat":"kecukupan-konteks","q":"Sebuah keluarga mengonsumsi air selama tiga hari (konsumsi berupa bilangan bulat liter).\nPERTANYAAN UTAMA:\nBerapakah total konsumsi air selama tiga hari?\nPERNYATAAN (1): Rata-rata konsumsi selama tiga hari adalah 12 liter.\nPERNYATAAN (2): Konsumsi hari Selasa kurang dari 16 liter.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":0,"why":"Yang ditanyakan: Berapakah total konsumsi air selama tiga hari?\nPernyataan (1): Total = rata-rata × 3 = 36 liter. Jawabannya pasti: 36 liter. → CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: Selasa = 5 liter → 29 liter; Selasa = 10 liter → 34 liter. Jawabannya berbeda-beda → TIDAK CUKUP.\nKesimpulan: Hanya pernyataan (1) yang cukup. Jawaban: A.","tables":[{"cap":"Konsumsi air keluarga","head":["Hari","Konsumsi"],"rows":[["Senin","12 liter"],["Selasa","x liter"],["Rabu","12 liter"]]}],"figs":[],"id":411},{"cat":"kecukupan-konteks","q":"Saldo awal sebuah rekening adalah Rp3.000.000,00. Setoran dan penarikan selama sebulan berupa kelipatan Rp50.000,00.\nPERTANYAAN UTAMA:\nApakah saldo rekening menjadi Rp3.700.000,00 setelah satu bulan?\nPERNYATAAN (1): Pemilik rekening menabung Rp1.000.000,00 selama bulan tersebut.\nPERNYATAAN (2): Selisih setoran dan penarikan adalah Rp700.000,00.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.", 33333333333333333333333333) → Tidak; nilai Bahasa Indonesia = 95 (rata-rata 82) → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Semua kemungkinan yang memenuhi pernyataan (2) menghasilkan jawaban yang sama: Tidak. Contoh: nilai Bahasa Indonesia = 24 (rata-rata 58,33333333333333333333333333); nilai Bahasa Indonesia = 48 (rata-rata 66,33333333333333333333333333), semuanya Tidak. → CUKUP.\nKesimpulan: Hanya pernyataan (2) yang cukup. Jawaban: B.","tables":[{"cap":"Nilai Raka","head":["Mata Pelajaran","Nilai"],"rows":[["Matematika","62"],["IPA","89"],["Bahasa Indonesia","x"]]}],"figs":[],"id":420},{"cat":"kecukupan-konteks","q":"Sebuah keluarga mengonsumsi air selama tiga hari (konsumsi berupa bilangan bulat liter).\nPERTANYAAN UTAMA:\nBerapakah total konsumsi air selama tiga hari?\nPERNYATAAN (1): Rata-rata konsumsi selama tiga hari adalah 10 liter.\nPERNYATAAN (2): Konsumsi hari Selasa adalah 10 liter.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":3,"why":"Yang ditanyakan: Berapakah total konsumsi air selama tiga hari?\nPernyataan (1): Total = rata-rata × 3 = 30 liter. Jawabannya pasti: 30 liter. → CUKUP.\nPernyataan (2): Semua kemungkinan yang memenuhi pernyataan (2) menghasilkan jawaban yang sama: 30 liter. → CUKUP.\nKesimpulan: Masing-masing pernyataan sudah cukup. Jawaban: D.","tables":[{"cap":"Konsumsi air keluarga","head":["Hari","Konsumsi"],"rows":[["Senin","12 liter"],["Selasa","x liter"],["Rabu","8 liter"]]}],"figs":[],"id":421},{"cat":"kecukupan-konteks","q":"Sebuah kotak hanya berisi kartu merah dan kartu biru (jumlah masing-masing bilangan bulat).\nPERTANYAAN UTAMA:\nBerapakah jumlah seluruh kartu?\nPERNYATAAN (1): Jumlah kartu merah adalah 19.\nPERNYATAAN (2): Semua kartu berukuran sama.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":4,"why":"Yang ditanyakan: Berapakah jumlah seluruh kartu?\nPernyataan (1): Masih banyak kemungkinan. Contoh: merah 19, biru 20 → 39; merah 19, biru 40 → 59. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: merah 20, biru 20 → 40; merah 40, biru 40 → 80. Jawabannya berbeda-beda → TIDAK CUKUP.\nDigabung pun masih ada lebih dari satu kemungkinan. Contoh: merah 19, biru 20 → 39; merah 19, biru 40 → 59 → TIDAK CUKUP.\nKesimpulan: Bahkan setelah digabung, datanya tetap tidak cukup. Jawaban: E.","tables":[],"figs":[],"id":422},{"cat":"kecukupan-konteks","q":"Umur ayah dan umur anak sekarang adalah bilangan bulat (tahun), dan ayah paling sedikit 18 tahun lebih tua.\nPERTANYAAN UTAMA:\nBerapakah umur anak sekarang?\nPERNYATAAN (1): Umur anak sekarang adalah 12 tahun.\nPERNYATAAN (2): Ayah sudah menikah selama 22 tahun.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":0,"why":"Yang ditanyakan: Berapakah umur anak sekarang?\nPernyataan (1): Semua kemungkinan yang memenuhi pernyataan (1) menghasilkan jawaban yang sama: 12 tahun. Contoh: ayah 45 tahun, anak 12 tahun; ayah 60 tahun, anak 12 tahun, semuanya 12 tahun. → CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: ayah 55 tahun, anak 16 tahun → 16 tahun; ayah 62 tahun, anak 31 tahun → 31 tahun. Jawabannya berbeda-beda → TIDAK CUKUP.\nKesimpulan: Hanya pernyataan (1) yang cukup. Jawaban: A.","tables":[],"figs":[],"id":423},{"cat":"kecukupan-konteks","q":"Sebuah keluarga mengonsumsi air selama tiga hari (konsumsi berupa bilangan bulat liter).\nPERTANYAAN UTAMA:\nBerapakah total konsumsi air selama tiga hari?\nPERNYATAAN (1): Total konsumsi selama tiga hari adalah 38 liter.\nPERNYATAAN (2): Konsumsi hari Selasa adalah 16 liter.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":3,"why":"Yang ditanyakan: Berapakah total konsumsi air selama tiga hari?\nPernyataan (1): Semua kemungkinan yang memenuhi pernyataan (1) menghasilkan jawaban yang sama: 38 liter. → CUKUP.\nPernyataan (2): Semua kemungkinan yang memenuhi pernyataan (2) menghasilkan jawaban yang sama: 38 liter. → CUKUP.\nKesimpulan: Masing-masing pernyataan sudah cukup. Jawaban: D.","tables":[{"cap":"Konsumsi air keluarga","head":["Hari","Konsumsi"],"rows":[["Senin","9 liter"],["Selasa","x liter"],["Rabu","13 liter"]]}],"figs":[],"id":424},{"cat":"kecukupan-konteks","q":"Doni membeli sebuah tas dan sebuah sepatu. Diskon masing-masing barang berupa persen bulat dari harga barang itu (0% sampai 50%).\nPERTANYAAN UTAMA:\nBerapakah total harga yang dibayar Doni setelah diskon?\nPERNYATAAN (1): Diskon untuk tas sebesar 50% dan diskon untuk sepatu sebesar 20%.\nPERNYATAAN (2): Tas mendapat diskon 50%.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":0,"why":"Yang ditanyakan: Berapakah total harga yang dibayar Doni setelah diskon?\nPernyataan (1): Semua kemungkinan yang memenuhi pernyataan (1) menghasilkan jawaban yang sama: Rp300.000,00. → CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: diskon tas 50%, diskon sepatu 25% → Rp285.000,00; diskon tas 50%, diskon sepatu 10% → Rp330.000,00. Jawabannya berbeda-beda → TIDAK CUKUP.\nKesimpulan: Hanya pernyataan (1) yang cukup. Jawaban: A.","tables":[{"cap":"Daftar harga","head":["Barang","Harga"],"rows":[["Tas","Rp120.000,00"],["Sepatu","Rp300.000,00"]]}],"figs":[],"id":425},{"cat":"kecukupan-sosial","q":"Sebuah jaket berharga Rp1.000.000,00 sebelum pajak. Besar pajak berupa kelipatan Rp1.000,00.\nPERTANYAAN UTAMA:\nApakah harga jaket setelah pajak tepat Rp1.120.000,00?\nPERNYATAAN (1): Barang tersebut dibeli di pusat perbelanjaan.\nPERNYATAAN (2): Harga setelah pajak adalah Rp1.120.000,00.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":1,"why":"Yang ditanyakan: Apakah harga jaket setelah pajak tepat Rp1.120.000,00?\nPernyataan (1): Masih banyak kemungkinan. Contoh: pajak Rp501.000,00 (50,1%) → harga akhir Rp1.501.000,00 → Tidak; pajak Rp120.000,00 (12%) → harga akhir Rp1.120.000,00 → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Semua kemungkinan yang memenuhi pernyataan (2) menghasilkan jawaban yang sama: Ya. → CUKUP.\nKesimpulan: Hanya pernyataan (2) yang cukup. Jawaban: B.","tables":[],"figs":[],"id":426},{"cat":"kecukupan-sosial","q":"Bu Sinta membeli sebuah jam tangan dengan harga Rp200.000,00. Harga jual berupa kelipatan Rp1.000,00.\nPERTANYAAN UTAMA:\nApakah barang tersebut dijual dengan keuntungan?\nPERNYATAAN (1): Barang dijual dengan harga Rp190.000,00 atau Rp250.000,00.\nPERNYATAAN (2): Barang dijual dengan harga Rp160.000,00 sampai dengan Rp210.000,00.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":2,"why":"Yang ditanyakan: Apakah barang tersebut dijual dengan keuntungan?\nPernyataan (1): Masih banyak kemungkinan. Contoh: harga jual Rp190.000,00 (rugi Rp10.000,00; -5%) → Tidak; harga jual Rp250.000,00 (untung Rp50.000,00; 25%) → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: harga jual Rp180.000,00 (rugi Rp20.000,00; -10%) → Tidak; harga jual Rp206.000,00 (untung Rp6.000,00; 3%) → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nDigabung: hanya tersisa satu kemungkinan (harga jual Rp190.000,00 (rugi Rp10.000,00; -5%)), jawabannya Tidak → CUKUP.\nKesimpulan: Satu pernyataan saja tidak cukup, tetapi keduanya bersama-sama cukup. Jawaban: C.","tables":[],"figs":[],"id":427},{"cat":"kecukupan-sosial","q":"Sebuah karung beras memiliki berat bruto 80 kg. Berat tara berupa kelipatan 0,5 , tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":0,"why":"Yang ditanyakan: Apakah harga sepatu setelah pajak lebih dari Rp2.260.000,00?\nPernyataan (1): Semua kemungkinan yang memenuhi pernyataan (1) menghasilkan jawaban yang sama: Tidak. → CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: pajak Rp130.000,00 (6,5%) → harga akhir Rp2.130.000,00 → Tidak; pajak Rp340.000,00 (17%) → harga akhir Rp2.340.000,00 → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nKesimpulan: Hanya pernyataan (1) yang cukup. Jawaban: A.","tables":[],"figs":[],"id":440},{"cat":"kecukupan-sosial","q":"Sebuah tas berharga Rp500.000,00 sebelum pajak. Besar pajak berupa kelipatan Rp1.000,00.\nPERTANYAAN UTAMA:\nApakah harga tas setelah pajak kurang dari Rp535.000,00?\nPERNYATAAN (1): Harga setelah pajak adalah Rp555.000,00.\nPERNYATAAN (2): Barang tersebut dibeli di pusat perbelanjaan.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":0,"why":"Yang ditanyakan: Apakah harga tas setelah pajak kurang dari Rp535.000,00?\nPernyataan (1): Semua kemungkinan yang memenuhi pernyataan (1) menghasilkan jawaban yang sama: Tidak. → CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: pajak Rp268.000,00 (53,6%) → harga akhir Rp768.000,00 → Tidak; pajak Rp17.000,00 (3,4%) → harga akhir Rp517.000,00 → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nKesimpulan: Hanya pernyataan (1) yang cukup. Jawaban: A.","tables":[],"figs":[],"id":441},{"cat":"kecukupan-sosial","q":"Sebuah karung beras erugian yang dialami lebih dari Rp180.000,00?\nPernyataan (1): Masih banyak kemungkinan. Contoh: harga jual Rp1.110.000,00 (untung Rp310.000,00; 38,8%) → Tidak; harga jual Rp310.000,00 (rugi Rp490.000,00; -61,2%) → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Semua kemungkinan yang memenuhi pernyataan (2) menghasilkan jawaban yang sama: Tidak. → CUKUP.\nKesimpulan: Hanya pernyataan (2) yang cukup. Jawaban: B.","tables":[],"figs":[],"id":443},{"cat":"kecukupan-sosial","q":"Seseorang menabung di bank dengan bunga tunggal selama 1 tahun. Modal (kelipatan Rp500.000,00) dan suku bunga (persen bulat per tahun) belum diketahui.\nPERTANYAAN UTAMA:\nApakah bunga yang diperoleh selama 1 tahun lebih dari Rp250.000,00?\nPERNYATAAN (1): Modal awal adalah Rp3.000.000,00.\nPERNYATAAN (2): Suku bunga kurang dari 7% per tahun.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":2,"why":"Yang ditanyakan: Apakah bunga yang diperoleh selama 1 tahun lebih dari Rp250.000,00?\nPernyataan (1): Masih banyak kemungkinan. Contoh: modal Rp3.000.000,00, bunga 5% → bunga 1 tahun Rp150.000,00 → Tidak; modal Rp3.000.000,00, bunga 15% → bunga 1 tahun Rp450.000,00 → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: modal Rp4.000.000,00, bunga 2% → bunga 1 tahun Rp80.000,00 → Tidak; modal Rp8.000.000,00, bunga 6% → bunga 1 tahun Rp480.000,00 → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nDigabung: hanya tersisa satu kemungkinan (modal Rp3.000.000,00, bunga 1% → bunga 1 tahun Rp30.000,00), jawabannya Tidak → CUKUP.\nKesimpulan: Satu pernyataan saja tidak cukup, tetapi keduanya bersama-sama cukup. Jawaban: C.","tables":[],"figs":[],"id":444},{"cat":"kecukupan-sosial","q":"Sebuah karung beras memiliki berat bruto 120 kg. Berat tara berupa kelipatan 0,5 kg.\nPERTANYAAN UTAMA:\nBerapakah berat bersih beras tersebut?\nPERNYATAAN (1): Berat tara (karung kosong) adalah 1,5 kg.\nPERNYATAAN (2): Karung tersebut diangkut dengan truk.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":0,"why":"Yang ditanyakan: Berapakah berat bersih beras tersebut?\nPernyataan (1): Neto = bruto − tara = 120 − 1,5 = 118,5 kg. Jawabannya pasti: 118,5 kg. → CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: tara 20 kg → neto 100 kg → 100 kg; tara 10 kg → neto 110 kg → 110 kg. Jawabannya berbeda-beda → TIDAK CUKUP.\nKesimpulan: Hanya pernyataan (1) yang cukup. Jawaban: A.","tables":[],"figs":[],"id":445},{"cat":"kecukupan-sosial","q":"Seorang pedagang membeli sebuah televisi dengan harga Rp300.000,00. Harga jual berupa kelipatan Rp1.000,00.\nPERTANYAAN UTAMA:\nBerapakah harga jual barang tersebut?\nPERNYATAAN (1): Keuntungan yang diperoleh sebesar Rp30.000,00.\nPERNYATAAN (2): Keuntungan yang diperoleh sebesar 10% dari harga beli.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":3,"why":"Yang ditanyakan: Berapakah harga jual barang tersebut?\nPernyataan (1): Semua kemungkinan yang memenuhi pernyataan (1) menghasilkan jawaban yang sama: Rp330.000,00. → CUKUP.\nPernyataan (2): Untung 10% × Rp300.000,00 = Rp30.000,00. Jawabannya pasti: Rp330.000,00. → CUKUP.\nKesimpulan: Masing-masing pernyataan sudah cukup. Jawaban: D.","tables":[],"figs":[],"id":446},{"cat":"kecukupan-sosial","q":"Sebuah karung beras memiliki berat bruto 50 kg. Berat tara berupa kelipatan 0,5 kg.\nPERTANYAAN UTAMA:\nBerapakah berat bersih beras tersebut?\nPERNYATAAN (1): Berat tara (karung kosong) adalah 3 kg.\nPERNYATAAN (2): Berat kemasan adalah 6% dari berat bruto.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":3,"why":"Yang ditanyakan: Berapakah berat bersih beras tersebut?\nPernyataan (1): Neto = bruto − tara = 50 − 3 = 47 kg. Jawabannya pasti: 47 kg. → CUKUP.\nPernyataan (2): Tara = 6% × 50 = 3 kg, neto = 47 kg. Jawabannya pasti: 47 kg. → CUKUP.\nKesimpulan: Masing-masing pernyataan sudah cukup. Jawaban: D.","tables":[],"figs":[],"id":447},{"cat":"kecukupan-sosial","q":"Sebuah toko membeli sebuah jaket dengan harga Rp1.000.000,00. Harga jual berupa kelipatan Rp1.000,00.\nPERTANYAAN UTAMA:\nApakah keuntungan yang diperoleh lebih dari Rp70.000,00?\nPERNYATAAN (1): Barang dijual dengan harga Rp1.060.000,00 sampai dengan Rp1.100.000,00.\nPERNYATAAN (2): Keuntungan yang diperoleh sebesar 8% dari harga beli.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":1,"why":"Yang ditanyakan: Apakah keuntungan yang diperoleh lebih dari Rp70.000,00?\nPernyataan (1): Masih banyak kemungkinan. Contoh: harga jual Rp1.065.000,00 (untung Rp65.000,00; 6,5%) → Tidak; harga jual Rp1.086.000,00 (untung Rp86.000,00; 8,6%) → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Untung 8% × Rp1.000.000,00 = Rp80.000,00. Jawabannya pasti: Ya. → CUKUP.\nKesimpulan: Hanya pernyataan (2) yang cukup. Jawaban: B.","tables":[],"figs":[],"id":448},{"cat":"kecukupan-sosial","q":"Sebuah karung beras memiliki berat bruto 120 kg. Berat tara berupa kelipatan 0,5 kg.\nPERTANYAAN UTAMA:\nApakah berat bersih beras lebih dari 116,5 kg?\nPERNYATAAN (1): Berat kemasan lebih dari 0,5 kg.\nPERNYATAAN (2): Berat bersih isi lebih dari 113,5 kg.","opts":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Dua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.","Salah satu pernyataan SAJA cukup untuk menjawab pertanyaan.","Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan."],"a":4,"why":"Yang ditanyakan: Apakah berat bersih beras lebih dari 116,5 kg?\nPernyataan (1): Masih banyak kemungkinan. Contoh: tara 17 kg → neto 103 kg → Tidak; tara 2 kg → neto 118 kg → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nPernyataan (2): Masih banyak kemungkinan. Contoh: tara 5 kg → neto 115 kg → Tidak; tara 1,5 kg → neto 118,5 kg → Ya. Jawabannya berbeda-beda → TIDAK CUKUP.\nDigabung pun masih ada lebih dari satu kemungkinan. Contoh: tara 5 kg → neto 115 kg → Tidak; tara 2 kg → neto 118 kg → Ya → TIDAK C
