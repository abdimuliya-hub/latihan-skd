<style>
/* Layout: one phone-width column. Options are penciled bubbles like an LJK answer sheet; everything else stays quiet. */
:root {
  --bg: #f0f3ef;
  --surface: #ffffff;
  --ink: #15231e;
  --muted: #586a63;
  --line: #d3dbd6;
  --accent: #1b6b50;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe3;
  --graphite: #2a3236;
  --ok: #1d7a4b;
  --ok-bg: #d9efe2;
  --bad: #b3352c;
  --bad-bg: #f6dedb;
  --warn-bg: #fbf0c9;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1714; --surface: #172420; --ink: #e5eee9; --muted: #92a69d; --line: #2a3a34;
    --accent: #66d1a2; --accent-ink: #062418; --accent-soft: #1d3a2f; --graphite: #d3dcd7;
    --ok: #66d1a2; --ok-bg: #173a2b; --bad: #ff8e83; --bad-bg: #3b1f1c; --warn-bg: #3d3716;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1714; --surface: #172420; --ink: #e5eee9; --muted: #92a69d; --line: #2a3a34;
  --accent: #66d1a2; --accent-ink: #062418; --accent-soft: #1d3a2f; --graphite: #d3dcd7;
  --ok: #66d1a2; --ok-bg: #173a2b; --bad: #ff8e83; --bad-bg: #3b1f1c; --warn-bg: #3d3716;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 120px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.12; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* home */
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hero { display: grid; gap: 10px; padding-block: 8px 20px; }
.hero h1 { font-size: clamp(32px, 9vw, 44px); font-weight: 800; letter-spacing: -.02em; }
.hero p { margin: 0; color: var(--muted); max-width: 46ch; }
.cta { display: grid; gap: 10px; margin-bottom: 28px; }
.btn { border: 0; border-radius: 14px; min-height: 56px; padding: 12px 18px; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 600; }
.btn small { display: block; font-weight: 400; opacity: .85; font-size: 13px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface); border: 1.5px solid var(--line); }
.btn.solid { background: var(--graphite); color: var(--bg); justify-content: center; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.simbox { display: grid; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; }
.simbox .row { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { flex: 1; min-width: 120px; min-height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); padding: 6px 10px; text-align: center; font-size: 14px; }
.seg.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.seg small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
h2.sec { font-size: 20px; margin-bottom: 10px; }
.topics { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.topic { width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; text-align: left; align-items: center; }
.topic b { font-weight: 600; }
.topic span.d { grid-column: 1; color: var(--muted); font-size: 13.5px; }
.topic .best { grid-column: 2; grid-row: 1 / span 2; font-family: var(--mono); font-size: 13px; color: var(--muted); text-align: right; }
.topic .best.has { color: var(--ok); font-weight: 600; }
.note { margin-top: 24px; font-size: 13.5px; color: var(--muted); display: grid; gap: 6px; }
.note p { margin: 0; }

/* quiz */
.qbar { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; }
.qbar .exit { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; min-height: 40px; padding: 6px 12px; }
.qbar .ttl { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.timer { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 18px; padding: 4px 10px; border-radius: 10px; background: var(--accent-soft); }
.timer.low { background: var(--bad-bg); color: var(--bad); }
.dots { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 12px; scrollbar-width: none; }
.dots::-webkit-scrollbar { display: none; }
.dots button { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--muted); background: transparent; font-family: var(--mono); font-size: 12px; padding: 0; display: grid; place-items: center; }
.dots button.a { background: var(--graphite); color: var(--bg); border-color: var(--graphite); }
.dots button.r { background: var(--ok); color: var(--bg); border-color: var(--ok); }
.dots button.w { background: var(--bad); color: var(--bg); border-color: var(--bad); }
.dots button.cur { outline: 3px solid var(--accent); outline-offset: 2px; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 18px 16px; display: grid; gap: 16px; }
.qmeta { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.qtext { margin: 0; font-size: 17px; line-height: 1.6; }
.tbls { display: flex; flex-wrap: wrap; gap: 14px; }
.tb { margin: 0; min-width: 0; max-width: 100%; }
.tb figcaption { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.tbw { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 16px; }
th, td { border: 1.5px solid var(--graphite); padding: 6px 12px; text-align: center; min-width: 40px; }
th { background: var(--accent-soft); font-weight: 500; font-size: 13px; }
td.unk { background: var(--warn-bg); font-weight: 600; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.15; font-size: .88em; margin: 0 .12em; }
.fr i { font-style: normal; padding: 0 .22em; }
.fr i:first-child { border-bottom: 1.5px solid currentColor; }
.mf { display: inline-flex; align-items: center; gap: .08em; }
.figs { display: flex; flex-wrap: wrap; gap: 10px; }
.figs.m6 { display: grid; grid-template-columns: repeat(3, 84px); }
.frame { width: 84px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); padding: 4px; text-align: center; }
.frame .cap { font-family: var(--mono); font-size: 11px; color: var(--muted); }
svg.fig { width: 100%; height: auto; display: block; }
svg.fig .c { fill: var(--graphite); stroke: var(--surface); stroke-width: 1; }
svg.fig .m { fill: var(--accent); stroke: var(--surface); stroke-width: 1; }
svg.fig .qm { font-family: var(--display); font-weight: 800; font-size: 34px; fill: var(--muted); }
.opts { display: grid; gap: 10px; }
.opts.svgopts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 12px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 14px; text-align: left; }
.opt .bub { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--graphite); display: grid; place-items: center; font-family: var(--mono); font-size: 15px; }
.opt .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .osv { flex: 1; min-width: 0; max-width: 84px; }
.opt .tag { flex: none; font-size: 12px; font-weight: 600; font-family: var(--mono); }
.opts.svgopts .opt .tag { display: none; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .bub { background: var(--graphite); color: var(--bg); }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); }
.opt.ok .bub { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt.bad .bub { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.opt[disabled] { cursor: default; }
.fb { border-radius: 14px; padding: 14px; display: grid; gap: 6px; margin-top: 14px; }
.fb.ok { background: var(--ok-bg); }
.fb.bad { background: var(--bad-bg); }
.fb strong { font-family: var(--display); font-size: 18px; }
.fb p { margin: 0; }
.fb .lbl { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1.5px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 5; }
.bar .in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; }
.bar .btn { flex: 1; justify-content: center; text-align: center; }
.live { display: grid; gap: 2px; font-size: 13px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line, #d5ddd8); margin: 10px 0; color: var(--muted); }
.live b { color: var(--ink); font-size: 13px; }
.live-on b::before { content: "● "; color: #1f9d55; }
.live-err b::before, .live-ro b::before { content: "● "; color: #c77a00; }
.confirm { background: var(--warn-bg); border-radius: 14px; padding: 14px; display: grid; gap: 10px; margin-top: 14px; }
.confirm p { margin: 0; }
.confirm .row { display: flex; gap: 10px; flex-wrap: wrap; }
.confirm .btn { min-height: 48px; flex: 1; justify-content: center; }

/* result */
.score { display: grid; gap: 6px; padding-block: 6px 18px; }
.score .big { font-family: var(--display); font-weight: 800; font-size: clamp(54px, 18vw, 84px); line-height: 1; letter-spacing: -.03em; }
.score .big span { font-size: .38em; color: var(--muted); font-weight: 600; letter-spacing: 0; }
.chip { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; width: fit-content; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.brk { display: grid; gap: 6px; margin: 0 0 24px; padding: 0; list-style: none; }
.brk li { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; }
.brk .meter { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; max-width: 120px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--muted); display: inline-block; }
.dot.on { background: var(--graphite); border-color: var(--graphite); }
.rev { display: grid; gap: 8px; margin-bottom: 20px; }
details.r { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; }
details.r > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start; }
details.r > summary::-webkit-details-marker { display: none; }
details.r .st { font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-top: 2px; }
details.r .st.ok { background: var(--ok-bg); color: var(--ok); }
details.r .st.bad { background: var(--bad-bg); color: var(--bad); }
details.r .st.skip { background: var(--accent-soft); color: var(--muted); }
details.r .sn { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 15px; }
details.r .bd { padding: 0 14px 14px; display: grid; gap: 10px; }
details.r .bd p { margin: 0; }
details.r .full { font-size: 15.5px; line-height: 1.6; }
.ansline { font-size: 14.5px; }
.ansline .mini { width: 64px; display: inline-block; vertical-align: middle; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); padding: 2px; }
/* stats */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 24px; }
.tile { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 2px; }
.tile .v { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.1; }
.tile .l { font-size: 13px; color: var(--muted); }
.srow { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.srow .h { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.srow .h b { font-weight: 600; }
.srow .pc { font-family: var(--mono); font-weight: 600; }
.srow .pc.lo { color: var(--bad); }
.srow .pc.hi { color: var(--ok); }
.srow .sub { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; color: var(--muted); }
.meterbar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; display: flex; }
.meterbar i { display: block; height: 100%; }
.meterbar .g { background: var(--ok); }
.meterbar .r { background: var(--bad); }
.slist { display: grid; gap: 6px; margin: 0 0 24px; padding: 0; list-style: none; }
.slist li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; font-size: 14.5px; }
.btn.danger { background: var(--bad-bg); color: var(--bad); justify-content: center; }
@media (prefers-reduced-motion: no-preference) {
  .opt, .btn, .topic, .seg { transition: background-color .12s, border-color .12s; }
}

},{"cat":"optimasi","q":"Seorang pelanggan memesan layanan dengan total harga awal Rp1.200.000. Diberikan voucher Rp30.000 yang hanya berlaku untuk Paket Alam dan Paket Bahari. Jika diskon dihitung dari harga awal, kemudian dikurangi voucher yang berlaku dan ditambah biaya layanan, mana yang menghasilkan total pembayaran paling murah?","opts":["Paket Alam","Paket Bahari","Paket Keluarga","Paket Eksklusif","Paket Bahari dan Paket Keluarga menghasilkan biaya yang sama"],"a":2,"why":"Total = harga awal − diskon − voucher (jika berlaku) + biaya layanan. Paket Alam: Rp1.200.000 − Rp120.000 − Rp30.000 + Rp35.000 = Rp1.085.000; Paket Bahari: Rp1.200.000 − Rp96.000 − Rp30.000 + Rp15.000 = Rp1.089.000; Paket Keluarga: Rp1.200.000 − Rp216.000 + Rp0 = Rp984.000; Paket Eksklusif: Rp1.200.000 − Rp180.000 + Rp35.000 = Rp1.055.000. Terendah: Paket Keluarga.","tables":[{"cap":null,"head":["Jenis","Diskon","Biaya Layanan"],"rows":[["Paket Alam","10%","Rp35.000"],["Paket Bahari","8%","Rp15.000"],["Paket Keluarga","18%","Gratis"],["Paket Eksklusif","15%","Rp35.000"]]}],"figs":[],"id":247},{"cat":"optimasi","q":"Seorang pelanggan memesan layanan dengan total harga awal Rp1.500.000. Diberikan voucher Rp30.000 yang hanya berlaku untuk Paket Alam dan Paket Keluarga. Jika diskon dihitung dari harga awal, kemudian dikurangi voucher yang berlaku dan ditambah biaya layanan, mana yang menghasilkan total pembayaran paling murah?","opts":["Paket Alam","Paket Bahari","Paket Keluarga","Paket Eksklusif","Paket Alam dan Paket Bahari menghasilkan biaya yang sama"],"a":3,"why":"Total = harga awal − diskon − voucher (jika berlaku) + biaya layanan. Paket Alam: Rp1.500.000 − Rp180.000 − Rp30.000 + Rp0 = Rp1.290.000; Paket Bahari: Rp1.500.000 − Rp225.000 + Rp10.000 = Rp1.285.000; Paket Keluarga: Rp1.500.000 − Rp150.000 − Rp30.000 + Rp10.000 = Rp1.330.000; Paket Eksklusif: Rp1.500.000 − Rp270.000 + Rp35.000 = Rp1.265.000. Terendah: Paket Eksklusif.","tables":[{"cap":null,"head":["Jenis","Diskon","Biaya Layanan"],"rows":[["Paket Alam","12%","Gratis"],["Paket Bahari","15%","Rp10.000"],["Paket Keluarga","10%","Rp10.000"],["Paket Eksklusif","18%","Rp35.000"]]}],"figs":[],"id":248},{"cat":"optimasi","q":"Seorang pelanggan memesan layanan dengan total harga awal Rp1.500.000. Diberikan voucher Rp75.000 yang hanya berlaku untuk Paket B dan Paket C. Jika diskon dihitung dari harga awal, kemudian dikurangi voucher yang berlaku dan ditambah biaya layanan, mana yang menghasilkan total pembayaran paling murah?","opts":["Paket A","Paket B","Paket C","Paket D","Paket D dan Paket C menghasilkan biaya yang sama"],"a":2,"why":"Total = harga awal − diskon − voucher (jika berlaku) + biaya layanan. Paket A: Rp1.500.000 − Rp270.000 + Rp10.000 = Rp1.240.000; Paket B: Rp1.500.000 − Rp225.000 − Rp75.000 + Rp0 = Rp1.200.000; Paket C: Rp1.500.000 − Rp330.000 − Rp75.000 + Rp90.000 = Rp1.185.000; Paket D: Rp1.500.000 − Rp75.000 + Rp35.000 = Rp1.460.000. Terendah: Paket C.","tables":[{"cap":null,"head":["Jenis","Diskon","Biaya Layanan"],"rows":[["Paket A","18%","Rp10.000"],["Paket B","15%","Gratis"],["Paket C","22%","Rp90.000"],["Paket D","5%","Rp35.000"]]}],"figs":[],"id":249},{"cat":"optimasi","q":"Seorang pelanggan memesan layanan dengan total harga awal Rp800.000. Diberikan voucher Rp75.000 yang hanya berlaku untuk Paket Bahari dan Paket Eksklusif. Jika diskon dihitung dari harga awal, kemudian dikurangi voucher yang berlaku dan ditambah biaya layanan, mana yang menghasilkan total pembayaran paling murah?","opts":["Paket Alam","Paket Bahari","Paket Keluarga","Paket Eksklusif","Paket Eksklusif dan Paket Alam menghasilkan biaya yang sama"],"a":0,"why":"Total = harga awal − diskon − voucher (jika berlaku) + biaya layanan. Paket Alam: Rp800.000 − Rp144.000 + Rp0 = Rp656.000; Paket Bahari: Rp800.000 − Rp96.000 − Rp75.000 + Rp35.000 = Rp664.000; Paket Keluarga: Rp800.000 − Rp40.000 + Rp35.000 = Rp795.000; Paket Eksklusif: Rp800.000 − Rp64.000 − Rp75.000 + Rp40.000 = Rp701.000. Terendah: Paket Alam. "Yuni","Hani"],"a":4,"why":"Gabungkan semua pernyataan menjadi satu urutan: Wawan > Yuni > Budi > Hani (dari paling pandai ke paling kurang pandai). Maka jawabannya Hani.","tables":[],"figs":[],"id":254},{"cat":"analitis","q":"Lima orang (Budi, Galih, Nina, Putra, Sari) duduk berjajar pada kursi nomor 1 sampai 5 dari kiri ke kanan. Nina duduk tepat di antara Sari dan Putra. Galih duduk di kursi nomor 5. Sari duduk di salah satu ujung baris. Siapa yang duduk di kursi nomor 2?","opts":["Budi","Nina","Putra","Sari","Galih"],"a":1,"why":"Uji semua susunan terhadap aturan. Susunan yang memenuhi (kiri ke kanan): Sari – Nina – Putra – Budi – Galih. Kursi nomor 2 ditempati Nina.","tables":[],"figs":[],"id":255},{"cat":"analitis","q":"Lima orang (Jaka, Lina, Rani, Umar, Zaki) duduk berjajar pada kursi nomor 1 sampai 5 dari kiri ke kanan. Lina duduk tepat di sebelah kiri Jaka. Rani tidak duduk bersebelahan dengan Zaki. Jaka duduk di salah satu ujung baris. Lina tidak duduk bersebelahan dengan Zaki. Siapa yang duduk di kursi nomor 3?","opts":["Lina","Umar","Jaka","Rani","Zaki"],"a":3,"why":"Uji semua susunan terhadap aturan. Susunan yang memenuhi (kiri ke kanan): Zaki – Umar – Rani – Lina – Jaka. Kursi nomor 3 ditempati Rani.","tables":[],"figs":[],"id":256},{"cat":"analitis","q":"Lima orang (Andi, Dedi, Hani, Umar, Yuni) duduk berjajar pada kursi nomor 1 sampai 5 dari kiri ke kanan. Umar duduk tepat di sebelah kiri Dedi. Yuni duduk tepat di sebelah kiri Umar. Yuni duduk di salah satu ujung baris. Siapa yang duduk di kursi nomor 3?","opts":["Hani","Umar","Dedi","Yuni","Andi"],"a":2,"why":"Uji semua susunan terhadap aturan. Susunan yang memenuhi, misalnya: Yuni – Umar – Dedi – Andi – Hani; seluruh susunan yang memenuhi menempatkan orang yang sama di kursi 3. Kursi nomor 3 ditempati Dedi.","tables":[],"figs":[],"id":257},{"cat":"analitis","q":"Lima orang (Galih, Maya, Nina, Wawan, Yuni) duduk berjajar pada kursi nomor 1 sampai 5 dari kiri ke kanan. Nina duduk di kursi nomor 4. Nina duduk tepat di antara Galih dan Wawan. Yuni duduk tepat di sebelah kiri Galih. Siapa yang duduk di kursi nomor 2?","opts":["Maya","Yuni","Wawan","Nina","Galih"],"a":1,"why":"Uji semua susunan terhadap aturan. Susunan yang memenuhi (kiri ke kanan): Maya – Yuni – Galih – Nina – Wawan. Kursi nomor 2 ditempati Yuni.","tables":[],"figs":[],"id":258},{"cat":"analitis","q":"Maya akan melakukan perjalanan ke kota Surabaya dengan syarat: ia wajib mampir ke kota Banyuwangi sebelum menuju Surabaya; dari tempat asalnya, Maya bisa pergi ke Banyuwangi atau Semarang; dari Semarang ia hanya bisa menuju Banyuwangi; dari Malang ia hanya bisa menuju Banyuwangi; dari Cirebon ia hanya bisa menuju Banyuwangi; dari Banyuwangi ia bisa menuju Surabaya atau Denpasar; dari Denpasar ia bisa menuju Surabaya atau Tegal; dari Tegal ia hanya bisa menuju Surabaya. Ada berapa rute berbeda yang dapat ditempuh Maya untuk sampai ke Surabaya?","opts":["4 rute","5 rute","6 rute","7 rute","8 rute"],"a":2,"why":"Hitung rute dari asal ke Banyuwangi: 2 rute. Hitung rute dari Banyuwangi ke Surabaya: 3 rute. Karena semua rute wajib lewat Banyuwangi, total = 2 × 3 = 6 rute.","tables":[],"figs":[],"id":259},{"cat":"analitis","q":"Rina akan melakukan perjalanan ke kota Malang dengan syarat: ia wajib mampir ke kota Kediri sebelum menuju Malang; dari tempat asalnya, Rina bisa pergi ke Kediri atau Yogyakarta; dari Yogyakarta ia hanya bisa menuju Kediri; dari Solo ia hanya bisa menuju Kediri; dari Kediri ia bisa menuju Malang atau Tegal; dari Tegal ia bisa menuju Malang atau Bandung; dari Bandung ia hanya bisa menuju Malang. Ada berapa rute berbeda yang dapat ditempuh Rina untuk sampai ke Malang?","opts":["4 rute","5 rute","6 rute","7 rute","8 rute"],"a":2,"why":"Hitung rute dari asal ke Kediri: 2 rute. Hitung rute dari Kediri ke Malang: 3 rute. Karena semua rute wajib lewat Kediri, total = 2 × 3 = 6 rute.","tables":[],"figs":[],"id":260},{"cat":"analitis","q":"Maya akan melakukan perjalanan ke kota Padang dengan syarat: ia wajib mampir ke kota Palembang sebelum menuju Padang; dari tempat asalnya, Maya bisa pergi ke Palembang, Lampung atau Bukittinggi; dari Lampung ia bisa menuju Palembang atau Bukittinggi; dari Bukittinggi ia hanya bisa menuju Palembang; dari Palembang ia bisa menuju Padang atau Medan; dari Medan ia hanya bisa menuju Banda Aceh; dari Banda Aceh ia hanya bisa menuju Padang. Ada berapa rute berbeda yang dapat ditempuh Maya untuk sampai ke Padang?","opts":["6 rute","7 rute","8 rute","9 rute","10 rute"],"a":2,"why":"Hitung rute dari asal ke Palembang: 4 rute. Hitung rute dari Palembang ke Padang: 2 rute. Karena semua rute wajib lewat Palembang, total = 4 × 2 = 8 rute.","tables":[],"figs":[],"id":261},{"cat":"analitis","q":"Lima siswa (Citra, Hadi, Nina, Umar, Vina) mengikuti kegiatan di sekolah. Umar, Nina, dan Citra memakai panjang, sedangkan yang lain memakai pendek. Umar dan Hadi memakai topi, sedangkan yang lain tidak memakai topi. Umar, Nina, dan Vina membawa botol minum, sedangkan yang lain tidak membawa botol minum. Nina dan Hadi mengenakan sepatu olahraga, sedangkan yang lain mengenakan sandal. Siapakah siswa yang celana panjang, tidak memakai topi, membawa botol minum, dan mengenakan sepatu olahraga?","opts":["Nina","Vina","Citra","Umar","Hadi"],"a":0,"why":"Buat daftar ciri tiap siswa: Umar: panjang, memakai topi, membawa botol minum, mengenakan sandal; Nina: panjang, tidak memakai topi, membawa botol minum, mengenakan sepatu olahraga; Citra: panjang, tidak memakai topi, tidak membawa botol minum, mengenakan sandal; Vina: pendek, tidak memakai topi, membawa botol minum, mengenakan sandal; Hadi: pendek, memakai topi, tidak membawa botol minum, mengenakan sepatu olahraga. Hanya Nina yang cocok dengan semua ciri.","tables":[],"figs":[],"id":262},{"cat":"analitis","q":"Lima siswa (Citra, Dedi, Fani, Lina, Maya) mengikuti kegiatan di sekolah. Maya dan Fani memakai kacamata, sedangkan yang lain tidak memakai kacamata. Dedi dan Lina memakai topi, sedangkan =\"c\" x=\"19.0\" y=\"32.0\" width=\"13\" height=\"13\"/><rect class=\"c\" x=\"19.0\" y=\"19.0\" width=\"13\" height=\"13\"/><rect class=\"m\" x=\"19.0\" y=\"6.0\" width=\"13\" height=\"13\"/><\/svg>","cap":"3"},{"svg":"<svg class=\"fig\" viewBox=\"0 0 64 64\" role=\"img\" aria-hidden=\"true\"><text x=\"32\" y=\"44\" text-anchor=\"middle\" class=\"qm\">?<\/text><\/svg>","cap":"?"}],"id":325},{"cat":"silogisme","q":"Kalau aula sekolah sudah dibersihkan, maka kegiatan dapat dimulai tepat waktu. Bila kegiatan dapat dimulai tepat waktu, maka seluruh peserta dapat mengikuti kegiatan sesuai jadwal. Jika seluruh peserta dapat mengikuti kegiatan sesuai jadwal, maka acara selesai sebelum waktu makan siang. Aula sekolah sudah dibersihkan atau listrik sekolah padam. Ternyata listrik sekolah tidak padam.\nKesimpulan yang tepat adalah ...","opts":["Acara tidak selesai sebelum waktu makan siang","Acara selesai sebelum waktu makan siang","Listrik sekolah padam","Kegiatan tidak dapat dimulai tepat waktu","Seluruh peserta tidak dapat mengikuti kegiatan sesuai jadwal"],"a":1,"why":"Misalkan:\nP = aula sekolah sudah dibersihkan\nQ = kegiatan dapat dimulai tepat waktu\nR = seluruh peserta dapat mengikuti kegiatan sesuai jadwal\nS = acara selesai sebelum waktu makan siang\nT = listrik sekolah padam\nDiketahui:\nP → Q;  Q → R;  R → S;  P ∨ T;  ¬T\nLangkah 1 (Eliminasi/Disjungsi): P ∨ T dan ¬T ⇒ P, yaitu: aula sekolah sudah dibersihkan.\nLangkah 2 (Modus Ponens): P → Q dan P ⇒ Q, yaitu: kegiatan dapat dimulai tepat waktu.\nLangkah 3 (Modus Ponens): Q → R dan Q ⇒ R, yaitu: seluruh peserta dapat mengikuti kegiatan sesuai jadwal.\nLangkah 4 (Modus Ponens): R → S dan R ⇒ S, yaitu: acara selesai sebelum waktu makan siang.\nJadi kesimpulan yang tepat: acara selesai sebelum waktu makan siang. Jawaban: B.\nA: salah, bertentangan dengan hasil penalaran di atas.\nC: salah, bertentangan dengan hasil penalaran di atas.\nD: salah, bertentangan dengan hasil penalaran di atas.\nE: salah, bertentangan dengan hasil penalaran di atas.","tables":[],"figs":[],"id":326},{"cat":"silogisme","q":"Kalau Intan mengikuti lomba Matematika, maka Intan mengikuti seleksi Matematika. Bila Intan mengikuti seleksi Matematika, maka Intan lulus seleksi Matematika. Intan mengikuti lomba Matematika atau Intan mengikuti lomba Fisika. Faktanya, Intan tidak lulus seleksi Matematika.\nKesimpulan yang tepat adalah ...","opts":["Intan mengikuti lomba Fisika","Intan tidak mengikuti lomba Fisika","Intan mengikuti lomba Matematika","Intan mengikuti seleksi Matematika","Intan lulus seleksi Matematika"],"a":0,"why":"Misalkan:\nP = Intan mengikuti lomba Matematika\nQ = Intan mengikuti seleksi Matematika\nR = Intan lulus seleksi Matematika\nS = Intan mengikuti lomba Fisika\nDiketahui:\nP → Q;  Q → R;  P ∨ S;  ¬R\nLangkah 1 (Modus Tollens): Q → R dan ¬R ⇒ ¬Q, yaitu: Intan tidak mengikuti seleksi Matematika.\nLangkah 2 (Modus Tollens): P → Q dan ¬Q ⇒ ¬P, yaitu: Intan tidak mengikuti lomba Matematika.\nLangkah 3 (Eliminasi/Disjungsi): P ∨ S dan ¬P ⇒ S, yaitu: Intan mengikuti lomba Fisika.\nJadi kesimpulan yang tepat: Intan mengikuti lomba Fisika. Jawaban: A.\nB: salah, bertentangan dengan hasil penalaran di atas.\nC: salah, bertentangan dengan hasil penalaran di atas.\nD: salah, bertentangan dengan hasil penalaran di atas.\nE: salah, bertentangan dengan hasil penalaran di atas.","tables":[],"figs":[],"id":327},{"cat":"silogisme","q":"Bila persediaan alat tulis mencukupi, maka kebutuhan siswa terpenuhi. Jika kebutuhan siswa terpenuhi, maka siswa tidak perlu membeli alat tulis di luar sekolah. Diketahui bahwa siswa perlu membeli alat tulis di luar sekolah. Koperasi buka setiap hari kerja.\nKesimpulan yang tepat adalah ...","opts":["Persediaan alat tulis mencukupi","Kebutuhan siswa terpenuhi","Kendaraan pengiriman mengalami kerusakan","Persediaan alat tulis tidak mencukupi","Siswa tidak perlu membeli alat tulis di luar sekolah"],"a":3,"why":"Misalkan:\nP = persediaan alat tulis mencukupi\nQ = kebutuhan siswa terpenuhi\nR = siswa tidak perlu membeli alat tulis di luar sekolah\nS = Koperasi buka setiap hari kerja\nDiketahui:\nP → Q;  Q → R;  ¬R;  S\nLangkah 1 (Modus Tollens): Q → R dan ¬R ⇒ ¬Q, yaitu: kebutuhan siswa tidak terpenuhi.\nLangkah 2 (Modus Tollens): P → Q dan ¬Q ⇒ ¬P, yaitu: persediaan alat tulis tidak mencukupi.\nInformasi \"Koperasi buka setiap hari kerja\" tidak diperlukan untuk menarik kesimpulan.\nJadi kesimpulan yang tepat: persediaan alat tulis tidak mencukupi. Jawaban: D.\nA: salah, bertentangan dengan hasil penalaran di atas.\nB: salah, bertentangan dengan hasil penalaran di atas.\nC: belum tentu benar, tidak dapat dipastikan dari premis yang ada.\nE: salah, bertentangan dengan hasil penalaran di atas.","tables":[],"figs":[],"id":328},{"cat":"silogisme","q":"Jika aula sekolah sudah dibersihkan, maka kegiatan dapat dimulai tepat waktu. Kalau kegiatan dapat dimulai tepat waktu, maka seluruh peserta dapat mengikuti kegiatan sesuai jadwal. Aula sekolah sudah dibersihkan atau listrik sekolah padam. Setelah diperiksa, kegiatan tidak dapat dimulai tepat waktu.\nKesimpulan yang tepat adalah ...","opts":["Listrik sekolah padam","Listrik sekolah tidak padam","Kegiatan dapat dimulai tepat waktu","Seluruh peserta dapat mengikuti kegiatan sesuai jadwal","Seluruh peserta tidak dapat mengikuti kegiatan sesuai jadwal"],"a":0,"why":"Misalkan:\nP = aula sekolah sudah dibersihkan\nQ = kegiatan dapat dimulai tepat waktu\nR = seluruh peserta dapat mengikuti kegiatan sesuai jadwal\nS = listrik sekolah padam\nDiketahui:\nP → Q;  Q → R;  P ∨ S;  ¬Q\nLangkah 1 (Modus Tollens): P → Q dan ¬Q ⇒ ¬P, yaitu: aula sekolah belum dibersihkan.\nLangkah 2 (Eliminasi/Disjungsi): P ∨ S dan ¬P ⇒ S, yaitu: listrik sekolah padam.\nJadi kesimpulan yang tepat: listrik sekolah padam. Jawaban: A.\nB: salah, bertentangan dengan hasil penalaran di atas.\nC: salah, bertentangan dengan hasil penalaran di atas.\nD: belum tentu benar, tidak dapat dipastikan dari premis yang ada.\nE: belum tentu benar, tidak dapat dipastikan dari premis yang ada.","tables":[],"figs":[],"id":329},{"cat":"silogisme","q":"Kegiatan tersebut dihadiri tamu undangan. Apabila aula sekolah sudah dibersihkan, maka kegiatan dapat dimulai tepat waktu. Bila kegiatan dapat dimulai tepat waktu, maka seluruh peserta dapat mengikuti kegiatan sesuai jadwal. Kalau seluruh peserta dapat mengikuti kegiatan sesuai jadwal, maka acara selesai sebelum waktu makan siang. Aula sekolah sudah dibersihkan atau listrik sekolah padam. Setelah diperiksa, acara tidak selesai sebelum waktu makan siang.\nKesimpulan yang tepat adalah ...","opts":["Listrik sekolah tidak padam","Aula sekolah sudah dibersihkan","Listrik sekolah padam","Acara selesai sebelum waktu makan siang","Kegiatan dapat dimulai tepat waktu"],"a":2,"why":"Misalkan:\nP = aula sekolah sudah dibersihkan\nQ = kegiatan dapat dimulai tepat waktu\nR = seluruh peserta dapat mengikuti kegiatan sesuai jadwal\nS = acara selesai sebelum waktu makan siang\nT = listrik sekolah padam\nU = Kegiatan tersebut dihadiri tamu undangan\nDiketahui:\nP → Q;  Q → R;  R → S;  P ∨ T;  ¬S;  U\nLangkah 1 (Modus Tollens): R → S dan ¬S ⇒ ¬R, yaitu: seluruh peserta tidak dapat mengikuti kegiatan sesuai jadwal.\nLangkah 2 (Modus Tollens): Q → R dan ¬R ⇒ ¬Q, yaitu: kegiatan tidak dapat dimulai tepat waktu.\nLangkah 3 (Modus Tollens): P → Q dan ¬Q ⇒ ¬P, yaitu: aula sekolah belum dibersihkan.\nLangkah 4 (Eliminasi/Disjungsi): P ∨ T dan ¬P ⇒ T, yaitu: listrik sekolah padam.\nInformasi \"Kegiatan tersebut dihadiri tamu undangan\" tidak diperlukan untuk menarik kesimpulan.\nJadi kesimpulan yang tepat: listrik sekolah padam. Jawaban: C.\nA: salah, bertentangan dengan hasil penalaran di atas.\nB: salah, bertentangan dengan hasil penalaran di atas.\nD: salah, bertentangan dengan hasil penalaran di atas.\nE: salah, bertentangan dengan hasil penalaran di atas.","tables":[],"figs":[],"id":330},{"cat":"silogisme","q":"Bila tempat bazar sudah tertata, maka pembeli dapat berbelanja dengan nyaman. Jika pembeli dapat berbelanja dengan nyaman, maka penjualan di bazar berjalan lancar. Tempat bazar sudah tertata atau tenda utama belum terpasang. Ternyata penjualan di bazar tidak berjalan lancar.\nKesimpulan yang tepat adalah ...","opts":["Tenda utama sudah terpasang","Tempat bazar sudah tertata","Pembeli dapat berbelanja dengan nyaman","Tenda utama belum terpasang","Penjualan di bazar berjalan lancar"],"a":3,"why":"Misalkan:\nP = tempat bazar sudah tertata\nQ = pembeli dapat berbelanja dengan nyaman\nR = penjualan di bazar berjalan lancar\nS = tenda utama belum terpasang\nDiketahui:\nP → Q;  Q → R;  P ∨ S;  ¬R\nLangkah 1 (Modus Tollens): Q → R dan ¬R ⇒ ¬Q, yaitu: pembeli tidak dapat berbelanja dengan nyaman.\nLangkah 2 (Modus Tollens): P → Q dan ¬Q ⇒ ¬P, yaitu: tempat bazar belum tertata.\nLangkah 3 (Eliminasi/Disjungsi): P ∨ S dan ¬P ⇒ S, yaitu: tenda utama belum terpasang.\nJadi kesimpulan yang tepat: tenda utama belum terpasang. Jawaban: D.\nA: salah, bertentangan dengan hasil penalaran di atas.\nB: salah, bertentangan dengan hasil penalaran di atas.\nC: salah, bertentangan dengan hasil penalaran di atas.\nE: salah, bertentangan dengan hasil penalaran di atas.","tables":[],"figs":[],"id":331},{"cat":"silogisme","q":"Jika proyektor dapat digunakan, maka materi presentasi dapat ditampilkan. Jika materi presentasi dapat ditampilkan, maka kegiatan berjalan sesuai rencana. Proyektor dapat digunakan atau laptop dapat digunakan. Diketahui bahwa kegiatan tidak berjalan sesuai rencana.\nKesimpulan yang tepat adalah ...","opts":["Laptop dapat digunakan","Laptop tidak dapat digunakan","Materi presentasi dapat ditampilkan","Proyektor dapat digunakan","Kegiatan berjalan sesuai rencana"],"a":0,"why":"Misalkan:\nP = proyektor dapat digunakan\nQ = materi presentasi dapat ditampilkan\nR = kegiatan berjalan sesuai rencana\nS = laptop dapat digunakan\nDiketahui:\nP → Q;  Q → R;  P ∨ S;  ¬R\nLangkah 1 (Modus Tollens): Q → R dan ¬R ⇒ ¬Q, yaitu: materi presentasi tidak dapat ditampilkan.\nLangkah 2 (Modus Tollens): P → Q dan ¬Q ⇒ ¬P, yaitu: proyektor tidak dapat digunakan.\nLangkah 3 (Eliminasi/Disjungsi): P ∨ S dan ¬P ⇒ S, yaitu: laptop dapat digunakan.\nJadi kesimpulan yang tepat: laptop dapat digunakan. Jawaban: A.\nB: salah, bertentangan dengan hasil penalaran di atas.\nC: salah, bertentangan dengan hasil penalaran di atas.\nD: salah, bertentangan dengan hasil penalaran di atas.\nE: salah, bertentangan dengan hasil penalaran di atas.","tables":[],"figs":[],"id":332},{"cat":"silogisme","q":"Kalau Pak Kades mengadakan hajatan, maka warga libur kerja bakti. Bila warga libur kerja bakti, maka Pak RT keliling membagikan undangan. Bila Pak RT keliling membagikan undangan, maka anak-anak bermain di balai desa. Jika anak-anak bermain di balai desa, maka penjual jajanan berkumpul di balai desa. Pak Kades mengadakan hajatan atau warga mengadakan ronda malam. Ternyata warga tidak mengadakan ronda malam.\nKesimpulan yang tepat adalah ...","opts":["Penjual jajanan tidak berkumpul di balai desa","Pak RT tidak keliling membagikan undangan","Penjual jajanan berkumpul di balai desa","Anak-anak tidak bermain di balai desa","Warga tidak libur kerja bakti"],"a":2,"why":"Misalkan:\nP = Pak Kades mengadakan hajatan\nQ = warga libur kerja bakti\nR = Pak RT keliling membagikan undangan\nS = anak-anak bermain di balai desa\nT = penjual jajanan berkumpul di balai desa\nU = warga mengadakan ronda malam\nDiketahui:\nP → Q;  Q → R;  R → S;  S → T;  P ∨ U;  ¬U\nLangkah 1 (Eliminasi/Disjungsi): P ∨ U dan ¬U ⇒ P, yaitu: Pak Kades mengadakan hajatan.\nLangkah 2 (Modus Ponens): P → Q dan P ⇒ Q, yaitu: warga libur kerja bakti.\nLangkah 3 (Modus Ponens): Q → R dan Q ⇒ R, yaitu: Pak RT keliling membagikan undangan.\nLangkah 4 (Modus Ponens): R → S dan R ⇒ S, yaitu: anak-anak bermain di balai desa.\nLangkah 5 (Modus Ponens): S → T dan S ⇒ T, yaitu: penjual jajanan berkumpul di balai desa.\nJadi kesimpulan yang tepat: penjual jajanan berkumpul di balai desa. Jawaban: C.\nA: salah, bertentangan dengan hasil penalaran di atas.\nB: salah, bertentangan dengan hasil penalaran di atas.\nD: salah, bertentangan dengan hasil penalaran di atas.\nE: salah, bertentangan dengan hasil penalaran di atas.","tables":[],"figs":[],"id":333},{"cat":"silogisme","q":"Koperasi buka setiap hari kerja. Bila persediaan alat tulis mencukupi, maka kebutuhan siswa terpenuhi. Apabila kebutuhan siswa terpenuhi, maka siswa tidak perlu membeli alat tulis di luar sekolah. Faktanya, siswa perlu membeli alat tulis di luar sekolah.\nKesimpulan yang tepat adalah ...","opts":["Persediaan alat tulis mencukupi","Kendaraan pengiriman tidak mengalami kerusakan","Persediaan alat tulis tidak mencukupi","Kebutuhan siswa terpenuhi","Kendaraan pengiriman mengalami kerusakan"],"a":2,"why":"Misalkan:\nP = persediaan alat tulis mencukupi\nQ = kebutuhan siswa terpenuhi\nR = siswa tidak perlu membeli alat tulis di luar sekolah\nS = Koperasi buka setiap hari kerja\nDiketahui:\nP → Q;  Q → R;  ¬R;  S\nLangkah 1 (Modus Tollens): Q → R dan ¬R ⇒ ¬Q, yaitu: kebutuhan siswa tidak terpenuhi.\nLangkah 2 (Modus Tollens): P → Q dan ¬Q ⇒ ¬P, yaitu: persediaan alat tulis tidak mencukupi.\nInformasi \"Koperasi buka setiap hari kerja\" tidak diperlukan untuk menarik kesimpulan.\nJadi kesimpulan yang tepat: persediaan alat tulis tidak mencukupi. Jawaban: C.\nA: salah, bertentangan dengan hasil penalaran di atas.\nB: belum tentu benar, tidak dapat dipastikan dari premis yang ada.\nD: salah, bertentangan dengan hasil penalaran di atas.\nE: belum tentu benar, tidak dapat dipastikan dari premis yang ada.","tables":[],"figs":[],"id":334},{"cat":"silogisme","q":"Bila Maya mengikuti lomba debat, maka Maya mengikuti latihan debat. Kalau Maya mengikuti latihan debat, maka Maya mendapatkan izin pembina. Jika Maya mendapatkan izin pembina, maka Maya menyerahkan surat izin orang tua. Maya mengikuti lomba debat atau Maya mengikuti lomba pidato. Ternyata Maya tidak menyerahkan surat izin orang tua.\nKesimpulan ya n di atas.","tables":[],"figs":[],"id":341},{"cat":"silogisme","q":"Jika jalan utama tidak tergenang, maka kendaraan dapat melewati jalan dengan lancar. Bila kendaraan dapat melewati jalan dengan lancar, maka pengiriman bahan makanan tidak terlambat. Apabila pengiriman bahan makanan tidak terlambat, maka harga bahan makanan di dusun tetap stabil. Kendaraan dapat melewati jalan dengan lancar.\nKesimpulan yang tepat adalah ...","opts":["Harga bahan makanan di dusun tidak stabil","Harga bahan makanan di dusun tetap stabil","Jalan utama tidak tergenang","Jembatan mengalami kerusakan","Jalan utama tergenang"],"a":1,"why":"Misalkan:\nP = jalan utama tidak tergenang\nQ = kendaraan dapat melewati jalan dengan lancar\nR = pengiriman bahan makanan tidak terlambat\nS = harga bahan makanan di dusun tetap stabil\nDiketahui:\nP → Q;  Q → R;  R → S;  Q\nLangkah 1 (Modus Ponens): Q → R dan Q ⇒ R, yaitu: pengiriman bahan makanan tidak terlambat.\nLangkah 2 (Modus Ponens): R → S dan R ⇒ S, yaitu: harga bahan makanan di dusun tetap stabil.\nJadi kesimpulan yang tepat: harga bahan makanan di dusun tetap stabil. Jawaban: B.\nA: salah, bertentangan dengan hasil penalaran di atas.\nC: belum tentu benar, tidak dapat dipastikan dari premis yang ada.\nD: belum tentu benar, tidak dapat dipastikan dari premis yang ada.\nE: belum tentu benar, tidak dapat dipastikan dari premis yang ada.","tables":[],"figs":[],"id":342},{"cat":"silogisme","q":"Kalau persediaan alat tulis mencukupi, maka kebutuhan siswa terpenuhi. Jika kebutuhan siswa terpenuhi, maka siswa tidak perlu membeli alat tulis di luar sekolah. Kalau siswa tidak perlu membeli alat tulis di luar sekolah, maka penjualan koperasi meningkat. Koperasi buka setiap hari kerja. Kebutuhan siswa tidak terpenuhi.\nKesimpulan yang tepat adalah ...","opts":["Persediaan alat tulis tidak mencukupi","Persediaan alat tulis mencukupi","Penjualan koperasi meningkat","Kendaraan pengiriman tidak mengalami kerusakan","Siswa tidak perlu membeli alat tulis di luar sekolah"],"a":0,"why":"Misalkan:\nP = persediaan alat tulis mencukupi\nQ = kebutuhan siswa terpenuhi\nR = siswa tidak perlu membeli alat tulis di luar sekolah\nS = penjualan koperasi meningkat\nT = Koperasi buka setiap hari kerja\nDiketahui:\nP → Q;  Q → R;  R → S;  ¬Q;  T\nLangkah 1 (Modus Tollens): P → Q dan ¬Q ⇒ ¬P, yaitu: persediaan alat tulis tidak mencukupi.\nInformasi \"Koperasi buka setiap hari kerja\" tidak diperlukan untuk menarik kesimpulan.\nJadi kesimpulan yang tepat: persediaan alat tulis tidak mencukupi. Jawaban: A.\nB: salah, bertentangan dengan hasil penalaran di atas.\nC: belum tentu benar, tidak dapat dipastikan dari premis yang ada.\nD: belum tentu benar, tidak dapat dipastikan dari premis yang ada.\nE: belum tentu benar, tidak dapat dipastikan dari premis yang ada.","tables":[],"figs":[],"id":343},{"cat":"silogisme","q":"Kalau tempat bazar sudah tertata, maka pembeli dapat berbelanja dengan nyaman. Jika pembeli dapat berbelanja dengan nyaman, maka penjualan di bazar berjalan lancar. Penjualan di bazar tidak berjalan lancar.\nKesimpulan yang tepat adalah ...","opts":["Tempat bazar sudah tertata","Tenda utama belum terpasang","Penjualan di bazar berjalan lancar","Tempat bazar belum tertata","Tenda utama sudah terpasang"],"a":3,"why":"Misalkan:\nP = tempat bazar sudah tertata\nQ = pembeli dapat berbelanja dengan nyaman\nR = penjualan di bazar berjalan lancar\nDiketahui:\nP → Q;  Q → R;  ¬R\nLangkah 1 (Modus Tollens): Q → R dan ¬R ⇒ ¬Q, yaitu: pembeli tidak dapat berbelanja dengan nyaman.\nLangkah 2 (Modus Tollens): P → Q dan ¬Q ⇒ ¬P, yaitu: tempat bazar belum tertata.\nJadi kesimpulan yang tepat: tempat bazar belum tertata. Jawaban: D.\nA: salah, bertentangan dengan hasil penalaran di atas.\nB: belum tentu benar, tidak dapat dipastikan dari premis yang ada.\nC: salah, bertentangan dengan hasil penalaran di atas.\nE: belum tentu benar, tidak dapat dipastikan dari premis yang ada.","tables":[],"figs":[],"id":344},{"cat":"silogisme","q":"Apabila Tono diterima sebagai anggota tim penelitian, maka Tono lulus wawancara. Jika Tono lulus wawancara, maka Tono lulus tes tertulis. Apabila Tono lulus tes tertulis, maka Tono melengkapi berkas pendaftaran. Apabila Tono melengkapi berkas pendaftaran, maka Tono mengisi formulir secara daring. Tono diterima sebagai anggota tim penelitian atau Tono menjadi anggota tim dokumentasi. Faktanya, Tono tidak mengisi formulir secara daring.\nKesimpulan yang tepat adalah ...","opts":["Tono tidak menjadi anggota tim dokumentasi","Tono menjadi anggota tim dokumentasi","Tono melengkapi berkas pendaftaran","Tono lulus wawancara","Tono lulus tes tertulis"],"a":1,"why":"Misalkan:\nP = Tono diterima sebagai anggota tim penelitian\nQ = Tono lulus wawancara\nR = Tono lulus tes tertulis\nS = Tono melengkapi berkas pendaftaran\nT = Tono mengisi formulir secara daring\nU = Tono menjadi anggota tim dokumentasi\nDiketahui:\nP → Q;  Q → R;  R → S;  S → T;  P ∨ U;  ¬T\nLangkah 1 (Modus Tollens): S → T dan ¬T ⇒ ¬S, yaitu: Tono tidak melengkapi berkas pendaftaran.\nLangkah 2 (Modus Tollens): R → S dan ¬S ⇒ ¬R, yaitu: Tono tidak lulus tes tertulis.\nLangkah 3 (Modus Tollens): Q → R dan ¬R ⇒ ¬Q, yaitu: Tono tidak lulus wawancara.\nLangkah 4 (Modus Tollens): P → Q dan ¬Q ⇒ ¬P, yaitu: Tono tidak diterima sebagai anggota tim penelitian.\nLangkah 5 (Eliminasi/Disjungsi): P ∨ U dan ¬P ⇒ U, yaitu: Tono menjadi anggota tim dokumentasi.\nJadi kesimpulan yang tepat: Tono menjadi anggota tim dokumentasi. Jawaban: B.\nA: salah, bertentangan dengan hasil penalaran di atas.\nC: salah, bertentangan dengan hasil penalaran di atas.\nD: salah, bertentangan dengan hasil penalaran di atas.\nE: salah, bertentangan dengan hasil penalaran di atas.","tables":[],"figs":[],"id":345},{"cat":"silogisme","q":"Jika proyektor dapat digunakan, maka materi presentasi dapat ditampilkan. Bila materi presentasi dapat ditampilkan, maka kegiatan berjalan sesuai rencana. Apabila kegiatan berjalan sesuai rencana, maka peserta memahami materi dengan baik. Jika peserta memahami materi dengan baik, maka panitia menerima umpan balik positif. Proyektor dapat digunakan atau laptop dapat digunakan. Panitia tidak menerima umpan balik positif. Kegiatan dimulai pukul 08.00.\nKesimpulan yang tepat adalah ...","opts":["Laptop tidak dapat digunakan","Peserta memahami materi dengan baik","Panitia menerima umpan balik positif","Laptop dapat digunakan","Kegiatan berjalan sesuai rencana"],"a":3,"why":"Misalkan:\nP = proyektor dapat digunakan\nQ = materi presentasi dapat ditampilkan\nR = kegiatan berjalan sesuai rencana\nS = peserta memahami materi dengan baik\nT = panitia menerima umpan balik positif\nU = laptop dapat digunakan\nV = Kegiatan dimulai pukul 08.00\nDiketahui:\nP → Q;  Q → R;  R → S;  S → T;  P ∨ U;  ¬T;  V\nLangkah 1 (Modus Tollens): S → T dan ¬T ⇒ ¬S, yaitu: peserta tidak memahami materi dengan baik.\nLangkah 2 (Modus Tollens): R → S dan ¬S ⇒ ¬R, yaitu: kegiatan tidak berjalan sesuai rencana.\nLangkah 3 (Modus Tollens): Q → R dan ¬R ⇒ ¬Q, yaitu: materi presentasi tidak dapat ditampilkan.\nLangkah 4 (Modus Tollens): P → Q dan ¬Q ⇒ ¬P, yaitu: proyektor tidak dapat digunakan.\nLangkah 5 (Eliminasi/Disjungsi): P ∨ U dan ¬P ⇒ U, yaitu: laptop dapat digunakan.\nInformasi \"Kegiatan dimulai pukul 08.00\" tidak diperlukan untuk menarik kesimpulan.\nJadi kesimpulan yang tepat: laptop dapat digunakan. Jawaban: D.\nA: salah, bertentangan dengan hasil penalaran di atas.\nB: salah, bertentangan dengan hasil penalaran di atas.\nC: salah, bertentangan dengan hasil penalaran di atas.\nE: salah, bertentangan dengan hasil penalaran di atas.","tables":[],"figs":[],"id":346},{"cat":"silogisme","q":"Kalau harga produk diturunkan, maka jumlah pembeli meningkat. Toko berada di dekat terminal. Jika jumlah pembeli meningkat, maka omzet toko bertambah. Bila omzet toko bertambah, maka keuntungan toko meningkat. Apabila keuntungan toko meningkat, maka toko menambah stok barang. Ternyata toko tidak menambah stok barang.\nKesimpulan yang tepat adalah ...","opts":["Harga produk diturunkan","Omzet toko bertambah","Toko menambah stok barang","Harga produk tidak diturunkan","Toko memperpanjang jam buka"],"a":3,"why":"Misalkan:\nP = harga produk diturunkan\nQ = jumlah pembeli meningkat\nR = omzet toko bertambah\nS = keuntungan toko meningkat\nT = toko menambah stok barang\nU = Toko berada di dekat terminal\nDiketahui:\nP → Q;  Q → R;  R → S;  S → T;  ¬T;  U\nLangkah 1 (Modus Tollens): S → T dan ¬T ⇒ ¬S, yaitu: keuntungan toko tidak meningkat.\nLangkah 2 (Modus Tollens): R → S dan ¬S ⇒ ¬R, yaitu: omzet toko tidak bertambah.\nLangkah 3 (Modus Tollens): Q → R dan ¬R ⇒ ¬Q, yaitu: jumlah pembeli tidak meningkat.\nLangkah 4 (Modus Tollens): P → Q dan ¬Q ⇒ ¬P, yaitu: harga produk tidak diturunkan.\nInformasi \"Toko berada di dekat terminal\" tidak diperlukan untuk menarik kesimpulan.\nJadi kesimpulan yang tepat: harga produk tidak diturunkan. Jawaban: D.\nA: salah, bertentangan dengan hasil penalaran di atas.\nB: salah, bertentangan dengan hasil penalaran di atas.\nC: salah, bertentangan dengan hasil penalaran di atas.\nE: belum tentu benar, tidak dapat dipastikan dari premis yang ada.","tables":[],"figs":[],"id":347},{"cat":"silogisme","q":"Jika Kirana mengikuti lomba Matematika, maka Kirana mengikuti seleksi Matematika. Jika Kirana mengikuti seleksi Matematika, maka Kirana lulus seleksi Matematika. Apabila Kirana lulus seleksi Matematika, maka Kirana menerima surat tugas dari sekolah. Setelah diperiksa, Kirana mengikuti lomba Matematika.\nKesimpulan yang tepat adalah ...","opts":["Kirana menerima surat tugas dari sekolah","Kirana tidak menerima surat tugas dari sekolah","Kirana mengikuti lomba Fisika","Kirana tidak mengikuti lomba Matematika","Kirana tidak mengikuti lomba Fisika"],"a":0,"why":"Misalkan:\nP = Kirana mengikuti lomba Matematika\nQ = Kirana mengikuti seleksi Matematika\nR = Kirana lulus seleksi Matematika\nS = Kirana menerima surat tugas dari sekolah\nDiketahui:\nP → Q;  Q → R;  R → S;  P\nLangkah 1 (Modus Ponens): P → Q dan P ⇒ Q, yaitu: Kirana mengikuti seleksi Matematika.\nLangkah 2 (Modus Ponens): Q → R dan Q ⇒ R, yaitu: Kirana lulus seleksi Matematika.\nLangkah 3 (Modus Ponens): R → S dan R ⇒ S, yaitu: Kirana menerima surat tugas dari sekolah.\nJadi kesimpulan yang tepat: Kirana menerima surat tugas dari sekolah. Jawaban: A.\nB: salah, bertentangan dengan hasil penalaran di atas.\nC: belum tentu benar, tidak dapat dipastikan dari premis yang ada.\nD: salah, bertentangan dengan hasil penalaran di atas.\nE: belum tentu benar, tidak dapat dipastikan dari premis yang ada.","tables":[],"figs":[],"id":348},{"cat":"silogisme","q":"Kalau Kirana diterima sebagai anggota tim penelitian, maka Kirana lulus wawancara. Kalau Kirana lulus wawancara, maka Kirana lulus tes tertulis. Bila Kirana lulus tes tertulis, maka Kirana melengkapi berkas pendaftaran. Kirana diterima sebagai anggota tim penelitian atau Kirana menjadi anggota tim dokumentasi. Faktanya, Kirana tidak melengkapi berkas pendaftaran.\nKesimpulan yang tepat adalah ...","opts":["Kirana tidak menjadi anggota tim dokumentasi","Kirana melengkapi berkas pendaftaran","Kirana lulus tes tertulis","Kirana diterima sebagai anggota tim penelitian","Kirana menjadi anggota tim dokumentasi"],"a":4,"why":"Misalkan:\nP = Kirana diterima sebagai anggota tim penelitian\nQ = Kirana lulus wawancara\nR = Kirana lulus tes tertulis\nS = Kirana melengkapi berkas pendaftaran\nT = Kirana menjadi anggota tim dokumentasi\nDiketahui:\nP → Q;  Q → R;  R → S;  P ∨ T;  ¬S\nLangkah 1 (Modus Tollens): R → S dan ¬S ⇒ ¬R, yaitu: Kirana tidak lulus tes tertulis.\nLangkah 2 (Modus Tollens): Q → R dan ¬R ⇒ ¬Q, yaitu: Kirana tidak lulus wawancara.\nLangkah 3 (Modus Tollens): P → Q dan ¬Q ⇒ ¬P, yaitu: Kirana tidak diterima sebagai anggota tim penelitian.\nLangkah 4 (Eliminasi/Disjungsi): P ∨ T dan ¬P ⇒ T, yaitu: Kirana menjadi anggota tim dokumentasi.\nJadi kesimpulan yang tepat: Kirana menjadi anggota tim dokumentasi. Jawaban: E.\nA: salah, bertentangan dengan hasil penalaran di atas.\nB: salah, bertentangan dengan hasil penalaran di atas.\nC: salah, bertentangan dengan hasil penalaran di atas.\nD: salah, bertentangan dengan hasil penalaran di atas.","tables":[],"figs":[],"id":349},{"cat":"silogisme","q":"Jika Reza menjadi ketua kelas, maka Reza mengikuti pemilihan ketua kelas. Jika Reza mengikuti pemilihan ketua kelas, maka Reza tercatat sebagai calon. Kalau Reza tercatat sebagai calon, maka nama Reza terpampang di papan pengumuman. Reza menjadi ketua kelas atau Reza menjadi wakil ketua kelas. Reza tidak menjadi wakil ketua kelas.\nKesimpulan yang tepat adalah ...","opts":["Nama Reza tidak terpampang di papan pengumuman","Nama Reza terpampang di papan pengumuman","Reza tidak mengikuti pemilihan ketua kelas","Reza tidak tercatat sebagai calon","Reza menjadi wakil ketua kelas"],"a":1,"why":"Misalkan:\nP = Reza menjadi ketua kelas\nQ = Reza mengikuti pemilihan ketua kelas\nR = Reza tercatat sebagai calon\nS = nama Reza terpampang di papan pengumuman\nT = Reza menjadi wakil ketua kelas\nDiketahui:\nP → Q;  Q → R;  R → S;  P ∨ T;  ¬T\nLangkah 1 (Eliminasi/Disjungsi): P ∨ T dan ¬T ⇒ P, yaitu: Reza menjadi ketua kelas.\nLangkah 2 (Modus Ponens): P → Q dan P ⇒ Q, yaitu: Reza mengikuti pemilihan ketua kelas.\nLangkah 3 (Modus Ponens): Q → R dan Q ⇒ R, yaitu: Reza tercatat sebagai calon.\nLangkah 4 (Modus Ponens): R → S dan R ⇒ S, yaitu: nama Reza terpampang di papan pengumuman.\nJadi kesimpulan yang tepat: nama Reza terpampang di papan pengumuman. Jawaban: B.\nA: salah, bertentangan dengan hasil penalaran di atas.\nC: salah, bertentangan dengan hasil penalaran di atas.\nD: salah, bertentangan dengan hasil penalaran di atas.\nE: salah, bertentangan dengan hasil penalaran di atas.","tables":[],"figs":[],"id":350},{"cat":"argumen","q":"Aplikasi belajar bahasa asing dapat meningkatkan kemampuan berbicara penggunanya karena materi tersedia setiap saat. Oleh karena itu, semakin sering seseorang membuka aplikasi tersebut, semakin lancar ia berbicara.\n\nManakah pernyataan berikut yang MEMPERLEMAH pernyataan di atas?","opts":["Pengguna yang membuka aplikasi setiap hari mengaku jauh lebih percaya diri saat harus bercakap-cakap dengan penutur asli di tempat kerjanya, menurut laporan yang disusun oleh tim peneliti setempat.","Sebagian besar latihan di aplikasi itu hanya berupa memilih jawaban dan mencocokkan kata tanpa pernah meminta pengguna mengucapkan kalimat, sehingga kemampuan berbicara tidak ikut terlatih seberapa pun seringnya aplikasi dibuka.","Notifikasi pengingat dari aplikasi sering muncul saat pengguna sedang bekerja sehingga sebagian pengguna menutupnya begitu saja tanpa membuka materi pelajaran hari itu, meskipun kejadian itu tidak berlangsung terus-menerus sepanjang tahun.","Beberapa pengguna lupa kata sandi dan harus mendaftar ulang sehingga waktu belajar mereka terpotong, tetapi setelah masuk kembali mereka tetap mengikuti seluruh pelajaran, namun situasi tersebut biasanya hanya berlangsung sebentar.","Aplikasi tersebut menawarkan paket berlangganan tahunan dengan harga yang lebih murah dibandingkan biaya kursus bahasa asing tatap muka di berbagai kota besar, menurut keterangan pihak pengelola kepada para wartawan."],"a":1,"why":"Kunci: B\nInti argumen: Aplikasi belajar bahasa asing dapat meningkatkan kemampuan berbicara penggunanya karena materi tersedia setiap saat.\nA. Justru MEMPERKUAT. Mendukung argumen, bukan melemahkan.\nB. MEMPERLEMAH TOTAL. Mematahkan mekanisme: yang dilatih bukan kemampuan berbicara, jadi membuka aplikasi lebih sering tidak membuat pengguna lebih lancar berbicara.\nC. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Hanya gangguan kebiasaan yang bisa diatasi dengan mematikan notifikasi; hubungan latihan dan kelancaran berbicara tidak terbantah.\nD. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Masalah teknis sementara; setelah teratasi, mekanisme belajar berjalan lagi.\nE. Tidak relevan. Soal harga tidak berhubungan dengan lancar tidaknya berbicara.\nTips: pelemah terkuat menyerang mekanisme atau akar masalahnya, bukan sekadar menyebut kendala teknis yang masih bisa diperbaiki.","tables":[],"figs":[],"id":351},{"cat":"argumen","q":"Kampanye hemat listrik melalui poster di kantor dapat menurunkan pemakaian listrik karena karyawan menjadi sadar untuk mematikan perangkat. Oleh karena itu, semakin banyak poster dipasang, semakin rendah tagihan listrik kantor.\n\nManakah pernyataan berikut yang MEMPERLEMAH pernyataan di atas?","opts":["Setelah poster dipasang, petugas gedung menemukan lebih banyak lampu di ruang kosong yang sudah dimatikan karyawan sebelum mereka pulang pada sore hari, sebagaimana dicatat petugas selama beberapa bulan pengamatan terakhir.","Beberapa poster terlepas dari dinding karena lem yang kurang kuat sehingga petugas kebersihan harus menempelnya ulang beberapa kali dalam sebulan, namun situasi tersebut biasanya hanya berlangsung sebentar.","Poster kampanye dicetak dengan desain berwarna yang menarik dan dirancang oleh tim kreatif internal sehingga tidak perlu menyewa agensi iklan dari luar, sebagaimana sudah diumumkan dalam rapat tahunan sejak beberapa waktu lalu.","Sebagian besar pemakaian listrik kantor berasal dari pendingin ruangan sentral dan server yang menyala otomatis 24 jam, sehingga kebiasaan karyawan mematikan perangkat hampir tidak memengaruhi besarnya tagihan.","Sebagian karyawan baru belum hafal letak sakelar lampu sehingga lupa mematikannya di ruang rapat kecil yang jarang dipakai pada sore hari, namun situasi tersebut biasanya hanya berlangsung sebentar."],"a":3,"why":"Kunci: D\nInti argumen: Kampanye hemat listrik melalui poster di kantor dapat menurunkan pemakaian listrik karena karyawan menjadi sadar untuk mematikan perangkat.\nA. Justru MEMPERKUAT. Menunjukkan karyawan benar-benar mematikan perangkat, mendukung argumen.\nB. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Masalah teknis pemasangan; pesan kampanye tetap sampai.\nC. Tidak relevan. Soal desain dan biaya cetak, tidak menyangkut besar tagihan listrik.\nD. MEMPERLEMAH TOTAL. Mematahkan asumsi: sumber utama pemakaian listrik tidak bisa dikurangi oleh kesadaran karyawan, jadi poster tidak menurunkan tagihan.\nE. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Hanya kelemahan sebagian orang dan bisa diatasi dengan arahan, bukan membatalkan hubungan sebab-akibat.\nTips: pelemah terkuat menyerang mekanisme atau akar masalahnya, bukan sekadar menyebut kendala teknis yang masih bisa diperbaiki.","tables":[],"figs":[],"id":352},{"cat":"argumen","q":"Penyediaan bus gratis di pusat kota dapat mengurangi kemacetan karena warga beralih dari kendaraan pribadi ke bus. Oleh karena itu, semakin banyak armada bus gratis disediakan, semakin lancar lalu lintas kota.\n\nManakah pernyataan berikut yang MEMPERLEMAH pernyataan di atas?","opts":["Pemerintah kota membiayai operasional bus gratis dari anggaran promosi pariwisata yang tidak terpakai pada tahun anggaran sebelumnya, sebagaimana sudah diumumkan dalam rapat tahunan sejak beberapa waktu lalu.","Jadwal kedatangan bus pada jam sibuk kadang terlambat beberapa menit karena pengaturan lampu lalu lintas di beberapa persimpangan besar, namun situasi tersebut biasanya hanya berlangsung sebentar.","Sebagian besar penumpang bus gratis adalah pejalan kaki dan pengguna sepeda yang semula tidak membawa kendaraan, sedangkan pemilik kendaraan pribadi tetap memakai kendaraannya sehingga jumlah kendaraan di jalan tidak berkurang.","Survei di perkantoran menunjukkan pegawai yang kini naik bus gratis tidak lagi membawa mobil ke pusat kota sehingga jumlah mobil yang masuk berkurang, menurut laporan yang disusun oleh tim peneliti setempat.","Beberapa halte bus belum memiliki atap sehingga calon penumpang yang menunggu enggan naik bus ketika hujan turun deras di sore hari, meskipun kejadian itu tidak berlangsung terus-menerus sepanjang tahun."],"a":2,"why":"Kunci: C\nInti argumen: Penyediaan bus gratis di pusat kota dapat mengurangi kemacetan karena warga beralih dari kendaraan pribadi ke bus.\nA. Tidak relevan. Sumber dana tidak berkaitan dengan ada tidaknya penurunan kemacetan.\nB. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Keterlambatan kecil yang bisa dibenahi dengan penyesuaian jadwal.\nC. MEMPERLEMAH TOTAL. Mematahkan asumsi pokok: warga yang beralih ke bus bukan pengguna kendaraan pribadi, jadi kemacetan tidak berkurang.\nD. Justru MEMPERKUAT. Menguatkan: pengguna kendaraan pribadi memang beralih ke bus.\nE. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Masalah fasilitas yang bisa diperbaiki dengan memasang atap.\nTips: pelemah terkuat menyerang mekanisme atau akar masalahnya, bukan sekadar menyebut kendala teknis yang masih bisa diperbaiki.","tables":[],"figs":[],"id":353},{"cat":"argumen","q":"Pelatihan keterampilan rutin dapat meningkatkan produktivitas karyawan karena mereka menguasai cara kerja yang lebih efisien. Oleh karena itu, semakin sering pelatihan diadakan, semakin tinggi produktivitas perusahaan.\n\nManakah pernyataan berikut yang MEMPERLEMAH pernyataan di atas?","opts":["Pelatihan diadakan pada jam kerja sehingga karyawan meninggalkan pekerjaan utamanya berhari-hari setiap bulan, dan waktu produktif yang hilang itu lebih besar daripada waktu yang dihemat oleh cara kerja baru.","Perusahaan memilih hotel berbintang sebagai tempat pelatihan agar terlihat bergengsi di mata mitra bisnis dan para klien besarnya, sebagaimana sudah diumumkan dalam rapat tahunan sejak beberapa waktu lalu.","Karyawan yang mengikuti pelatihan terbukti menyelesaikan laporan bulanan dua hari lebih cepat dibandingkan sebelum mereka mengikuti pelatihan tersebut, sebagaimana dicatat petugas selama beberapa bulan pengamatan terakhir.","Sebagian materi pelatihan disampaikan terlalu cepat sehingga beberapa peserta perlu membaca ulang modulnya di rumah agar benar-benar memahami isinya, walaupun masalah ini hanya muncul pada sebagian kecil kesempatan.","Ruang pelatihan kadang terasa terlalu dingin sehingga peserta kurang nyaman pada sesi siang, walaupun materi tetap dapat mereka ikuti sampai akhir, dan kejadian serupa pernah dilaporkan pada tahun-tahun sebelumnya."],"a":0,"why":"Kunci: A\nInti argumen: Pelatihan keterampilan rutin dapat meningkatkan produktivitas karyawan karena mereka menguasai cara kerja yang lebih efisien.\nA. MEMPERLEMAH TOTAL. Menghitung ulang untung-rugi: tambahan pelatihan justru mengurangi total waktu produktif, jadi kesimpulan runtuh.\nB. Tidak relevan. Urusan citra, tidak menyangkut produktivitas.\nC. Justru MEMPERKUAT. Memberi bukti peningkatan efisiensi, mendukung argumen.\nD. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Kekurangan teknis penyampaian yang bisa diperbaiki, bukan pembatal kesimpulan.\nE. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Gangguan kenyamanan kecil yang tidak memutus hubungan pelatihan dan produktivitas.\nTips: pelemah terkuat menyerang mekanisme atau akar masalahnya, bukan sekadar menyebut kendala teknis yang masih bisa diperbaiki.","tables":[],"figs":[],"id":354},{"cat":"argumen","q":"Berolahraga pagi dapat meningkatkan kebugaran karena tubuh bergerak sebelum beraktivitas. Oleh karena itu, semakin sering seseorang berolahraga pagi, semakin bugar tubuhnya.\n\nManakah pernyataan berikut yang MEMPERLEMAH pernyataan di atas?","opts":["Sebagian orang kesulitan bangun pagi sehingga jadwal olahraganya kadang terlewat satu atau dua hari dalam seminggu, tetapi mereka mengejarnya di hari lain, namun situasi tersebut biasanya hanya berlangsung sebentar.","Pemeriksaan kebugaran menunjukkan peserta senam pagi memiliki kapasitas paru dan denyut jantung istirahat yang lebih baik dibanding mereka yang tidak berolahraga, sebagaimana dicatat petugas selama beberapa bulan pengamatan terakhir.","Kebanyakan orang yang disebut berolahraga pagi hanya berjalan santai sangat pelan beberapa menit sehingga detak jantungnya tidak naik, dan intensitas serendah itu terbukti tidak mengubah kebugaran sama sekali.","Udara pagi di beberapa kota masih berkabut asap sehingga sebagian orang memilih berolahraga di dalam ruangan pada hari-hari tertentu, namun situasi tersebut biasanya hanya berlangsung sebentar.","Banyak orang membeli sepatu olahraga bermerek terkenal dan pakaian khusus sebelum memulai kebiasaan berolahraga di pagi hari, sebagaimana sudah diumumkan dalam rapat tahunan sejak beberapa waktu lalu."],"a":2,"why":"Kunci: C\nInti argumen: Berolahraga pagi dapat meningkatkan kebugaran karena tubuh bergerak sebelum beraktivitas.\nA. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Kendala kedisiplinan yang bisa diatasi, bukan bantahan terhadap manfaat olahraga.\nB. Justru MEMPERKUAT. Bukti terukur yang mendukung argumen.\nC. MEMPERLEMAH TOTAL. Mematahkan mekanisme: gerakan yang dilakukan tidak cukup untuk melatih tubuh, sehingga seringnya olahraga tidak menambah kebugaran.\nD. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Hanya mengubah tempat berolahraga, bukan membatalkan manfaatnya.\nE. Tidak relevan. Soal belanja perlengkapan, tidak menyangkut kebugaran.\nTips: pelemah terkuat menyerang mekanisme atau akar masalahnya, bukan sekadar menyebut kendala teknis yang masih bisa diperbaiki.","tables":[],"figs":[],"id":355},{"cat":"argumen","q":"Perpustakaan digital gratis dapat meningkatkan minat baca siswa karena buku mudah diakses dari mana saja. Oleh karena itu, semakin banyak judul buku digital tersedia, semakin tinggi minat baca siswa.\n\nManakah pernyataan berikut yang MEMPERLEMAH pernyataan di atas?","opts":["Catatan aplikasi menunjukkan siswa yang punya akses ke lebih banyak judul rata-rata menamatkan lebih banyak buku setiap bulannya, menurut laporan yang disusun oleh tim peneliti setempat.","Perpustakaan digital itu dikelola oleh yayasan swasta yang juga mengelola beberapa toko buku daring dan penerbit kecil, menurut keterangan pihak pengelola kepada para wartawan.","Tampilan aplikasi perpustakaan digital belum mendukung ukuran layar ponsel tertentu sehingga tulisan terpotong pada beberapa merek ponsel, meskipun kejadian itu tidak berlangsung terus-menerus sepanjang tahun.","Koneksi internet di beberapa daerah masih lambat sehingga unduhan buku sering gagal dan siswa harus mencoba lagi beberapa kali, namun situasi tersebut biasanya hanya berlangsung sebentar.","Sebagian besar siswa hanya membuka perpustakaan digital untuk mengunduh buku yang diwajibkan guru dan tidak membacanya sampai selesai, sementara waktu mereka membaca buku di luar tugas tidak berubah."],"a":4,"why":"Kunci: E\nInti argumen: Perpustakaan digital gratis dapat meningkatkan minat baca siswa karena buku mudah diakses dari mana saja.\nA. Justru MEMPERKUAT. Memperkuat hubungan jumlah judul dan minat baca.\nB. Tidak relevan. Siapa pengelolanya tidak menentukan minat baca siswa.\nC. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Masalah tampilan yang dapat diperbaiki pengembang.\nD. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Kendala jaringan yang bisa diperbaiki; bukan inti argumen.\nE. MEMPERLEMAH TOTAL. Mematahkan hubungan sebab-akibat: kemudahan akses tidak mengubah minat membaca, hanya memudahkan tugas.\nTips: pelemah terkuat menyerang mekanisme atau akar masalahnya, bukan sekadar menyebut kendala teknis yang masih bisa diperbaiki.","tables":[],"figs":[],"id":356},{"cat":"argumen","q":"Kenaikan harga rokok melalui cukai dapat menurunkan jumlah perokok karena rokok menjadi mahal. Oleh karena itu, semakin tinggi cukai, semakin sedikit orang yang merokok.\n\nManakah pernyataan berikut yang MEMPERLEMAH pernyataan di atas?","opts":["Penjualan rokok eceran di warung kecil masih sulit diawasi sehingga sebagian pembeli tetap mendapat harga lama dari pedagang tertentu, walaupun masalah ini hanya muncul pada sebagian kecil kesempatan.","Sebagian besar perokok beralih ke rokok linting tanpa cukai yang jauh lebih murah, sehingga jumlah perokok tidak berkurang meskipun harga rokok bercukai naik tinggi.","Sebagian perokok berat membutuhkan waktu lebih lama untuk menyesuaikan pengeluaran bulanan setelah harga rokok naik sehingga penurunan konsumsinya terlihat belakangan, meskipun kejadian itu tidak berlangsung terus-menerus sepanjang tahun.","Pendapatan negara dari cukai digunakan untuk membiayai berbagai program pembangunan di daerah, termasuk perbaikan jalan dan sekolah, sebagaimana sudah diumumkan dalam rapat tahunan sejak beberapa waktu lalu.","Data penjualan menunjukkan setiap kenaikan harga rokok diikuti penurunan jumlah pembeli dan banyak perokok remaja berhenti karena tidak mampu lagi membelinya, sebagaimana dicatat petugas selama beberapa bulan pengamatan terakhir."],"a":1,"why":"Kunci: B\nInti argumen: Kenaikan harga rokok melalui cukai dapat menurunkan jumlah perokok karena rokok menjadi mahal.\nA. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Masalah pengawasan yang bisa diperbaiki, tidak membatalkan pengaruh harga.\nB. MEMPERLEMAH TOTAL. Mematahkan mekanisme: harga naik tidak membuat orang berhenti, mereka hanya berpindah ke produk murah.\nC. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Hanya menunda dampak, bukan membantahnya.\nD. Tidak relevan. Penggunaan dana tidak berhubungan dengan jumlah perokok.\nE. Justru MEMPERKUAT. Mendukung argumen dengan data.\nTips: pelemah terkuat menyerang mekanisme atau akar masalahnya, bukan sekadar menyebut kendala teknis yang masih bisa diperbaiki.","tables":[],"figs":[],"id":357},{"cat":"argumen","q":"Larangan membawa ponsel ke sekolah dapat meningkatkan konsentrasi belajar karena siswa tidak terganggu notifikasi. Oleh karena itu, semakin ketat larangan diterapkan, semakin tinggi konsentrasi siswa.\n\nManakah pernyataan berikut yang MEMPERLEMAH pernyataan di atas?","opts":["Guru melaporkan bahwa kelas yang menerapkan larangan ponsel lebih jarang menegur siswa yang menunduk ke bawah meja saat pelajaran berlangsung, menurut laporan yang disusun oleh tim peneliti setempat.","Orang tua kesulitan menghubungi anak pada jam pulang sekolah karena ponsel disimpan di loker sampai bel pulang berbunyi, walaupun masalah ini hanya muncul pada sebagian kecil kesempatan.","Sekolah membeli loker baru dari dana bantuan operasional yang sudah disetujui oleh komite sekolah pada awal tahun ajaran, menurut keterangan pihak pengelola kepada para wartawan.","Beberapa siswa menitipkan ponsel di loker sehingga harus antre di pagi hari dan sesekali terlambat masuk ke dalam kelas, meskipun kejadian itu tidak berlangsung terus-menerus sepanjang tahun.","Pengamatan guru menunjukkan sumber utama gangguan konsentrasi siswa bukan ponsel, melainkan kelelahan akibat jam pelajaran yang terlalu panjang, sehingga tanpa ponsel pun siswa tetap sulit fokus."],"a":4,"why":"Kunci: E\nInti argumen: Larangan membawa ponsel ke sekolah dapat meningkatkan konsentrasi belajar karena siswa tidak terganggu notifikasi.\nA. Justru MEMPERKUAT. Menunjukkan larangan mengurangi gangguan, mendukung argumen.\nB. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Urusan komunikasi, tidak membantah efek ponsel pada konsentrasi.\nC. Tidak relevan. Soal pendanaan loker, tidak menyangkut konsentrasi.\nD. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Masalah teknis antrean yang bisa diatur ulang.\nE. MEMPERLEMAH TOTAL. Mengganti akar masalah: penyebab hilangnya fokus adalah kelelahan, jadi menyingkirkan ponsel tidak meningkatkan konsentrasi.\nTips: pelemah terkuat menyerang mekanisme atau akar masalahnya, bukan sekadar menyebut kendala teknis yang masih bisa diperbaiki.","tables":[],"figs":[],"id":358},{"cat":"argumen","q":"Penyemprotan pestisida dengan drone dapat meningkatkan hasil panen karena hama dikendalikan lebih merata. Oleh karena itu, semakin banyak lahan yang disemprot drone, semakin tinggi hasil panen petani.\n\nManakah pernyataan berikut yang MEMPERLEMAH pernyataan di atas?","opts":["Baterai drone hanya bertahan sekitar dua puluh menit sehingga operator harus sering mengganti baterai di tengah proses penyemprotan, namun situasi tersebut biasanya hanya berlangsung sebentar.","Harga drone pertanian turun setiap tahun karena semakin banyak produsen yang memasarkannya di dalam negeri, menurut keterangan pihak pengelola kepada para wartawan, dan hal tersebut diketahui oleh banyak orang di lingkungan itu.","Petak sawah yang disemprot drone mencatat kerusakan tanaman akibat hama jauh lebih rendah dibanding petak sawah yang disemprot secara manual, sebagaimana dicatat petugas selama beberapa bulan pengamatan terakhir.","Penurunan hasil panen di wilayah itu terutama disebabkan kekurangan air irigasi pada musim kemarau, sehingga hama yang terkendali pun tidak membuat tanaman menghasilkan lebih banyak padi.","Sebagian petani belum terlatih mengoperasikan drone sehingga penyemprotan pertama harus dilakukan oleh teknisi dari dinas pertanian, meskipun kejadian itu tidak berlangsung terus-menerus sepanjang tahun."],"a":3,"why":"Kunci: D\nInti argumen: Penyemprotan pestisida dengan drone dapat meningkatkan hasil panen karena hama dikendalikan lebih merata.\nA. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Kendala teknis yang bisa diatasi dengan baterai cadangan.\nB. Tidak relevan. Soal harga alat, tidak menyangkut hasil panen.\nC. Justru MEMPERKUAT. Mendukung argumen bahwa hama terkendali lebih baik.\nD. MEMPERLEMAH TOTAL. Akar masalah hasil panen adalah air, bukan hama; pengendalian hama tidak menaikkan hasil panen.\nE. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Soal keterampilan operator, dapat diselesaikan lewat pelatihan.\nTips: pelemah terkuat menyerang mekanisme atau akar masalahnya, bukan sekadar menyebut kendala teknis yang masih bisa diperbaiki.","tables":[],"figs":[],"id":359},{"cat":"argumen","q":"Pemasangan kamera CCTV di perumahan dapat menurunkan angka pencurian karena pelaku takut terekam. Oleh karena itu, semakin banyak kamera dipasang, semakin sedikit kasus pencurian.\n\nManakah pernyataan berikut yang MEMPERLEMAH pernyataan di atas?","opts":["Sebagian besar pelaku pencurian di perumahan itu menutup wajah dan memakai kendaraan tanpa pelat nomor sehingga tidak dapat dikenali, dan keberadaan kamera tidak pernah membuat mereka takut untuk beraksi.","Setelah kamera dipasang di pintu masuk, petugas keamanan mencatat jumlah orang asing yang masuk tanpa izin menurun tajam, menurut laporan yang disusun oleh tim peneliti setempat, dan hal tersebut diketahui oleh banyak orang di lingkungan itu.","Beberapa kamera mengalami gangguan tampilan pada malam hari sehingga gambar yang terekam kurang jelas dan perlu diperbaiki teknisi, namun situasi tersebut biasanya hanya berlangsung sebentar.","Biaya perawatan kamera ditanggung warga secara patungan sehingga ada warga yang terlambat membayar iuran bulanan, walaupun masalah ini hanya muncul pada sebagian kecil kesempatan, dan kejadian serupa pernah dilaporkan pada tahun-tahun sebelumnya.","Kamera CCTV yang dipasang merupakan produk dalam negeri dan memiliki garansi resmi selama dua tahun dari pabrikan, menurut keterangan pihak pengelola kepada para wartawan, dan kejadian serupa pernah dilaporkan pada tahun-tahun sebelumnya."],"a":0,"why":"Kunci: A\nInti argumen: Pemasangan kamera CCTV di perumahan dapat menurunkan angka pencurian karena pelaku takut terekam.\nA. MEMPERLEMAH TOTAL. Mematahkan asumsi ketakutan terekam: pelaku tidak gentar, jadi kamera tidak mengurangi pencurian.\nB. Justru MEMPERKUAT. Mendukung efek pencegahan kamera.\nC. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Kendala kualitas alat yang bisa dibenahi.\nD. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Masalah iuran, bukan bantahan terhadap efek kamera.\nE. Tidak relevan. Soal merek dan garansi, tidak menyangkut angka pencurian.\nTips: pelemah terkuat menyerang mekanisme atau akar masalahnya, bukan sekadar menyebut kendala teknis yang masih bisa diperbaiki.","tables":[],"figs":[],"id":360},{"cat":"argumen","q":"Penambahan jumlah guru di sebuah sekolah dapat meningkatkan nilai siswa karena setiap siswa mendapat perhatian lebih. Oleh karena itu, semakin banyak guru ditambahkan, semakin tinggi rata-rata nilai siswa.\n\nManakah pernyataan berikut yang MEMPERLEMAH pernyataan di atas?","opts":["Ruang guru menjadi sempit sehingga sebagian guru harus bergantian memakai meja kerja untuk menyiapkan bahan pengajaran, walaupun masalah ini hanya muncul pada sebagian kecil kesempatan.","Gaji guru tambahan dibayar dari dana komite sekolah yang dikumpulkan setiap awal tahun ajaran baru, sebagaimana sudah diumumkan dalam rapat tahunan sejak beberapa waktu lalu.","Di kelas dengan guru pendamping lebih banyak, siswa yang kesulitan berhitung mendapat bimbingan satu per satu dan nilainya naik, sebagaimana dicatat petugas selama beberapa bulan pengamatan terakhir.","Guru tambahan yang direkrut sebagian besar mengajar mata pelajaran yang tidak diujikan dan sibuk dengan tugas administrasi, sehingga jumlah siswa per guru pada mata pelajaran yang diujikan tidak berubah.","Guru baru memerlukan beberapa minggu untuk beradaptasi dengan kebiasaan belajar siswa dan kebijakan sekolah yang berlaku, meskipun kejadian itu tidak berlangsung terus-menerus sepanjang tahun."],"a":3,"why":"Kunci: D\nInti argumen: Penambahan jumlah guru di sebuah sekolah dapat meningkatkan nilai siswa karena setiap siswa mendapat perhatian lebih.\nA. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Masalah fasilitas yang bisa diperbaiki.\nB. Tidak relevan. Soal sumber gaji, tidak menyangkut nilai siswa.\nC. Justru MEMPERKUAT. Mendukung argumen dengan contoh nyata.\nD. MEMPERLEMAH TOTAL. Guru tambahan tidak menambah perhatian pada mata pelajaran yang dinilai, jadi nilai tidak naik.\nE. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Hanya masa adaptasi sementara.\nTips: pelemah terkuat menyerang mekanisme atau akar masalahnya, bukan sekadar menyebut kendala teknis yang masih bisa diperbaiki.","tables":[],"figs":[],"id":361},{"cat":"argumen","q":"Pemasangan lampu sensor gerak di lorong gedung dapat menghemat listrik karena lampu hanya menyala saat ada orang lewat. Oleh karena itu, semakin banyak lampu sensor dipasang, semakin hemat listrik gedung.\n\nManakah pernyataan berikut yang MEMPERLEMAH pernyataan di atas?","opts":["Pengukuran meteran menunjukkan konsumsi listrik lorong turun hampir setengahnya setelah lampu sensor dipasang di seluruh lantai, sebagaimana dicatat petugas selama beberapa bulan pengamatan terakhir.","Desain lampu sensor berbentuk bulat dan warnanya disesuaikan dengan cat dinding gedung agar tampak serasi, menurut keterangan pihak pengelola kepada para wartawan.","Lorong gedung itu dilalui orang tanpa henti sepanjang hari sehingga lampu sensor hampir selalu menyala, dan perangkat sensornya sendiri menyedot listrik lebih besar daripada lampu biasa yang digantikannya.","Pemasangan lampu sensor memakan waktu karena teknisi harus membongkar kabel lama di langit-langit beberapa lantai gedung, namun situasi tersebut biasanya hanya berlangsung sebentar.","Sensor pada beberapa lampu terlalu peka sehingga menyala ketika ada kucing yang melintas di lorong pada malam hari, namun situasi tersebut biasanya hanya berlangsung sebentar."],"a":2,"why":"Kunci: C\nInti argumen: Pemasangan lampu sensor gerak di lorong gedung dapat menghemat listrik karena lampu hanya menyala saat ada orang lewat.\nA. Justru MEMPERKUAT. Bukti penghematan yang mendukung argumen.\nB. Tidak relevan. Soal tampilan, tidak menyangkut penghematan listrik.\nC. MEMPERLEMAH TOTAL. Lampu tidak pernah padam dan sensor boros, jadi total listrik malah naik; kesimpulan runtuh.\nD. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Kendala pemasangan sementara.\nE. Melemahkan sebagian (masalah teknis yang masih bisa diperbaiki). Kepekaan sensor bisa diatur ulang.\
